apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: zone
  labels:
    app.kubernetes.io/name: crossplane-compositions-dns
spec:
  compositeTypeRef:
    apiVersion: dock.tech/v1
    kind: Zone

  mode: Pipeline

  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        delims:
          left: '[['
          right: ']]'
        source: Inline
        inline:
          template: |
            [[- $params        := .observed.composite.resource.spec ]]
            [[- $name          := $params.name ]]
            [[- $namespace     := .observed.composite.resource.metadata.namespace ]]
            [[- $accountName   := $params.aws.accountName ]]
            [[- $zoneName      := $params.zoneName ]]
            [[- $comment       := $params.comment ]]
            [[- $domain        := $params.domain ]]
            [[- $subdomain     := $params.subdomain ]]
            [[- $system        := $params.system ]]
            [[- $environment   := $params.environment ]]
            [[- $tags          := $params.tags ]]
            [[- $import        := $params.import ]]
            [[- $importing     := and $import $import.existing ]]
            [[- $externalName  := $zoneName ]]
            [[- if $importing ]]
            [[- $externalName = $import.zoneId ]]
            [[- end ]]

            [[- $zone := getComposedResource . $name ]]

            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: Zone
            metadata:
              annotations:
                crossplane.io/external-name: [[ $externalName ]]
                [[ setResourceNameAnnotation $name ]]
              name: [[ $name ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              # Adopt existing zone — observe + allow updates to comment/tags;
              # deletion of this XR does NOT delete the AWS zone.
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                name: [[ $zoneName ]]
                [[- if $comment ]]
                comment: [[ $comment ]]
                [[- else if not $importing ]]
                comment: "Managed by APE Platform"
                [[- end ]]
                tags:
                  createdBy: ape-platform
                  domain: [[ $domain ]]
                  subdomain: [[ $subdomain ]]
                  system: [[ $system ]]
                  environment: [[ $environment ]]
                  [[- if $importing ]]
                  imported: "true"
                  [[- end ]]
                  [[- range $key, $value := $tags ]]
                  [[ $key ]]: [[ $value ]]
                  [[- end ]]

            ---
            [[- if $zone.status.atProvider ]]
            apiVersion: dock.tech/v1
            kind: Zone
            status:
              zoneId: [[ $zone.status.atProvider.zoneId ]]
              nameServers: [[ $zone.status.atProvider.nameServers | toJson ]]
              ready: true
              message: [[ if $importing ]]"Zone imported and observed"[[ else ]]"Zone is ready"[[ end ]]
            [[- end ]]

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
