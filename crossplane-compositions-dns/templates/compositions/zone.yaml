apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: zone
  labels:
    app.kubernetes.io/name: crossplane-compositions-dns
spec:
  compositeTypeRef:
    apiVersion: dock.tech/v1
    kind: Zone

  mode: Pipeline

  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        delims:
          left: '[['
          right: ']]'
        source: Inline
        inline:
          template: |
            [[- $params        := .observed.composite.resource.spec ]]
            [[- $name          := $params.name ]]
            [[- $namespace     := .observed.composite.resource.metadata.namespace ]]
            [[- $accountName   := $params.aws.accountName ]]
            [[- $zoneName      := $params.zoneName ]]
            [[- $domain        := $params.domain ]]
            [[- $subdomain     := $params.subdomain ]]
            [[- $system        := $params.system ]]
            [[- $environment   := $params.environment ]]
            [[- $tags          := $params.tags ]]
            [[- $visibility    := default "public" $params.visibility ]]
            [[- $vpcs          := $params.vpcs ]]
            [[- $deletionProtection := $params.deletionProtection ]]
            [[- $import        := $params.import ]]
            [[- $importing     := and $import $import.existing ]]
            [[- $delegatedFromZoneId := $params.delegatedFromZoneId ]]
            [[- $delegatedFromAccountName := default $accountName $params.delegatedFromAccountName ]]

            [[- $firstSameAccountVpc := dict ]]
            [[- $additionalSameAccountVpcs := list ]]
            [[- $crossAccountVpcs := list ]]
            [[- range $vpc := $vpcs ]]
            [[-   $vpcAccount := default $accountName $vpc.accountName ]]
            [[-   if eq $vpcAccount $accountName ]]
            [[-     if not $firstSameAccountVpc.vpcId ]]
            [[-       $firstSameAccountVpc = dict "vpcId" $vpc.vpcId "vpcRegion" $vpc.vpcRegion "accountName" $vpcAccount ]]
            [[-     else ]]
            [[-       $additionalSameAccountVpcs = append $additionalSameAccountVpcs (dict "vpcId" $vpc.vpcId "vpcRegion" $vpc.vpcRegion "accountName" $vpcAccount) ]]
            [[-     end ]]
            [[-   else ]]
            [[-     $crossAccountVpcs = append $crossAccountVpcs (dict "vpcId" $vpc.vpcId "vpcRegion" $vpc.vpcRegion "accountName" $vpcAccount) ]]
            [[-   end ]]
            [[- end ]]

            [[- $zone := getComposedResource . $name ]]
            [[- $delegationName := printf "%s-delegation" $name ]]
            [[- $delegationRecord := getComposedResource . $delegationName ]]

            [[- $effectiveZoneId := "" ]]
            [[- if $importing ]]
            [[-   $effectiveZoneId = $import.zoneId ]]
            [[- else if and $zone.status.atProvider $zone.status.atProvider.zoneId ]]
            [[-   $effectiveZoneId = $zone.status.atProvider.zoneId ]]
            [[- else if and .observed.composite.resource.status .observed.composite.resource.status.zoneId ]]
            [[-   $effectiveZoneId = .observed.composite.resource.status.zoneId ]]
            [[- end ]]

            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: Zone
            metadata:
              annotations:
                [[- if $effectiveZoneId ]]
                crossplane.io/external-name: [[ $effectiveZoneId ]]
                [[- end ]]
                [[ setResourceNameAnnotation $name ]]
              name: [[ $name ]]
              namespace: [[ $namespace ]]
            spec:
              [[- if $deletionProtection ]]
              deletionPolicy: Orphan
              [[- end ]]
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                name: [[ $zoneName ]]
                [[- if not $importing ]]
                comment: "Managed by APE Platform"
                [[- end ]]
                tags:
                  createdBy: ape-platform
                  domain: [[ $domain ]]
                  subdomain: [[ $subdomain ]]
                  system: [[ $system ]]
                  environment: [[ $environment ]]
                  visibility: [[ $visibility ]]
                  [[- if $importing ]]
                  imported: "true"
                  [[- end ]]
                  [[- range $key, $value := $tags ]]
                  [[ $key ]]: [[ $value ]]
                  [[- end ]]
                [[- if and (eq $visibility "private") $firstSameAccountVpc.vpcId ]]
                vpc:
                  - vpcId: [[ $firstSameAccountVpc.vpcId ]]
                    vpcRegion: [[ $firstSameAccountVpc.vpcRegion ]]
                [[- end ]]

            [[- if and $delegatedFromZoneId $zone.status.atProvider $zone.status.atProvider.nameServers ]]
            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: Record
            metadata:
              annotations:
                crossplane.io/external-name: [[ printf "%s_%s_NS" $delegatedFromZoneId $zoneName ]]
                [[ setResourceNameAnnotation $delegationName ]]
              name: [[ $delegationName ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $delegatedFromAccountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                name: [[ $zoneName ]]
                type: NS
                zoneId: [[ $delegatedFromZoneId ]]
                ttl: 172800
                records: [[ $zone.status.atProvider.nameServers | toJson ]]
            [[- end ]]

            [[- if and (eq $visibility "private") $additionalSameAccountVpcs $zone.status.atProvider $zone.status.atProvider.zoneId ]]
            [[- $childZoneId := $zone.status.atProvider.zoneId ]]
            [[- range $vpc := $additionalSameAccountVpcs ]]
            [[- $assocName := printf "%s-vpcassoc-%s" $name $vpc.vpcId ]]
            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: ZoneAssociation
            metadata:
              annotations:
                crossplane.io/external-name: [[ printf "%s:%s" $childZoneId $vpc.vpcId ]]
                [[ setResourceNameAnnotation $assocName ]]
              name: [[ $assocName ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $vpc.accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                vpcId: [[ $vpc.vpcId ]]
                vpcRegion: [[ $vpc.vpcRegion ]]
                zoneId: [[ $childZoneId ]]
            [[- end ]]
            [[- end ]]

            [[- if and (eq $visibility "private") $crossAccountVpcs $zone.status.atProvider $zone.status.atProvider.zoneId ]]
            [[- $childZoneId := $zone.status.atProvider.zoneId ]]
            [[- range $vpc := $crossAccountVpcs ]]
            [[- $authName := printf "%s-vpcauth-%s" $name $vpc.vpcId ]]
            [[- $assocName := printf "%s-vpcassoc-%s" $name $vpc.vpcId ]]
            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: VPCAssociationAuthorization
            metadata:
              annotations:
                crossplane.io/external-name: [[ printf "%s:%s" $childZoneId $vpc.vpcId ]]
                [[ setResourceNameAnnotation $authName ]]
              name: [[ $authName ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                vpcId: [[ $vpc.vpcId ]]
                vpcRegion: [[ $vpc.vpcRegion ]]
                zoneId: [[ $childZoneId ]]
            ---
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: ZoneAssociation
            metadata:
              annotations:
                crossplane.io/external-name: [[ printf "%s:%s" $childZoneId $vpc.vpcId ]]
                [[ setResourceNameAnnotation $assocName ]]
              name: [[ $assocName ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $vpc.accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                vpcId: [[ $vpc.vpcId ]]
                vpcRegion: [[ $vpc.vpcRegion ]]
                zoneId: [[ $childZoneId ]]
            [[- end ]]
            [[- end ]]

            ---
            [[- if $zone.status.atProvider ]]
            apiVersion: dock.tech/v1
            kind: Zone
            status:
              zoneId: [[ $zone.status.atProvider.zoneId ]]
              nameServers: [[ $zone.status.atProvider.nameServers | toJson ]]
              ready: true
              message: [[ if $importing ]]"Zone imported and observed"[[ else ]]"Zone is ready"[[ end ]]
            [[- end ]]

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
