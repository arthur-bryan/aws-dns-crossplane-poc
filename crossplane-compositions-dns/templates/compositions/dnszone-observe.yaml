apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnszone-observe
  labels:
    app.kubernetes.io/name: crossplane-compositions-dns
    composition.type: observe
spec:
  compositeTypeRef:
    apiVersion: dock.tech/v1
    kind: DNSZone

  mode: Pipeline

  pipeline:
    - step: environmentConfigs
      functionRef:
        name: crossplane-contrib-function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Selector
              selector:
                mode: Single
                matchLabels:
                  - type: FromCompositeFieldPath
                    key: domain
                    valueFromFieldPath: spec.domain
                  - type: FromCompositeFieldPath
                    key: subdomain
                    valueFromFieldPath: spec.subdomain
                  - type: FromCompositeFieldPath
                    key: system
                    valueFromFieldPath: spec.system
                  - type: FromCompositeFieldPath
                    key: environment
                    valueFromFieldPath: spec.environment

    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        delims:
          left: '[['
          right: ']]'
        source: Inline
        inline:
          template: |
            [[- $params := .observed.composite.resource.spec ]]
            [[- $envs := index .context "apiextensions.crossplane.io/environment" ]]
            [[- $zoneName := $params.zoneName ]]
            [[- $accountName := $envs.aws.accountName ]]
            [[- $region := default $envs.aws.region $params.aws.region ]]
            [[- $domain := $params.domain ]]
            [[- $subdomain := $params.subdomain ]]
            [[- $system := $params.system ]]

            ---
            apiVersion: route53.aws.upbound.io/v1beta1
            kind: Zone
            metadata:
              name: [[ $zoneName | replace "." "-" ]]
              namespace: [[ printf "%s-%s-%s" $system $domain $subdomain | lower ]]
              annotations:
                crossplane.io/external-name: [[ $zoneName ]]
                [[ setResourceNameAnnotation "zone" ]]
            spec:
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              managementPolicies:
                - Observe
              deletionPolicy: Orphan
              forProvider:
                region: [[ $region ]]

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
