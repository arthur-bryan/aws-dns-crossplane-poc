apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: dnsrequests.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: DNSRequest
    plural: dnsrequests
  claimNames:
    kind: DNSRequest
    plural: dnsrequests
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # ========================================
                # Hierarchy Fields (REQUIRED - APE Platform)
                # ========================================
                domain:
                  description: "The parent domain (e.g., cross, saas, bass)"
                  type: string
                  minLength: 1
                subdomain:
                  description: "The parent subdomain (e.g., cloud, payments, identity)"
                  type: string
                  minLength: 1
                system:
                  description: "The parent system (e.g., ape, api-gateway, user-service)"
                  type: string
                  minLength: 1
                environment:
                  description: "Target environment"
                  type: string
                  enum: [dev, hml, poc, prd]

                # ========================================
                # AWS Metadata (REQUIRED - APE Platform)
                # ========================================
                aws:
                  description: "AWS account metadata"
                  type: object
                  required:
                    - account
                    - accountName
                    - region
                  properties:
                    account:
                      description: "AWS account ID (12 digits)"
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: "AWS account name (matches ClusterProviderConfig)"
                      type: string
                      minLength: 1
                    region:
                      description: "AWS region"
                      type: string
                      default: us-east-2
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                # ========================================
                # DNS Request Fields (Existing)
                # ========================================
                requesterName:
                  type: string
                  description: Name or email of person making request
                  minLength: 2
                  maxLength: 100
                requesterId:
                  type: string
                  description: Optional requester ID (Slack user ID, etc.)
                  maxLength: 100
                originTicket:
                  type: string
                  description: URL to originating ticket (Jira, etc.)
                  pattern: '^https?://'
                action:
                  type: string
                  description: DNS action to perform
                  enum:
                    - create_hosted_zone
                    - create_record
                    - create_alias_record
                    - create_weighted_record
                    - update_record
                    - update_weighted_record
                env:
                  type: string
                  description: Target environment
                  enum:
                    - dev
                    - hml
                    - prd
                hostedzone:
                  type: string
                  description: DNS zone name
                  minLength: 4
                  maxLength: 253
                businessUnit:
                  type: string
                  description: Business unit
                  enum:
                    - acquiring
                    - banking
                    - credit
                    - global
                    - risk
                    - shared
                records:
                  type: array
                  description: DNS records to create/update
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Record name (subdomain)
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        description: DNS record type
                        enum:
                          - A
                          - CNAME
                          - TXT
                          - ALIAS
                          - NS
                      value:
                        type: string
                        description: Record value (for regular records)
                        maxLength: 255
                      ttl:
                        type: string
                        description: Time to live in seconds
                      aliasTarget:
                        type: object
                        description: ALIAS target configuration
                        properties:
                          dnsName:
                            type: string
                            description: Target DNS name
                            maxLength: 255
                          hostedZoneId:
                            type: string
                            description: Route53 hosted zone ID (manual mode)
                            minLength: 10
                            maxLength: 32
                          resourceType:
                            type: string
                            description: AWS resource type for auto-resolution
                            enum:
                              - cloudfront
                              - alb
                              - nlb
                              - elb
                              - s3
                              - api_gateway
                              - global_accelerator
                          resourceRegion:
                            type: string
                            description: AWS region (for regional services)
                          evaluateTargetHealth:
                            type: boolean
                            description: Enable Route53 health checks
                            default: false
                      weight:
                        type: integer
                        description: Routing weight (percentage 0-100)
                        minimum: 0
                        maximum: 100
                      setidentifier:
                        type: string
                        description: Unique identifier for routing policy
                        maxLength: 128
                      oldValue:
                        type: string
                        description: Current value (for update operations)
                        maxLength: 255
                      newValue:
                        type: string
                        description: New value (for update operations)
                        maxLength: 255
                      oldWeight:
                        type: string
                        description: Current weight (for weighted update)
                      newWeight:
                        type: string
                        description: New weight (for weighted update)
                      recordAValue:
                        type: string
                        description: Value for record A (weighted create)
                      recordAWeight:
                        type: integer
                        description: Weight for record A (percentage)
                        minimum: 0
                        maximum: 100
                      recordASetIdentifier:
                        type: string
                        description: Set identifier for record A
                      recordBValue:
                        type: string
                        description: Value for record B (weighted create)
                      recordBWeight:
                        type: integer
                        description: Weight for record B (percentage)
                        minimum: 0
                        maximum: 100
                      recordBSetIdentifier:
                        type: string
                        description: Set identifier for record B
                    required:
                      - name
                      - type
                deploymentOverride:
                  type: object
                  description: Deployment control overrides
                  properties:
                    overrideFreeze:
                      type: boolean
                      description: Override freeze period
                      default: false
                    reason:
                      type: string
                      description: Reason for override (required if overrideFreeze=true)
                      minLength: 10
                      maxLength: 500
              required:
                # Hierarchy fields (NEW)
                - domain
                - subdomain
                - system
                - environment
                # AWS metadata (NEW)
                - aws
                # DNS request fields (EXISTING)
                - requesterName
                - action
                - env
                - hostedzone
                - businessUnit
                - originTicket
            status:
              type: object
              properties:
                requestId:
                  type: string
                  description: Unique request identifier
                status:
                  type: string
                  description: Current request status
                  enum:
                    - pending_infrastructure_approval
                    - pending_security_approval
                    - approved
                    - pending_deploy
                    - deploy_in_progress
                    - deployed
                    - failed
                    - deploy_cancelled
                    - denied_by_infrastructure
                    - denied_by_security
                message:
                  type: string
                  description: Human-readable status message
                autoApproved:
                  type: boolean
                  description: True if auto-approved for certificate validation
                  default: false
                hasPublicRecord:
                  type: boolean
                  description: True if request contains public IP records
                infrastructureApprover:
                  type: string
                  description: Email of infrastructure approver
                infrastructureApprovedAt:
                  type: string
                  description: Timestamp of infrastructure approval
                  format: date-time
                securityApprover:
                  type: string
                  description: Email of security approver
                securityApprovedAt:
                  type: string
                  description: Timestamp of security approval
                  format: date-time
                deployedBy:
                  type: string
                  description: Email of person who triggered deployment
                deployedAt:
                  type: string
                  description: Timestamp of deployment
                  format: date-time
                prNumber:
                  type: integer
                  description: GitHub PR number (for legacy Terraform bridge)
                branchName:
                  type: string
                  description: Git branch name
                prUrl:
                  type: string
                  description: GitHub PR URL
                rollbackRequestId:
                  type: string
                  description: ID of rollback request (if rolled back)
                rollbackAt:
                  type: string
                  description: Timestamp of rollback
                  format: date-time
                zoneLock:
                  type: string
                  description: Zone lock key for FIFO serialization
                composedResources:
                  type: array
                  description: References to composed Crossplane resources
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                conditions:
                  type: array
                  description: Standard Kubernetes conditions
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
