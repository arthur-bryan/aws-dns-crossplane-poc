apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: records.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: Record
    plural: records
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  description: "Resource name"
                  type: string
                  minLength: 1
                domain:
                  description: "The parent domain (e.g., cross, saas, bass)"
                  type: string
                  minLength: 1
                subdomain:
                  description: "The parent subdomain (e.g., cloud, payments, identity)"
                  type: string
                  minLength: 1
                system:
                  description: "The parent system (e.g., ape, api-gateway, user-service)"
                  type: string
                  minLength: 1
                environment:
                  description: "Target environment"
                  type: string
                  enum: [dev, hml, poc, prd]

                aws:
                  description: "AWS account metadata"
                  type: object
                  required:
                    - account
                    - accountName
                    - region
                  properties:
                    account:
                      description: "AWS account ID (12 digits)"
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: "AWS account name (matches ClusterProviderConfig)"
                      type: string
                      minLength: 1
                    region:
                      description: "AWS region"
                      type: string
                      default: us-east-2
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                zoneId:
                  type: string
                  description: "Route53 hosted zone ID (Z...)"
                  pattern: '^Z[A-Z0-9]+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneId is immutable"

                zoneName:
                  type: string
                  description: "DNS zone name (alternative to zoneId)"
                  minLength: 4
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneName is immutable"

                recordName:
                  type: string
                  description: "Record name (e.g., 'www' or 'api.staging')"
                  minLength: 1
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "recordName is immutable"

                type:
                  type: string
                  description: "DNS record type"
                  enum: [A, AAAA, CNAME, TXT, ALIAS]
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "type is immutable"

                ttl:
                  type: integer
                  description: "TTL in seconds (not used for ALIAS records)"
                  minimum: 60
                  maximum: 86400
                  default: 3600

                values:
                  type: array
                  description: "Record values (for A, AAAA, CNAME, TXT)"
                  items:
                    type: string
                  minItems: 1

                aliasTarget:
                  type: object
                  description: "ALIAS target (for ALIAS records only)"
                  properties:
                    dnsName:
                      type: string
                      description: "Target DNS name"
                    serviceType:
                      type: string
                      description: "AWS service type (auto-fills hostedZoneId)"
                      enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, Custom]
                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "serviceType is immutable"
                    hostedZoneId:
                      type: string
                      description: "Target hosted zone ID (required only for Custom serviceType)"
                    evaluateTargetHealth:
                      type: boolean
                      description: "Evaluate target health"
                      default: false
                  required:
                    - dnsName
                    - serviceType

                # Weighted routing policy
                setIdentifier:
                  type: string
                  description: "Unique identifier for weighted/routing policy records"
                  minLength: 1
                  maxLength: 128

                weight:
                  type: integer
                  description: "Traffic weight (0-255) for weighted routing"
                  minimum: 0
                  maximum: 255

              required:
                - name
                - domain
                - subdomain
                - system
                - environment
                - aws
                - recordName
                - type

              # Validation: Either zoneId or zoneName must be provided
              x-kubernetes-validations:
                - rule: "has(self.zoneId) || has(self.zoneName)"
                  message: "Either zoneId or zoneName must be provided"
                - rule: "self.type != 'ALIAS' || has(self.aliasTarget)"
                  message: "aliasTarget is required for ALIAS records"
                - rule: "self.type == 'ALIAS' || has(self.values)"
                  message: "values is required for non-ALIAS records"
                - rule: "!has(self.aliasTarget) || self.aliasTarget.serviceType != 'Custom' || has(self.aliasTarget.hostedZoneId)"
                  message: "hostedZoneId is required when serviceType is Custom"
                - rule: "!has(self.setIdentifier) || has(self.weight)"
                  message: "weight is required when setIdentifier is provided (weighted routing)"
                - rule: "!has(self.weight) || has(self.setIdentifier)"
                  message: "setIdentifier is required when weight is provided (weighted routing)"

            status:
              type: object
              properties:
                fqdn:
                  type: string
                  description: "Fully qualified domain name of the record"
                recordId:
                  type: string
                  description: "Record identifier"
                ready:
                  type: boolean
                  description: "Record is ready"
                message:
                  type: string
                  description: "Human-readable status message"
