apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: records.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: Record
    plural: records
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  description: "Resource name"
                  type: string
                  minLength: 1
                domain:
                  description: "The parent domain (e.g., cross, saas, bass)"
                  type: string
                  minLength: 1
                subdomain:
                  description: "The parent subdomain (e.g., cloud, payments, identity)"
                  type: string
                  minLength: 1
                system:
                  description: "The parent system (e.g., ape, api-gateway, user-service)"
                  type: string
                  minLength: 1
                environment:
                  description: "Target environment"
                  type: string
                  enum: [dev, hml, poc, prd]

                aws:
                  description: "AWS account metadata"
                  type: object
                  required:
                    - account
                    - accountName
                    - region
                  properties:
                    account:
                      description: "AWS account ID (12 digits)"
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: "AWS account name (matches ClusterProviderConfig)"
                      type: string
                      minLength: 1
                    region:
                      description: "AWS region"
                      type: string
                      default: us-east-2
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                zoneId:
                  type: string
                  description: "Route53 hosted zone ID (Z...)"
                  pattern: '^Z[A-Z0-9]+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneId is immutable"

                zoneName:
                  type: string
                  description: "DNS zone name (alternative to zoneId)"
                  minLength: 4
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneName is immutable"

                recordName:
                  type: string
                  description: "Record name (e.g., 'www', 'api.staging', or empty for apex / zone root)"
                  minLength: 0
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "recordName is immutable"

                type:
                  type: string
                  description: "DNS record type"
                  enum: [A, AAAA, CNAME, TXT, ALIAS, MX, SRV, NS, CAA, PTR]
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "type is immutable"

                ttl:
                  type: integer
                  description: "TTL in seconds (not used for ALIAS records)"
                  minimum: 60
                  maximum: 86400
                  default: 3600

                values:
                  type: array
                  description: "Record values (for A, AAAA, CNAME, TXT)"
                  items:
                    type: string
                  minItems: 1

                aliasTarget:
                  type: object
                  description: "ALIAS target (for ALIAS records only)"
                  properties:
                    dnsName:
                      type: string
                      description: "Target DNS name"
                    serviceType:
                      type: string
                      description: "AWS service type (auto-fills hostedZoneId)"
                      enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, ElasticBeanstalk, Custom]
                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "serviceType is immutable"
                    region:
                      type: string
                      description: "Region of the TARGET resource (required for ALB/NLB/S3Website/APIGateway; ignored for CloudFront/GlobalAccelerator/Custom). In cross-account DNS patterns this is the region where the ALB/NLB lives, NOT the DNS account's region."
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                    hostedZoneId:
                      type: string
                      description: "Target hosted zone ID (required only for Custom serviceType)"
                    evaluateTargetHealth:
                      type: boolean
                      description: "Evaluate target health"
                      default: false
                  required:
                    - dnsName
                    - serviceType

                # Routing policies (at most ONE of weighted/failover/latency/geolocation/multivalue).
                # All routing policies use setIdentifier to disambiguate
                # multiple records sharing the same name+type.
                setIdentifier:
                  type: string
                  description: "Unique identifier for routing policy records"
                  minLength: 1
                  maxLength: 128

                weight:
                  type: integer
                  description: "Traffic weight (0-255) for weighted routing"
                  minimum: 0
                  maximum: 255

                failoverRoutingPolicy:
                  type: object
                  description: "Failover routing (primary/secondary); requires healthCheckId on the PRIMARY record"
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [PRIMARY, SECONDARY]

                latencyRoutingPolicy:
                  type: object
                  description: "Latency-based routing; Route53 returns the answer from the region with the lowest latency to the client"
                  required: [region]
                  properties:
                    region:
                      type: string
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                geolocationRoutingPolicy:
                  type: object
                  description: "Geolocation routing based on client's approximate location"
                  properties:
                    continent:
                      type: string
                      enum: ["*", AF, AN, AS, EU, OC, NA, SA]
                    country:
                      type: string
                      description: "ISO 3166-1 alpha-2 country code, or '*' for default"
                    subdivision:
                      type: string
                      description: "US state code (only when country=US)"

                geoproximityRoutingPolicy:
                  type: object
                  description: "Geoproximity routing based on an AWS region or arbitrary lat/long coordinates; `bias` shrinks or expands the geographic region used for matching"
                  properties:
                    awsRegion:
                      type: string
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                      description: "Route traffic near an AWS region (omit if coordinates/localZoneGroup is used)"
                    coordinates:
                      type: object
                      description: "Route traffic near these coordinates (omit if awsRegion/localZoneGroup is used)"
                      properties:
                        latitude: { type: string }
                        longitude: { type: string }
                      required: [latitude, longitude]
                    localZoneGroup:
                      type: string
                      description: "AWS local zone group (e.g. us-phx-1)"
                    bias:
                      type: integer
                      minimum: -90
                      maximum: 90
                      description: "Shrink (-) or expand (+) the matching area; default 0"

                multivalueAnswerRoutingPolicy:
                  type: boolean
                  default: false
                  description: "Return multiple random answers (up to 8); requires setIdentifier"

                healthCheckId:
                  type: string
                  description: "Route53 health check ID; used with failover / multivalue routing"
                  pattern: '^[a-f0-9-]+$'

                import:
                  type: object
                  description: "Import an existing Route53 record instead of creating a new one"
                  properties:
                    existing:
                      type: boolean
                      default: false
                      description: "True to adopt an existing AWS Route53 record. zoneId (top-level) must point at the existing zone."

              required:
                - name
                - domain
                - subdomain
                - system
                - environment
                - aws
                - zoneId
                - zoneName
                - recordName
                - type

              x-kubernetes-validations:
                - rule: "self.type != 'ALIAS' || has(self.aliasTarget)"
                  message: "aliasTarget is required for ALIAS records"
                - rule: "self.type == 'ALIAS' || has(self.values)"
                  message: "values is required for non-ALIAS records"
                - rule: "!has(self.aliasTarget) || self.aliasTarget.serviceType != 'Custom' || has(self.aliasTarget.hostedZoneId)"
                  message: "hostedZoneId is required when serviceType is Custom"
                - rule: "!has(self.weight) || has(self.setIdentifier)"
                  message: "setIdentifier is required when weight is provided (weighted routing)"
                - rule: "!has(self.failoverRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for failover routing"
                - rule: "!has(self.latencyRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for latency routing"
                - rule: "!has(self.geolocationRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for geolocation routing"
                - rule: "!has(self.geoproximityRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for geoproximity routing"
                - rule: "!self.multivalueAnswerRoutingPolicy || has(self.setIdentifier)"
                  message: "setIdentifier is required for multivalue-answer routing"
                # Only one routing policy at a time.
                - rule: "(has(self.weight) ? 1 : 0) + (has(self.failoverRoutingPolicy) ? 1 : 0) + (has(self.latencyRoutingPolicy) ? 1 : 0) + (has(self.geolocationRoutingPolicy) ? 1 : 0) + (has(self.geoproximityRoutingPolicy) ? 1 : 0) + (self.multivalueAnswerRoutingPolicy ? 1 : 0) <= 1"
                  message: "At most one routing policy may be specified (weight / failover / latency / geolocation / geoproximity / multivalue)"

            status:
              type: object
              properties:
                fqdn:
                  type: string
                  description: "Fully qualified domain name of the record"
                recordId:
                  type: string
                  description: "Record identifier"
                ready:
                  type: boolean
                  description: "Record is ready"
                message:
                  type: string
                  description: "Human-readable status message"
