apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: zones.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: Zone
    plural: zones
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  description: The zone name.
                  type: string
                  minLength: 1
                domain:
                  description: The zone domain.
                  type: string
                  minLength: 1
                subdomain:
                  description: The zone subdomain.
                  type: string
                  minLength: 1
                system:
                  description: The zone system.
                  type: string
                  minLength: 1
                environment:
                  description: The zone environment.
                  type: string
                  enum: [dev, hml, poc, prd]

                aws:
                  description: AWS account metadata.
                  type: object
                  required:
                    - account
                    - accountName
                  properties:
                    account:
                      description: AWS account ID.
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: AWS account name.
                      type: string
                      minLength: 1

                zoneName:
                  type: string
                  description: DNS zone name.
                  minLength: 4
                  maxLength: 253
                  pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneName is immutable"

                tags:
                  type: object
                  description: Additional AWS tags.
                  additionalProperties:
                    type: string

                visibility:
                  type: string
                  enum: [public, private]
                  default: public
                  description: Zone visibility.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "visibility is immutable after creation"

                deletionProtection:
                  type: boolean
                  default: false
                  description: Deletion protection.

                vpcs:
                  type: array
                  description: VPC associations.
                  items:
                    type: object
                    required: [vpcId, vpcRegion]
                    properties:
                      vpcId:
                        type: string
                        pattern: '^vpc-[a-f0-9]+$'
                        description: VPC ID.
                      vpcRegion:
                        type: string
                        pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                        description: VPC region.
                      accountName:
                        type: string
                        minLength: 1
                        description: AccountName matching a ClusterProviderConfig that owns the VPC. When equal to spec.aws.accountName the VPC is associated inline at zone creation. When different the platform emits a VPCAssociationAuthorization in this account plus a ZoneAssociation in the zone's account so the cross-account association is built without manual intervention. Defaults to spec.aws.accountName.

                import:
                  type: object
                  description: Import existing zone.
                  properties:
                    existing:
                      type: boolean
                      default: false
                      description: Import existing zone.
                    zoneId:
                      type: string
                      description: Zone ID.
                      pattern: '^Z[A-Z0-9]+$'
                  x-kubernetes-validations:
                    - rule: "!self.existing || has(self.zoneId)"
                      message: "spec.import.zoneId is required when spec.import.existing is true"
                    - rule: "!has(self.zoneId) || self.existing"
                      message: "spec.import.zoneId is only valid when spec.import.existing is true"

                delegatedFromZoneId:
                  type: string
                  description: Parent zone ID for sub-zone delegation. When set, an NS record for this zone is auto-created in the parent zone.
                  pattern: '^Z[A-Z0-9]+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "delegatedFromZoneId is immutable"

                delegatedFromAccountName:
                  type: string
                  description: AccountName of the ClusterProviderConfig holding the parent zone. The NS delegation Record MR uses this for its providerConfigRef so the record lands in the right account when child and parent live apart. Defaults to spec.aws.accountName.
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "delegatedFromAccountName is immutable"

              required:
                - name
                - domain
                - subdomain
                - system
                - environment
                - aws
                - zoneName

              x-kubernetes-validations:
                - rule: "!self.zoneName.endsWith('.')"
                  message: "zoneName must not end with a dot"
                - rule: "!self.zoneName.startsWith('-')"
                  message: "zoneName must not start with hyphen"
                - rule: "!self.zoneName.contains('..')"
                  message: "zoneName must not contain consecutive dots"
                - rule: "!has(self.visibility) || self.visibility != 'private' || (has(self.vpcs) && size(self.vpcs) >= 1)"
                  message: "visibility=private requires at least one vpcs entry"

            status:
              type: object
              properties:
                zoneId:
                  type: string
                  description: Zone ID.
                nameServers:
                  type: array
                  description: Name servers.
                  items:
                    type: string
                ready:
                  type: boolean
                  description: Zone ready.
                message:
                  type: string
                  description: Status message.
