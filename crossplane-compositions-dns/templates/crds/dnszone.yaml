apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: dnszones.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: DNSZone
    plural: dnszones
  claimNames:
    kind: DNSZone
    plural: dnszones
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                domain:
                  description: "The parent domain (e.g., cross, saas, bass)"
                  type: string
                  minLength: 1
                subdomain:
                  description: "The parent subdomain (e.g., cloud, payments, identity)"
                  type: string
                  minLength: 1
                system:
                  description: "The parent system (e.g., ape, api-gateway, user-service)"
                  type: string
                  minLength: 1
                environment:
                  description: "Target environment"
                  type: string
                  enum: [dev, hml, poc, prd]

                aws:
                  description: "AWS account metadata"
                  type: object
                  required:
                    - account
                    - accountName
                    - region
                  properties:
                    account:
                      description: "AWS account ID (12 digits)"
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: "AWS account name (matches ClusterProviderConfig)"
                      type: string
                      minLength: 1
                    region:
                      description: "AWS region"
                      type: string
                      default: us-east-2
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                zoneName:
                  type: string
                  description: DNS zone name (FQDN without trailing dot)
                  minLength: 4
                  maxLength: 253
                  pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'

                comment:
                  type: string
                  description: Optional comment for the zone
                  maxLength: 256

                tags:
                  type: object
                  description: Additional AWS tags (hierarchy tags added automatically)
                  additionalProperties:
                    type: string

                records:
                  type: array
                  description: DNS records in this zone (max 500 for CloudFormation batch)
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Record name (relative to zone or FQDN)
                      type:
                        type: string
                        description: Record type (AWS Route53 supported types)
                        enum: [A, AAAA, CNAME, MX, NS, PTR, SOA, SRV, TXT, CAA, ALIAS]
                      ttl:
                        type: integer
                        description: TTL in seconds
                        minimum: 60
                        maximum: 86400
                      values:
                        type: array
                        description: Record values
                        items:
                          type: string
                      aliasTarget:
                        type: object
                        description: ALIAS target (for ALIAS records)
                        properties:
                          dnsName:
                            type: string
                          hostedZoneId:
                            type: string
                          evaluateTargetHealth:
                            type: boolean
                            default: false
                      setIdentifier:
                        type: string
                        description: Unique identifier for weighted/latency routing policies
                      weight:
                        type: integer
                        description: Weight for weighted routing policy (0-255)
                        minimum: 0
                        maximum: 255
                    required:
                      - name
                      - type

              required:
                - domain
                - subdomain
                - system
                - environment
                - aws
                - zoneName

              x-kubernetes-validations:
                - rule: "!self.zoneName.endsWith('.')"
                  message: "zoneName must not end with a dot"
                - rule: "!self.zoneName.startsWith('-')"
                  message: "zoneName must not start with hyphen"
                - rule: "!self.zoneName.contains('..')"
                  message: "zoneName must not contain consecutive dots"

            status:
              type: object
              properties:
                zoneId:
                  type: string
                  description: Route53 hosted zone ID
                nameServers:
                  type: array
                  description: NS records for zone delegation
                  items:
                    type: string
                ready:
                  type: boolean
                  description: Zone is ready for use
                message:
                  type: string
                  description: Human-readable status message
                conditions:
                  type: array
                  description: Standard Kubernetes conditions
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
