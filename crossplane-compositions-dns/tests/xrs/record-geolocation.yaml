---
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: record-api-geo-eu.example.com
  namespace: system-infrastructure-dev
spec:
  name: record-api-geo-eu.example.com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneId: Z1234567890ABC
  zoneName: example.com
  recordName: api
  type: A
  values:
    - 192.0.2.20
  ttl: 60
  setIdentifier: eu-continent
  geolocationRoutingPolicy:
    continent: EU
