---
# ALIAS → Elastic Beanstalk in us-west-2. Verifies the EB zone-ID map.
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: record-app.example.com
  namespace: system-infrastructure-dev
spec:
  name: record-app.example.com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneId: Z1234567890ABC
  zoneName: example.com
  recordName: app
  type: ALIAS
  aliasTarget:
    serviceType: ElasticBeanstalk
    region: us-west-2
    dnsName: my-env.us-west-2.elasticbeanstalk.com
    evaluateTargetHealth: false
