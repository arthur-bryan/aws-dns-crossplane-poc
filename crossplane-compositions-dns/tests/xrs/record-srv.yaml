---
# SRV record (service discovery).
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: record-_sip._tcp.example.com
  namespace: system-infrastructure-dev
spec:
  name: record-_sip._tcp.example.com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneId: Z1234567890ABC
  zoneName: example.com
  recordName: _sip._tcp
  type: SRV
  values:
    - "10 60 5060 sipserver1.example.com"
    - "20 40 5060 sipserver2.example.com"
  ttl: 3600
