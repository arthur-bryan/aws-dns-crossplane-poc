apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-demo-prd
  namespace: default
  description: DNS Record managed by template
  annotations:
    dock.tech/scaffolder-editable-template: dns-record-edit
    dock.tech/scaffolder-parameters: '{"name":"infrastructure-demo-prd","system":"system:default/infrastructure","environment":"prd","zone":"arthurbryan.com","zoneId":"Z03010981ALJFZB4QLU8W","recordName":"demo","type":"A","originalType":"A","ttl":3600,"values":["10.0.0.10"],"enableWeightedRouting":false,"weight":100}'
    # Type change (e.g. A -> CNAME). The converter copies this
    # argocd.argoproj.io/* annotation onto the XR, which makes
    # ArgoCD delete-and-recreate the XR (and therefore the MR),
    # which lets Crossplane drop the old AWS record before
    # creating the new-type one. Without this, Route53 rejects
    # the create with InvalidChangeBatch (name+type collision).
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    environment: prd
    cloud: aws
spec:
  type: dns-record
  cloud: aws
  owner: group:default/infrastructure
  system: system:default/infrastructure
  environment: prd
  zoneId: Z03010981ALJFZB4QLU8W
  zoneName: arthurbryan.com
  recordName: "demo"
  recordType: A
  aws:
    account: 597230762851
    accountName: prd-account
  ttl: 3600
  values:
    - 10.0.0.10
