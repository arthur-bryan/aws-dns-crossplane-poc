---
# Namespace for all XRs (Zone, Record) belonging to the corporate-site system
# in the dev environment. Kept under entities/ so ArgoCD creates it before any
# entity YAML in this path gets synced.
apiVersion: v1
kind: Namespace
metadata:
  name: system-corporate-site-dev
  labels:
    ape.dock.tech/domain: marketing
    ape.dock.tech/subdomain: websites
    ape.dock.tech/system: corporate-site
    ape.dock.tech/environment: dev
