# Backstage catalog seed.
# Hierarchy (APE pattern): Domain → SubDomain → System → Environment.
#
# DNS resources created through the scaffolder land under:
#   entities/environments/{domain}/{subdomain}/{system}/{environment}/resources/aws/
#
# Current hierarchy used for DNS ownership:
#   Domain        cross
#   SubDomain     cloud
#   System        infrastructure
#   Environments  dev, hml, prd (dev seeded here)
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cross
  description: Cross-cutting platform domain
  annotations:
    dock.tech/domain: cross
spec:
  owner: group:default/infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cloud
  description: Cloud subdomain under the cross domain
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
spec:
  owner: group:default/infrastructure
  subdomainOf: cross
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: infrastructure
  description: Platform infrastructure — owns shared DNS, networking, and related resources
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
spec:
  owner: group:default/infrastructure
  domain: cloud
  environments:
    - name: dev
    - name: hml
    - name: prd
---
# Environment entity for dev. One per env the system runs in.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-dev
  namespace: system-infrastructure-dev
  description: Dev environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: dev
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
# Environment entity for hml. Sandbox AWS account 382598791794.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-hml
  namespace: system-infrastructure-hml
  description: HML (homologation) environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: hml
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
# Environment entity for prd. AWS account 597230762851 (base creds).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-prd
  namespace: system-infrastructure-prd
  description: Production environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: prd
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: infrastructure
  description: Infrastructure team — owns platform DNS, networking, and shared AWS resources
spec:
  type: team
  children: []
