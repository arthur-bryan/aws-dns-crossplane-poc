---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: dns
  namespace: dns-eds437
  description: DNS Platform — manages hosted zones and records across AWS accounts
  labels:
    aws: "true"
spec:
  owner: group:default/infrastructure
  domain: cloud
  environments:
    - name: dev
      aws:
        account: "309670275661"
        accountName: dev-account
    - name: prd
      aws:
        account: "597230762851"
        accountName: prd-account
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cross
  description: Cross-cutting platform domain
  annotations:
    dock.tech/domain: cross
spec:
  owner: group:default/infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cloud
  description: Cloud subdomain under the cross domain
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
spec:
  owner: group:default/infrastructure
  subdomainOf: cross
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: infrastructure
  description: Infrastructure Services — DNS, SFTP, email, Active Directory, and other shared platforms
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
  labels:
    aws: "true"
spec:
  owner: group:default/infrastructure
  domain: cloud
  environments:
    - name: dev
      aws:
        account: "309670275661"
        accountName: dev-account
    - name: hml
      aws:
        account: "382598791794"
        accountName: hml-account
    - name: prd
      aws:
        account: "597230762851"
        accountName: prd-account
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-dev
  namespace: system-infrastructure-dev
  description: Dev environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: dev
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-hml
  namespace: system-infrastructure-hml
  description: HML (homologation) environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: hml
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: infrastructure-prd
  namespace: system-infrastructure-prd
  description: Production environment for the infrastructure system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: infrastructure
    dock.tech/environment: prd
spec:
  type: environment
  owner: group:default/infrastructure
  system: infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: infrastructure
  description: Infrastructure Services team — owns the shared services the organization runs on (DNS, SFTP, email, Active Directory, and related platforms)
spec:
  type: team
  children: []
