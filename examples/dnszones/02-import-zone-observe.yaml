apiVersion: dns.crossplane.poc/v1alpha1
kind: DNSZone
metadata:
  name: import-existing-zone-with-500-records
  annotations:
    crossplane.io/external-name: Z1234567890ABC
    crossplane.io/composition-resource-name: dnszones.batch.cloudformation
spec:
  zoneName: myapp.dev.dock.tech
  environment: dev
  comment: "Imported zone with batch record creation"
  tags:
    ManagedBy: Crossplane
    Team: Platform
    CostCenter: Engineering

  records:
    - name: api-001
      type: A
      ttl: 300
      values:
        - "10.0.1.1"

    - name: api-002
      type: A
      ttl: 300
      values:
        - "10.0.1.2"

    - name: api-003
      type: A
      ttl: 300
      values:
        - "10.0.1.3"

    - name: api-004
      type: A
      ttl: 300
      values:
        - "10.0.1.4"

    - name: api-005
      type: A
      ttl: 300
      values:
        - "10.0.1.5"

    - name: web
      type: CNAME
      ttl: 300
      values:
        - "api-001.myapp.dev.dock.tech"

    - name: cdn
      type: ALIAS
      aliasTarget:
        dnsName: d123456.cloudfront.net
        hostedZoneId: Z2FDTNDATAQYW2
        evaluateTargetHealth: false

    - name: _acme-challenge
      type: TXT
      ttl: 300
      values:
        - "verification-token-12345"

