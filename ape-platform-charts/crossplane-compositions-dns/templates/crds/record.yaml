apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: dnsrecords.dock.tech
spec:
  scope: Namespaced
  group: dock.tech
  names:
    kind: DNSRecord
    plural: dnsrecords
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  description: The record name.
                  type: string
                  minLength: 1
                domain:
                  description: The record domain.
                  type: string
                  minLength: 1
                system:
                  description: The record system.
                  type: string
                  minLength: 1
                environment:
                  description: The record environment.
                  type: string
                  enum: [dev, hml, poc, prd]

                aws:
                  description: AWS account metadata.
                  type: object
                  required:
                    - account
                    - accountName
                  properties:
                    account:
                      description: AWS account ID.
                      type: number
                      minimum: 100000000000
                      maximum: 999999999999
                    accountName:
                      description: AWS account name.
                      type: string
                      minLength: 1
                    region:
                      description: AWS region.
                      type: string
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                zoneId:
                  type: string
                  description: Zone ID.
                  pattern: "^Z[A-Z0-9]+$"
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneId is immutable"

                zoneName:
                  type: string
                  description: Zone name.
                  minLength: 4
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneName is immutable"

                recordName:
                  type: string
                  description: Record name.
                  minLength: 0
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "recordName is immutable"

                recordType:
                  type: string
                  description: DNS record type.
                  enum: [A, AAAA, CNAME, TXT, ALIAS, MX, SRV, NS, CAA, PTR]

                ttl:
                  type: integer
                  description: TTL in seconds.
                  minimum: 60
                  maximum: 604800
                  default: 3600

                values:
                  type: array
                  description: Record values.
                  items:
                    type: string
                  minItems: 1

                aliasTarget:
                  type: object
                  description: ALIAS target.
                  properties:
                    dnsName:
                      type: string
                      description: Target DNS name.
                    serviceType:
                      type: string
                      description: >-
                        Service type. Not immutable: changing it, together with
                        region/dnsName, is an ordinary field update -- Route53
                        has no concept of "service type" on an alias target
                        (only hostedZoneId/dnsName/evaluateTargetHealth), so
                        this never requires recreating the record.
                      enum:
                        [
                          CloudFront,
                          ALB,
                          NLB,
                          S3Website,
                          APIGateway,
                          GlobalAccelerator,
                          ElasticBeanstalk,
                          Custom,
                        ]
                    region:
                      type: string
                      description: Target region.
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                    hostedZoneId:
                      type: string
                      description: Target zone ID.
                    evaluateTargetHealth:
                      type: boolean
                      description: Evaluate health.
                      default: false
                  required:
                    - dnsName
                    - serviceType

                setIdentifier:
                  type: string
                  description: Set identifier.
                  minLength: 1
                  maxLength: 128

                weight:
                  type: integer
                  description: Weight.
                  minimum: 0
                  maximum: 255

                failoverRoutingPolicy:
                  type: object
                  description: Failover routing.
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [PRIMARY, SECONDARY]

                latencyRoutingPolicy:
                  type: object
                  description: Latency routing.
                  required: [region]
                  properties:
                    region:
                      type: string
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

                geolocationRoutingPolicy:
                  type: object
                  description: Geolocation routing.
                  properties:
                    continent:
                      type: string
                      enum: ["*", AF, AN, AS, EU, OC, NA, SA]
                    country:
                      type: string
                      description: "ISO 3166-1 alpha-2 country code, or '*' for default"
                    subdivision:
                      type: string
                      description: State code.

                geoproximityRoutingPolicy:
                  type: object
                  description: "Geoproximity routing based on an AWS region or arbitrary lat/long coordinates; `bias` shrinks or expands the geographic region used for matching"
                  properties:
                    awsRegion:
                      type: string
                      pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                      description: "Route traffic near an AWS region (omit if coordinates/localZoneGroup is used)"
                    coordinates:
                      type: object
                      description: "Route traffic near these coordinates (omit if awsRegion/localZoneGroup is used)"
                      properties:
                        latitude: { type: string }
                        longitude: { type: string }
                      required: [latitude, longitude]
                    localZoneGroup:
                      type: string
                      description: "AWS local zone group (e.g. us-phx-1)"
                    bias:
                      type: integer
                      minimum: -90
                      maximum: 90
                      description: Bias.

                multivalueAnswerRoutingPolicy:
                  type: boolean
                  default: false
                  description: Multivalue routing.

                healthCheckId:
                  type: string
                  description: Health check ID.
                  pattern: "^[a-f0-9-]+$"

                import:
                  type: object
                  description: Import existing record.
                  properties:
                    existing:
                      type: boolean
                      default: false
                      description: "True to adopt an existing AWS Route53 record. zoneId (top-level) must point at the existing zone."

              required:
                - name
                - system
                - environment
                - aws
                - zoneId
                - zoneName
                - recordName
                - recordType

              x-kubernetes-validations:
                - rule: "self.recordType != 'ALIAS' || has(self.aliasTarget)"
                  message: "aliasTarget is required for ALIAS records"
                - rule: "self.recordType == 'ALIAS' || has(self.values)"
                  message: "values is required for non-ALIAS records"
                - rule: "!has(self.aliasTarget) || self.aliasTarget.serviceType != 'Custom' || has(self.aliasTarget.hostedZoneId)"
                  message: "hostedZoneId is required when serviceType is Custom"
                - rule: "!has(self.weight) || has(self.setIdentifier)"
                  message: "setIdentifier is required when weight is provided (weighted routing)"
                - rule: "!has(self.failoverRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for failover routing"
                - rule: "!has(self.latencyRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for latency routing"
                - rule: "!has(self.geolocationRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for geolocation routing"
                - rule: "!has(self.geoproximityRoutingPolicy) || has(self.setIdentifier)"
                  message: "setIdentifier is required for geoproximity routing"
                - rule: "!self.multivalueAnswerRoutingPolicy || has(self.setIdentifier)"
                  message: "setIdentifier is required for multivalue-answer routing"
                - rule: "(has(self.weight) ? 1 : 0) + (has(self.failoverRoutingPolicy) ? 1 : 0) + (has(self.latencyRoutingPolicy) ? 1 : 0) + (has(self.geolocationRoutingPolicy) ? 1 : 0) + (has(self.geoproximityRoutingPolicy) ? 1 : 0) + (self.multivalueAnswerRoutingPolicy ? 1 : 0) <= 1"
                  message: "At most one routing policy may be specified (weight / failover / latency / geolocation / geoproximity / multivalue)"

            status:
              type: object
              properties:
                fqdn:
                  type: string
                  description: Record FQDN.
                recordId:
                  type: string
                  description: "Record identifier"
                ready:
                  type: boolean
                  description: "Record is ready"
                message:
                  type: string
                  description: Status message.
