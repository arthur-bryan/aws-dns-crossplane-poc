            [[- else if eq $region "ap-northeast-3" ]][[- $resolvedAliasZoneId = "ZNE5GEY1TIAGY" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "Z2NYPWQ7DFZAZH" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "Z1GKAAAUGATPF1" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z5WN6GAYWG5OB" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z1FRNW7UH4DEZJ" ]]
            [[- else if eq $region "eu-central-2" ]][[- $resolvedAliasZoneId = "Z00227012FSHBMZNNSJJI" ]]
            [[- else if eq $region "eu-north-1" ]][[- $resolvedAliasZoneId = "Z23GO28BZ5AETM" ]]
            [[- else if eq $region "eu-south-1" ]][[- $resolvedAliasZoneId = "Z10VDYYOA2JFKM" ]]
            [[- else if eq $region "eu-south-2" ]][[- $resolvedAliasZoneId = "Z0243492AO4B9S3KI68O" ]]
            [[- else if eq $region "il-central-1" ]][[- $resolvedAliasZoneId = "Z02941091PERNCB1MI5H7" ]]
            [[- else if eq $region "me-central-1" ]][[- $resolvedAliasZoneId = "Z0650511N84AAKGW7QUK" ]]
            [[- else if eq $region "me-south-1" ]][[- $resolvedAliasZoneId = "Z2BBTEKR2I36N2" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "Z10X7K2B4QSOFV" ]]
            [[- else if eq $region "us-gov-east-1" ]][[- $resolvedAliasZoneId = "Z35TSARG0EJ4VU" ]]
            [[- else if eq $region "us-gov-west-1" ]][[- $resolvedAliasZoneId = "Z4KAURWC4UUUG" ]]
            [[- end ]]
            [[- end ]]
            [[- end ]]

            ---
            [[- if $zoneId ]]
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: Record
            metadata:
              annotations:
                [[- if $externalName ]]
                crossplane.io/external-name: [[ $externalName ]]
                [[- end ]]
                [[ setResourceNameAnnotation $name ]]
              name: [[ $name ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              managementPolicies:
                - Observe
                - Update
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                name: "[[ $fqdn ]]"
                type: [[ $mrType ]]
                zoneId: [[ $zoneId ]]
                [[- if $setIdentifier ]]
                setIdentifier: [[ $setIdentifier ]]
                [[- end ]]
                [[- if $healthCheckId ]]
                healthCheckId: [[ $healthCheckId ]]
                [[- end ]]
                [[- if ne $weight nil ]]
                weightedRoutingPolicy:
                  weight: [[ $weight ]]
                [[- end ]]
                [[- if $failoverPolicy ]]
                failoverRoutingPolicy:
                  type: [[ $failoverPolicy.type ]]
                [[- end ]]
                [[- if $latencyPolicy ]]
                latencyRoutingPolicy:
                  region: [[ $latencyPolicy.region ]]
                [[- end ]]
                [[- if $geoPolicy ]]
                geolocationRoutingPolicy:
                  [[- if $geoPolicy.continent ]]
                  continent: [[ $geoPolicy.continent ]]
                  [[- end ]]
                  [[- if $geoPolicy.country ]]
                  country: [[ $geoPolicy.country ]]
                  [[- end ]]
                  [[- if $geoPolicy.subdivision ]]
                  subdivision: [[ $geoPolicy.subdivision ]]
                  [[- end ]]
                [[- end ]]
                [[- if $geoproxPolicy ]]
                geoproximityRoutingPolicy:
                  [[- if $geoproxPolicy.awsRegion ]]
                  awsRegion: [[ $geoproxPolicy.awsRegion ]]
                  [[- end ]]
                  [[- if $geoproxPolicy.localZoneGroup ]]
                  localZoneGroup: [[ $geoproxPolicy.localZoneGroup ]]
                  [[- end ]]
                  [[- if $geoproxPolicy.coordinates ]]
                  coordinates:
                    - latitude: "[[ $geoproxPolicy.coordinates.latitude ]]"
                      longitude: "[[ $geoproxPolicy.coordinates.longitude ]]"
                  [[- end ]]
                  [[- if $geoproxPolicy.bias ]]
                  bias: [[ $geoproxPolicy.bias ]]
                  [[- end ]]
                [[- end ]]
                [[- if $multivaluePolicy ]]
                multivalueAnswerRoutingPolicy: true
                [[- end ]]
                [[- if ne $type "ALIAS" ]]
                ttl: [[ $ttl ]]
                records: [[ $values | toJson ]]
                [[- end ]]
                [[- if eq $type "ALIAS" ]]
                alias:
                  name: [[ $aliasTarget.dnsName ]]
                  zoneId: [[ $resolvedAliasZoneId ]]
                  evaluateTargetHealth: [[ default false $aliasTarget.evaluateTargetHealth ]]
                [[- end ]]
            [[- end ]]

            ---
            [[- if $record.status.atProvider ]]
            apiVersion: dock.tech/v1
            kind: DNSRecord
            status:
              fqdn: [[ $displayFqdn ]]
              recordId: [[ $record.status.atProvider.id ]]
              ready: true
              message: [[ if $importing ]]"Record imported and observed"[[ else ]]"Record is ready"[[ end ]]
            [[- end ]]

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
