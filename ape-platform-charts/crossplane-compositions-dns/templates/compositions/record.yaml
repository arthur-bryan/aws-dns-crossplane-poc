apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnsrecord
  labels:
    app.kubernetes.io/name: crossplane-compositions-dns
spec:
  compositeTypeRef:
    apiVersion: dock.tech/v1
    kind: DNSRecord

  mode: Pipeline

  pipeline:
    - step: render-resources
      functionRef:
        name: crossplane-contrib-function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        delims:
          left: '[['
          right: ']]'
        source: Inline
        inline:
          template: |
            [[- $params        := .observed.composite.resource.spec ]]
            [[- $name          := $params.name ]]
            [[- $namespace     := .observed.composite.resource.metadata.namespace ]]
            [[- $accountName   := $params.aws.accountName ]]
            [[- $recordName    := $params.recordName ]]
            [[- $type          := $params.type ]]
            [[- $ttl           := default 3600 $params.ttl ]]
            [[- $values        := $params.values ]]
            [[- $aliasTarget   := $params.aliasTarget ]]
            [[- $setIdentifier := $params.setIdentifier ]]
            [[- $weight        := $params.weight ]]
            [[- $failoverPolicy  := $params.failoverRoutingPolicy ]]
            [[- $latencyPolicy   := $params.latencyRoutingPolicy ]]
            [[- $geoPolicy       := $params.geolocationRoutingPolicy ]]
            [[- $geoproxPolicy   := $params.geoproximityRoutingPolicy ]]
            [[- $multivaluePolicy := $params.multivalueAnswerRoutingPolicy ]]
            [[- $healthCheckId   := $params.healthCheckId ]]

            [[- $import    := $params.import ]]
            [[- $importing := and $import $import.existing ]]
            [[- $zoneId    := $params.zoneId ]]
            [[- $zoneName  := $params.zoneName ]]

            [[- $mrType := $type ]]
            [[- if eq $type "ALIAS" ]]
            [[- $mrType = "A" ]]
            [[- end ]]

            [[- $fqdn := "" ]]
            [[- $displayFqdn := $zoneName ]]
            [[- if $recordName ]]
            [[- $fqdn = printf "%s.%s" $recordName $zoneName ]]
            [[- $displayFqdn = $fqdn ]]
            [[- end ]]

            [[- $externalName := "" ]]
            [[- if $zoneId ]]
            [[- $externalName = printf "%s_%s_%s" $zoneId $fqdn $mrType ]]
            [[- if $params.setIdentifier ]]
            [[- $externalName = printf "%s_%s" $externalName $params.setIdentifier ]]
            [[- end ]]
            [[- end ]]

            [[- $record := getComposedResource . $name ]]

            [[- $resolvedAliasZoneId := "" ]]
            [[- if and (eq $type "ALIAS") $aliasTarget ]]
            [[- $serviceType := $aliasTarget.serviceType ]]
            [[- $region := default $params.aws.region $aliasTarget.region ]]
            [[- if eq $serviceType "CloudFront" ]]
            [[- $resolvedAliasZoneId = "Z2FDTNDATAQYW2" ]]
            [[- else if eq $serviceType "GlobalAccelerator" ]]
            [[- $resolvedAliasZoneId = "Z2BJ6XQ5FK7U4H" ]]
            [[- else if eq $serviceType "ALB" ]]
            [[- if eq $region "us-east-1" ]][[- $resolvedAliasZoneId = "Z35SXDOTRQ7X7K" ]]
            [[- else if eq $region "us-east-2" ]][[- $resolvedAliasZoneId = "Z3AADJGX6KTTL2" ]]
            [[- else if eq $region "us-west-1" ]][[- $resolvedAliasZoneId = "Z368ELLRRE2KJ0" ]]
            [[- else if eq $region "us-west-2" ]][[- $resolvedAliasZoneId = "Z1H1FL5HABSF5" ]]
            [[- else if eq $region "ca-central-1" ]][[- $resolvedAliasZoneId = "ZQSVJUPU6J1EY" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "Z32O12XQLNTSW2" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "ZHURV8PSTC4K8" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z3Q77PNBQS71R4" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z215JYRZR1TBD5" ]]
            [[- else if eq $region "ap-northeast-1" ]][[- $resolvedAliasZoneId = "Z14GRHDCWA56QT" ]]
            [[- else if eq $region "ap-northeast-2" ]][[- $resolvedAliasZoneId = "ZWKZPGTI48KDX" ]]
            [[- else if eq $region "ap-southeast-1" ]][[- $resolvedAliasZoneId = "Z1LMS91P8CMLE5" ]]
            [[- else if eq $region "ap-southeast-2" ]][[- $resolvedAliasZoneId = "Z1GM3OXH4ZPM65" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "Z2P70J7HTTTPLU" ]]
            [[- end ]]
            [[- else if eq $serviceType "NLB" ]]
            [[- if eq $region "us-east-1" ]][[- $resolvedAliasZoneId = "Z26RNL4JYFTOTI" ]]
            [[- else if eq $region "us-east-2" ]][[- $resolvedAliasZoneId = "ZLMOA37VPKANP" ]]
            [[- else if eq $region "us-west-1" ]][[- $resolvedAliasZoneId = "Z24FKFUX50B4VW" ]]
            [[- else if eq $region "us-west-2" ]][[- $resolvedAliasZoneId = "Z18D5FSROUN65G" ]]
            [[- else if eq $region "ca-central-1" ]][[- $resolvedAliasZoneId = "Z2EPGBW3API2WT" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "Z2IFOLAFXWLO4F" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "ZD4D7Y8KGAS4G" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z1CMS0P5QUZ6D5" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z3F1Z3NF5XQBAZ" ]]
            [[- else if eq $region "ap-northeast-1" ]][[- $resolvedAliasZoneId = "Z31USIVHYNEOWT" ]]
            [[- else if eq $region "ap-northeast-2" ]][[- $resolvedAliasZoneId = "ZIBE1TIR4HY56" ]]
            [[- else if eq $region "ap-southeast-1" ]][[- $resolvedAliasZoneId = "ZKVM4W9LS7TM" ]]
            [[- else if eq $region "ap-southeast-2" ]][[- $resolvedAliasZoneId = "ZCT6FZBF4DROD" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "ZTK26PT1VY4CU" ]]
            [[- end ]]
            [[- else if eq $serviceType "S3Website" ]]
            [[- if eq $region "us-east-1" ]][[- $resolvedAliasZoneId = "Z3AQBSTGFYJSTF" ]]
            [[- else if eq $region "us-east-2" ]][[- $resolvedAliasZoneId = "Z2O1EMRO9K5GLX" ]]
            [[- else if eq $region "us-west-1" ]][[- $resolvedAliasZoneId = "Z2F56UZL2M1ACD" ]]
            [[- else if eq $region "us-west-2" ]][[- $resolvedAliasZoneId = "Z3BJ6K6RIION7M" ]]
            [[- else if eq $region "ca-central-1" ]][[- $resolvedAliasZoneId = "Z1QDHH18159H29" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "Z1BKCTXD74EZPE" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "Z3GKZC51ZF0DB4" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z3R1K369G5AVDG" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z21DNDUVLTQW6Q" ]]
            [[- else if eq $region "ap-northeast-1" ]][[- $resolvedAliasZoneId = "Z2M4EHUR26P7ZW" ]]
            [[- else if eq $region "ap-northeast-2" ]][[- $resolvedAliasZoneId = "Z3W03O7B5YMIYP" ]]
            [[- else if eq $region "ap-southeast-1" ]][[- $resolvedAliasZoneId = "Z3O0J2DXBE1FTB" ]]
            [[- else if eq $region "ap-southeast-2" ]][[- $resolvedAliasZoneId = "Z1WCIGYICN2BYD" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "Z7KQH4QJS55SO" ]]
            [[- end ]]
            [[- else if eq $serviceType "APIGateway" ]]
            [[- if eq $region "us-east-1" ]][[- $resolvedAliasZoneId = "Z1UJRXOUMOOFQ8" ]]
            [[- else if eq $region "us-east-2" ]][[- $resolvedAliasZoneId = "ZOJJZC49E0EPZ" ]]
            [[- else if eq $region "us-west-1" ]][[- $resolvedAliasZoneId = "Z2MUQ32089INYE" ]]
            [[- else if eq $region "us-west-2" ]][[- $resolvedAliasZoneId = "Z2OJLYMUO9EFXC" ]]
            [[- else if eq $region "ca-central-1" ]][[- $resolvedAliasZoneId = "Z19DQILCV0OWEC" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "ZLY8HYME6SFDD" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "ZJ5UAJN8Y3Z2Q" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z3KY65QIEKYHQQ" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z1U9ULNL0V5AJ3" ]]
            [[- else if eq $region "ap-northeast-1" ]][[- $resolvedAliasZoneId = "Z1YSHQZHG15GKL" ]]
            [[- else if eq $region "ap-northeast-2" ]][[- $resolvedAliasZoneId = "Z20JF4UZKIW1U8" ]]
            [[- else if eq $region "ap-southeast-1" ]][[- $resolvedAliasZoneId = "ZL327KTPIQFUL" ]]
            [[- else if eq $region "ap-southeast-2" ]][[- $resolvedAliasZoneId = "Z2RPCDW04V8134" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "ZCMLWB8V5SYIT" ]]
            [[- end ]]
            [[- else if eq $serviceType "ElasticBeanstalk" ]]
            [[- if eq $region "us-east-1" ]][[- $resolvedAliasZoneId = "Z117KPS5GTRQ2G" ]]
            [[- else if eq $region "us-east-2" ]][[- $resolvedAliasZoneId = "Z14LCN19Q5QHIC" ]]
            [[- else if eq $region "us-west-1" ]][[- $resolvedAliasZoneId = "Z1LQECGX5PH1X" ]]
            [[- else if eq $region "us-west-2" ]][[- $resolvedAliasZoneId = "Z38NKT9BP95V3O" ]]
            [[- else if eq $region "ca-central-1" ]][[- $resolvedAliasZoneId = "ZJFCZL7SSZB5I" ]]
            [[- else if eq $region "eu-west-1" ]][[- $resolvedAliasZoneId = "Z2NYPWQ7DFZAZH" ]]
            [[- else if eq $region "eu-west-2" ]][[- $resolvedAliasZoneId = "Z1GKAAAUGATPF1" ]]
            [[- else if eq $region "eu-west-3" ]][[- $resolvedAliasZoneId = "Z5WN6GAYWG5OB" ]]
            [[- else if eq $region "eu-central-1" ]][[- $resolvedAliasZoneId = "Z1FRNW7UH4DEZJ" ]]
            [[- else if eq $region "eu-north-1" ]][[- $resolvedAliasZoneId = "Z23GO28BZ5AETM" ]]
            [[- else if eq $region "eu-south-1" ]][[- $resolvedAliasZoneId = "Z10VDYYOA2JFKM" ]]
            [[- else if eq $region "ap-northeast-1" ]][[- $resolvedAliasZoneId = "Z1R25G3KIG2GBW" ]]
            [[- else if eq $region "ap-northeast-2" ]][[- $resolvedAliasZoneId = "Z3JE5OI70TWKCP" ]]
            [[- else if eq $region "ap-northeast-3" ]][[- $resolvedAliasZoneId = "ZNE5GEY1TIAGY" ]]
            [[- else if eq $region "ap-south-1" ]][[- $resolvedAliasZoneId = "Z18NTBI3Y7N9TZ" ]]
            [[- else if eq $region "ap-southeast-1" ]][[- $resolvedAliasZoneId = "Z16FZ9L249IFLT" ]]
            [[- else if eq $region "ap-southeast-2" ]][[- $resolvedAliasZoneId = "Z2PCDNR3VC2G1N" ]]
            [[- else if eq $region "ap-east-1" ]][[- $resolvedAliasZoneId = "ZPWYUBWRU171A" ]]
            [[- else if eq $region "me-south-1" ]][[- $resolvedAliasZoneId = "Z2BBTEKR2I36N2" ]]
            [[- else if eq $region "af-south-1" ]][[- $resolvedAliasZoneId = "Z1EI3BVKMKK4AM" ]]
            [[- else if eq $region "sa-east-1" ]][[- $resolvedAliasZoneId = "Z10X7K2B4QSOFV" ]]
            [[- end ]]
            [[- else if eq $serviceType "Custom" ]]
            [[- $resolvedAliasZoneId = $aliasTarget.hostedZoneId ]]
            [[- end ]]
            [[- end ]]

            ---
            [[- if $zoneId ]]
            apiVersion: route53.aws.m.upbound.io/v1beta1
            kind: Record
            metadata:
              annotations:
                [[- if $externalName ]]
                crossplane.io/external-name: [[ $externalName ]]
                [[- end ]]
                [[ setResourceNameAnnotation $name ]]
              name: [[ $name ]]
              namespace: [[ $namespace ]]
            spec:
              providerConfigRef:
                name: [[ $accountName ]]
                kind: ClusterProviderConfig
              [[- if $importing ]]
              # Claim semantics: never Create. The Route53 record
              # already exists by construction (the user picked it
              # from AwsDnsRecordPicker, which lists live AWS state).
              # Crossplane should only Observe, Update, and Delete
              # under platform control.
              managementPolicies:
                - Observe
                - Update
                - Delete
              [[- else ]]
              managementPolicies:
                {{- toYaml .Values.managementPolicies | nindent 16 }}
              [[- end ]]
              forProvider:
                name: "[[ $fqdn ]]"
                type: [[ $mrType ]]
                zoneId: [[ $zoneId ]]
                [[- if $setIdentifier ]]
                setIdentifier: [[ $setIdentifier ]]
                [[- end ]]
                [[- if $healthCheckId ]]
                healthCheckId: [[ $healthCheckId ]]
                [[- end ]]
                [[- if $weight ]]
                weightedRoutingPolicy:
                  weight: [[ $weight ]]
                [[- end ]]
                [[- if $failoverPolicy ]]
                failoverRoutingPolicy:
                  type: [[ $failoverPolicy.type ]]
                [[- end ]]
                [[- if $latencyPolicy ]]
                latencyRoutingPolicy:
                  region: [[ $latencyPolicy.region ]]
                [[- end ]]
                [[- if $geoPolicy ]]
                geolocationRoutingPolicy:
                  [[- if $geoPolicy.continent ]]
                  continent: [[ $geoPolicy.continent ]]
                  [[- end ]]
                  [[- if $geoPolicy.country ]]
                  country: [[ $geoPolicy.country ]]
                  [[- end ]]
                  [[- if $geoPolicy.subdivision ]]
                  subdivision: [[ $geoPolicy.subdivision ]]
                  [[- end ]]
                [[- end ]]
                [[- if $geoproxPolicy ]]
                geoproximityRoutingPolicy:
                  [[- if $geoproxPolicy.awsRegion ]]
                  awsRegion: [[ $geoproxPolicy.awsRegion ]]
                  [[- end ]]
                  [[- if $geoproxPolicy.localZoneGroup ]]
                  localZoneGroup: [[ $geoproxPolicy.localZoneGroup ]]
                  [[- end ]]
                  [[- if $geoproxPolicy.coordinates ]]
                  coordinates:
                    - latitude: "[[ $geoproxPolicy.coordinates.latitude ]]"
                      longitude: "[[ $geoproxPolicy.coordinates.longitude ]]"
                  [[- end ]]
                  [[- if $geoproxPolicy.bias ]]
                  bias: [[ $geoproxPolicy.bias ]]
                  [[- end ]]
                [[- end ]]
                [[- if $multivaluePolicy ]]
                multivalueAnswerRoutingPolicy: true
                [[- end ]]
                [[- if ne $type "ALIAS" ]]
                ttl: [[ $ttl ]]
                records: [[ $values | toJson ]]
                [[- end ]]
                [[- if eq $type "ALIAS" ]]
                alias:
                  name: [[ $aliasTarget.dnsName ]]
                  zoneId: [[ $resolvedAliasZoneId ]]
                  evaluateTargetHealth: [[ default false $aliasTarget.evaluateTargetHealth ]]
                [[- end ]]
            [[- end ]]

            ---
            [[- if $record.status.atProvider ]]
            apiVersion: dock.tech/v1
            kind: DNSRecord
            status:
              fqdn: [[ $displayFqdn ]]
              recordId: [[ $record.status.atProvider.id ]]
              ready: true
              message: [[ if $importing ]]"Record imported and observed"[[ else ]]"Record is ready"[[ end ]]
            [[- end ]]

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
