---
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: record-s3site.example.com
  namespace: system-infrastructure-dev
spec:
  name: record-s3site.example.com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneId: Z1234567890ABC
  zoneName: example.com
  recordName: s3site
  type: ALIAS
  aliasTarget:
    serviceType: S3Website
    dnsName: example.com.s3-website-us-east-1.amazonaws.com
    evaluateTargetHealth: false
