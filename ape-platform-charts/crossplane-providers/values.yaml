# Runtime tuning for every upjet provider in this Helm release. Drift is
# detected only when the provider re-Observes, so poll-interval bounds the
# worst-case self-heal latency for out-of-band AWS changes.
providerRuntime:
  pollInterval: 30s
  syncPeriod: 5m
  maxReconcileRate: 10

providers:
  # provider-family-aws is a shared library every upbound-provider-aws-*
  # depends on. Its version is constrained to match the family providers
  # exactly -- a mismatch breaks dependency resolution and revisions
  # come up Healthy=False with UnhealthyPackageRevision. Pinning it
  # here keeps the bump in lockstep when the family providers are
  # upgraded.
  - name: upbound-provider-family-aws
    package: xpkg.upbound.io/upbound/provider-family-aws:v2.6.0

  - name: upbound-provider-aws-route53
    package: xpkg.upbound.io/upbound/provider-aws-route53:v2.6.0
    runtimeConfig:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::PLACEHOLDER:role/crossplane-route53"

  - name: upbound-provider-aws-cloudformation
    package: xpkg.upbound.io/upbound/provider-aws-cloudformation:v2.6.0
    runtimeConfig:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::PLACEHOLDER:role/crossplane-route53"
