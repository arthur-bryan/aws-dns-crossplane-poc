{{- range .Values.providers }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: {{ .name }}
spec:
  package: {{ .package }}
  {{- with .runtimeConfig }}
  runtimeConfigRef:
    name: {{ $.Release.Name }}-runtime-config
  {{- end }}
{{- end }}

---
{{- if .Values.providers }}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Release.Name }}-runtime-config
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          annotations:
            {{- $annotations := dict }}
            {{- range .Values.providers }}
            {{- if .runtimeConfig }}
            {{- $annotations = mergeOverwrite $annotations .runtimeConfig.annotations }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := $annotations }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
        spec:
          containers:
            - name: package-runtime
              args:
                # Tighten Crossplane's drift-detection cadence so out-of-band
                # AWS changes are reverted within ~poll rather than waiting
                # for the upjet default (10m). --sync bounds the worst case
                # full-resync window. Upbound providers use --poll/--sync
                # (not --poll-interval/--sync-period).
                - --poll={{ .Values.providerRuntime.pollInterval | default "30s" }}
                - --sync={{ .Values.providerRuntime.syncPeriod | default "5m" }}
                - --max-reconcile-rate={{ .Values.providerRuntime.maxReconcileRate | default 10 }}
{{- end }}
