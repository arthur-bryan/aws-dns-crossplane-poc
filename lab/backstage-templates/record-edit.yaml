apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-edit
  title: Edit AWS Route53 DNS Record
  description: Edit an existing AWS Route53 DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
    - hidden
spec:
  type: resource

  parameters:
    - title: Target Record
      description: Identifies which record XR to edit. Immutable fields are disabled once the edit form opens.
      required:
        - zone
        - recordName
        - type
      properties:
        zone:
          title: Parent Zone (immutable)
          type: string
          description: Parent hosted zone. Environment, AWS account, domain, subdomain, and system are all inherited from the zone.
          ui:field: EntityPicker
          ui:disabled: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
        recordName:
          title: Record Name (immutable)
          type: string
          minLength: 0
          maxLength: 253
          description: Short record name. Cannot be changed after creation.
          ui:disabled: true
        type:
          title: Record Type (immutable)
          type: string
          description: Cannot be changed after creation. Delete and recreate to change type.
          enum: [A, AAAA, CNAME, TXT, ALIAS, MX, SRV, NS, CAA, PTR]
          ui:disabled: true

      dependencies:
        type:
          oneOf:
            - properties:
                type: { const: A }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  items: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: AAAA }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: IPv6 Addresses
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CNAME }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Target Hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: TXT }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Text values
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: MX }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: MX records
                  type: array
                  description: Each value is "<priority> <mail-server-fqdn>"
                  items: { type: string, pattern: '^\s*[0-9]+\s+\S+\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: SRV }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: SRV records
                  type: array
                  items: { type: string, pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: NS }
                ttl: { title: TTL (seconds), type: integer, default: 172800, minimum: 60, maximum: 86400 }
                values:
                  title: Nameservers
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CAA }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: CAA records
                  type: array
                  items: { type: string, pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: PTR }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Target hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: ALIAS }
                serviceType:
                  title: AWS Service Type
                  type: string
                  description: Immutable — matches the existing record's service type
                  enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, ElasticBeanstalk, Custom]
                dnsName:
                  title: Target DNS Name
                  type: string
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  default: false
              required: [serviceType, dnsName]

    # Routing policy fields (setIdentifier / weight / failover / latency /
    # geolocation / multivalue / healthCheckId) are NOT editable here — they
    # are immutable in AWS Route53 without delete+recreate. The edit flow
    # reads the record's original scaffolder-parameters from the catalog
    # entity annotation and carries those fields through untouched.

  steps:
    - id: fetchZone
      name: Fetch parent Zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.zone }}

    # Resource key mirrors the create template: recordName for subdomain
    # records, apex-<type-lower> for apex records.
    - id: computeKey
      name: Derive resource key
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ parameters.recordName }}
          type: ${{ parameters.type }}
        expression: 'recordName ? recordName : "apex-" & $lowercase(type)'

    # Fetch the existing Record catalog entity instead of reading the XR
    # from GitHub. Avoids the GithubUrlReader slashed-branch parse bug
    # (ref "feature/ape-platform-alignment" gets truncated to "feature").
    - id: fetchRecord
      name: Fetch existing Record entity
      action: catalog:fetch
      input:
        entityRef: resource:system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: writeOriginalParams
      name: Stage original form parameters as JSON
      action: roadiehq:utils:fs:write
      input:
        path: .e2e/merged-params.json
        content: ${{ steps.fetchRecord.output.entity.metadata.annotations['dock.tech/scaffolder-parameters'] }}

    - id: applyEdits
      name: Merge user edits into original parameters
      action: roadiehq:utils:json:merge
      input:
        path: .e2e/merged-params.json
        content: ${{ parameters }}

    - id: mergeParams
      name: Read merged parameters back as object
      action: roadiehq:utils:jsonata:json:transform
      input:
        path: .e2e/merged-params.json
        expression: '$'
        as: object

    - id: writeXR
      name: Write Record XR manifest
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Record
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ steps.mergeParams.output.result | dump }}'
          spec:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            aws:
              account: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-id'] | int }}
              accountName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
            zoneId: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
            zoneName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            recordName: ${{ parameters.recordName }}
            type: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for v in parameters.values %}
              - ${{ v }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
              {%- if steps.mergeParams.output.result.targetRegion %}
              region: ${{ steps.mergeParams.output.result.targetRegion }}
              {%- endif %}
              {%- if parameters.serviceType == 'Custom' and steps.mergeParams.output.result.customZoneId %}
              hostedZoneId: ${{ steps.mergeParams.output.result.customZoneId }}
              {%- endif %}
            {%- endif %}
            {%- if steps.mergeParams.output.result.routingPolicy == 'weighted' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            weight: ${{ steps.mergeParams.output.result.weight }}
            {%- elif steps.mergeParams.output.result.routingPolicy == 'failover' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            failoverRoutingPolicy:
              type: ${{ steps.mergeParams.output.result.failoverType }}
              {%- if steps.mergeParams.output.result.healthCheckId %}
            healthCheckId: ${{ steps.mergeParams.output.result.healthCheckId }}
              {%- endif %}
            {%- elif steps.mergeParams.output.result.routingPolicy == 'latency' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            latencyRoutingPolicy:
              region: ${{ steps.mergeParams.output.result.latencyRegion }}
            {%- elif steps.mergeParams.output.result.routingPolicy == 'geolocation' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            geolocationRoutingPolicy:
              {%- if steps.mergeParams.output.result.geoContinent %}
              continent: ${{ steps.mergeParams.output.result.geoContinent }}
              {%- endif %}
              {%- if steps.mergeParams.output.result.geoCountry %}
              country: ${{ steps.mergeParams.output.result.geoCountry }}
              {%- endif %}
              {%- if steps.mergeParams.output.result.geoSubdivision %}
              subdivision: ${{ steps.mergeParams.output.result.geoSubdivision }}
              {%- endif %}
            {%- elif steps.mergeParams.output.result.routingPolicy == 'geoproximity' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            geoproximityRoutingPolicy:
              {%- if steps.mergeParams.output.result.geoproxAwsRegion %}
              awsRegion: ${{ steps.mergeParams.output.result.geoproxAwsRegion }}
              {%- endif %}
              {%- if steps.mergeParams.output.result.geoproxLatitude and steps.mergeParams.output.result.geoproxLongitude %}
              coordinates:
                latitude: "${{ steps.mergeParams.output.result.geoproxLatitude }}"
                longitude: "${{ steps.mergeParams.output.result.geoproxLongitude }}"
              {%- endif %}
              {%- if steps.mergeParams.output.result.geoproxBias %}
              bias: ${{ steps.mergeParams.output.result.geoproxBias }}
              {%- endif %}
            {%- elif steps.mergeParams.output.result.routingPolicy == 'multivalue' %}
            setIdentifier: ${{ steps.mergeParams.output.result.setIdentifier }}
            multivalueAnswerRoutingPolicy: true
              {%- if steps.mergeParams.output.result.healthCheckId %}
            healthCheckId: ${{ steps.mergeParams.output.result.healthCheckId }}
              {%- endif %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Rewrite Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            title: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            description: "DNS ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }})"
            annotations:
              dock.tech/xr-kind: Record
              dock.tech/xr-name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-id: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
              dock.tech/record-name: ${{ parameters.recordName }}
              dock.tech/record-type: ${{ parameters.type }}
              dock.tech/record-fqdn: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
              dock.tech/managed-by: scaffolder
              dock.tech/scaffolder-parameters: '${{ steps.mergeParams.output.result | dump }}'
              backstage.io/edit-url: http://localhost:3000/create/templates/default/aws-dns-record-edit?formData=${{ {"zone": parameters.zone, "recordName": parameters.recordName, "type": parameters.type} | dump | urlencode }}
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml"
            tags:
              - aws
              - dns
              - route53
              - record
              - ${{ parameters.type | lower }}
              - ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones#ListRecordSets/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
                icon: cloud
              - title: Delete record (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
                icon: delete
          spec:
            type: aws-dns-record
            owner: ${{ steps.fetchZone.output.entity.spec.owner }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
            dependsOn:
              - resource:default/zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: openPR
      name: Open PR with edited record
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-edit-${{ steps.computeKey.output.result }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
        targetBranchName: feature/ape-platform-alignment
        title: "chore(dns): update ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else ('at apex of ' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) }}"
        description: |
          Scaffolder-generated edit to Record XR.

          Environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
          Record: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else (steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] + ' (apex)') }} (${{ parameters.type }})

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
