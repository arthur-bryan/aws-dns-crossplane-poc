apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dns-record-edit
  title: Edit DNS Record
  description: Edit an existing DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - hidden
    - cloud-infrastructure

spec:
  owner: group:dock-tech/cloud-infrastructure
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        entityRef:
          title: Entity Reference
          type: string
          ui:disabled: true

        name:
          title: Name
          type: string
          ui:disabled: true

        system:
          title: System
          type: string
          ui:disabled: true

        environment:
          title: Environment
          type: string
          ui:disabled: true

        zone:
          title: DNS Zone
          type: string
          ui:disabled: true

        zoneId:
          title: Zone ID
          type: string
          ui:widget: hidden

        originalType:
          title: Original Record Type
          type: string
          ui:widget: hidden

        recordName:
          title: Record Name
          type: string
          ui:disabled: true

        fqdnPreview:
          title: FQDN Preview
          type: string
          ui:field: RecordFqdnPreview

        type:
          title: Record Type
          type: string
          description: >-
            Changing the record type destroys the existing record in Route53 and
            re-creates it with the new type. Expect brief DNS unavailability
            during the swap.
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS
            - MX
            - SRV
            - NS
            - CAA
            - PTR

      dependencies:
        type:
          oneOf:
            - properties:
                type:
                  const: A
                values:
                  title: IPv4 Addresses
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: AAAA
                values:
                  title: IPv6 Addresses
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: CNAME
                values:
                  title: Target Hostname
                  type: array
                  description: Target canonical name
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: TXT
                values:
                  title: Text Values
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: MX
                values:
                  title: MX Records
                  type: array
                  description: 'Mail exchange records (format: "priority hostname")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+\S+\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: SRV
                values:
                  title: SRV Records
                  type: array
                  description: 'Service records (format: "priority weight port target")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: NS
                values:
                  title: Nameservers
                  type: array
                  description: Nameserver hostnames for subdomain delegation
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: CAA
                values:
                  title: CAA Records
                  type: array
                  description: 'Certificate authority authorization (format: "flags tag value")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: PTR
                values:
                  title: Target Hostname
                  type: array
                  description: Hostname for reverse DNS lookup
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1
              required:
                - values

            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: AWS Service Type (immutable)
                  type: string
                  description: Type of AWS service (cannot be changed)
                  ui:disabled: true
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - Custom
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the AWS resource
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
              required:
                - serviceType
                - dnsName
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum:
                            - CloudFront
                            - GlobalAccelerator
                            - S3Website
                            - APIGateway
                    - properties:
                        serviceType:
                          const: Custom
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          description: Hosted zone ID for custom alias target
                          pattern: "^Z[A-Z0-9]+$"
                      required:
                        - customZoneId
                    - properties:
                        serviceType:
                          enum:
                            - ALB
                            - NLB

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight
                  type: integer
                  description: Traffic weight (0-255)
                  minimum: 0
                  maximum: 255
                  default: 100
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - id: deriveAccount
      name: Derive DNS account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $envName := environment;
            $accounts := {
              "dev": { "accountId": "071090846813", "accountName": "dnszone-dev" },
              "hml": { "accountId": "729620324125", "accountName": "dnszone-hml" },
              "prd": { "accountId": "694182734656", "accountName": "dnszone-prd" }
            };
            $accounts[$envName]
          )

    - id: deriveTtl
      name: Derive TTL from environment and record type
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
          recordType: ${{ parameters.type }}
          weighted: ${{ parameters.enableWeightedRouting }}
        expression: >-
          (
            $isWeighted := weighted = true;
            $isPrd := environment = "prd";
            $isNs := recordType = "NS";
            $isWeighted and not $isPrd ? 600 :
            $isNs ? 172800 :
            3600
          )

    - id: nextParams
      name: Compute next-edit scaffolder-parameters snapshot
      action: roadiehq:utils:jsonata
      input:
        data:
          params: ${{ parameters }}
          ttl: ${{ steps.deriveTtl.output.result }}
        expression: >-
          $merge([params, {"originalType": params.type, "ttl": ttl}])

    - id: writeFile
      name: Update Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record managed by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: '${{ steps.nextParams.output.result | dump }}'
              {%- if parameters.originalType and parameters.type != parameters.originalType %}
              argocd.argoproj.io/sync-options: Force=true,Replace=true
              {%- endif %}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zoneId }}
            zoneName: ${{ parameters.zone }}
            recordName: "${{ parameters.recordName }}"
            recordType: ${{ parameters.type }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ steps.deriveTtl.output.result }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: updated
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/notify.yaml

  output: {}
