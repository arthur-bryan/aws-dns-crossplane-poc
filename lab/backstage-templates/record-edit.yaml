apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-edit
  title: "⚠️ Edit AWS Route53 DNS Record — use the pencil icon on a record, not this form"
  description: "DO NOT launch from /create. Open an existing Record entity in the catalog and click the pencil icon in the header — this template is auto-invoked with pre-filled identity fields. Opening it here means you have to retype everything."
  labels:
    category: resources
    ape: "true"
    sre: "true"
    techlead: "true"
    developer: "true"
  tags:
    - resource
    - aws
    - dns
    - route53
    - hidden
    - internal
spec:
  owner: group:application-platform-engineering
  type: resource

  parameters:
    - title: Target Record
      description: Identifies which record XR to edit. Immutable fields are disabled once the edit form opens.
      required:
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        system:
          title: System
          type: string
          description: System that owns the record
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: dev
        zone:
          title: Parent Zone (immutable)
          type: string
          description: Parent hosted zone; the record file is located via this reference.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
        recordName:
          title: Record Name
          type: string
          minLength: 0
          maxLength: 253
          description: Short record name (immutable). Leave empty for apex records.
          ui:help: "Example: api-test → api-test.example.com. Leave empty for the zone's apex."
        type:
          title: Record Type
          type: string
          description: Record type (immutable)
          enum: [A, AAAA, CNAME, TXT, ALIAS, MX, SRV, NS, CAA, PTR]

      dependencies:
        type:
          oneOf:
            - properties:
                type: { const: A }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  items: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: AAAA }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: IPv6 Addresses
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CNAME }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Target Hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: TXT }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Text values
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: MX }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: MX records
                  type: array
                  description: Each value is "<priority> <mail-server-fqdn>"
                  items: { type: string, pattern: '^\s*[0-9]+\s+\S+\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: SRV }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: SRV records
                  type: array
                  items: { type: string, pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: NS }
                ttl: { title: TTL (seconds), type: integer, default: 172800, minimum: 60, maximum: 86400 }
                values:
                  title: Nameservers
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CAA }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: CAA records
                  type: array
                  items: { type: string, pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: PTR }
                ttl: { title: TTL (seconds), type: integer, default: 3600, minimum: 60, maximum: 86400 }
                values:
                  title: Target hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: ALIAS }
                serviceType:
                  title: AWS Service Type
                  type: string
                  description: Immutable — matches the existing record's service type
                  enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, ElasticBeanstalk, Custom]
                dnsName:
                  title: Target DNS Name
                  type: string
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  default: false
              required: [serviceType, dnsName]

    # Routing policy fields (setIdentifier / weight / failover / latency /
    # geolocation / multivalue / healthCheckId) intentionally NOT editable
    # through this template. The merge preserves whatever the XR already had.
    # To change a record's routing policy, you must delete + recreate it
    # (same constraint as the AWS Console).

  steps:
    - id: fetchSystem
      name: Fetch System entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.system }}

    - id: fetchZone
      name: Fetch parent Zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.zone }}

    # Matches the create template: resource key is recordName for subdomain
    # records, apex-<type> for apex records.
    - id: computeKey
      name: Derive resource key
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ parameters.recordName }}
          type: ${{ parameters.type }}
        expression: 'recordName ? recordName : "apex-" & $lowercase(type)'

    - id: fetchExisting
      name: Download existing Record YAML
      action: fetch:plain
      input:
        url: >-
          https://github.com/arthur-bryan/aws-dns-crossplane-poc/raw/feature/ape-platform-alignment/entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml
        targetPath: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws

    - id: mergeChanges
      name: Merge edit into existing YAML
      action: roadiehq:utils:merge
      input:
        path: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml
        content: |
          metadata:
            annotations:
              dock.tech/scaffolder-parameters: ${{ parameters | dump }}
          spec:
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for v in parameters.values %}
              - ${{ v }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              dnsName: ${{ parameters.dnsName }}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            # Routing policy fields preserved via deep merge — not touched here.

    - id: openPR
      name: Open PR with edited record
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-edit-${{ steps.computeKey.output.result }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "chore(dns): update ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else ('at apex of ' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) }}"
        description: |
          Scaffolder-generated edit to Record XR.

          System: ${{ parameters.system }}
          Environment: ${{ parameters.environment }}
          Record: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else (steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] + ' (apex)') }} (${{ parameters.type }})

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
