apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-import
  title: Import Existing AWS Route53 DNS Record
  description: Adopt an existing Route53 record into platform management. IMPORTANT — enter the record's CURRENT values exactly (observe+update mode; wrong values will overwrite AWS).
  labels:
    category: resources
    visibility: "public"
    ape: "true"
    sre: "true"
    techlead: "true"
    developer: "true"
  tags:
    - resource
    - aws
    - dns
    - route53
    - import
spec:
  owner: group:application-platform-engineering
  type: resource

  parameters:
    - title: Record Identification
      description: |
        Must exactly match the AWS record you want to adopt. The platform runs
        in Observe+Update mode — if the values below don't match AWS, AWS will
        be overwritten to match them on the next reconcile.
      required:
        - system
        - environment
        - zoneName
        - zoneId
        - recordName
        - type
      properties:
        system:
          title: System
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: dev
        zoneName:
          title: Parent Zone
          type: string
          pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'
          description: FQDN of the existing hosted zone (no trailing dot)
          ui:help: "Example: arthurbryan.com"
        zoneId:
          title: AWS Route53 Zone ID
          type: string
          pattern: '^Z[A-Z0-9]+$'
          ui:help: "Example: Z03010981ALJFZB4QLU8W"
        recordName:
          title: Record Name
          type: string
          minLength: 1
          maxLength: 253
          description: Short record name (no parent zone)
          ui:help: "Example: api → api.example.com"
        type:
          title: Record Type
          type: string
          enum: [A, AAAA, CNAME, TXT, ALIAS]

      dependencies:
        type:
          oneOf:
            - properties:
                type: { const: A }
                ttl:
                  title: Current TTL (seconds)
                  type: integer
                  default: 300
                  minimum: 60
                  maximum: 86400
                values:
                  title: Current IPv4 Addresses
                  type: array
                  items: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: AAAA }
                ttl: { title: Current TTL (seconds), type: integer, default: 300, minimum: 60, maximum: 86400 }
                values:
                  title: Current IPv6 Addresses
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CNAME }
                ttl: { title: Current TTL (seconds), type: integer, default: 300, minimum: 60, maximum: 86400 }
                values:
                  title: Current Target Hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: TXT }
                ttl: { title: Current TTL (seconds), type: integer, default: 300, minimum: 60, maximum: 86400 }
                values:
                  title: Current Text values
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: ALIAS }
                serviceType:
                  title: AWS Service Type
                  type: string
                  enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, Custom]
                dnsName:
                  title: Current Target DNS Name
                  type: string
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  default: false
              required: [serviceType, dnsName]
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum: [CloudFront, GlobalAccelerator, S3Website, APIGateway, ALB, NLB]
                    - properties:
                        serviceType: { const: Custom }
                        customZoneId:
                          title: Target Hosted Zone ID
                          type: string
                          pattern: '^Z[A-Z0-9]+$'
                      required: [customZoneId]

    - title: AWS Account
      required: [awsAccountId, awsAccountName]
      properties:
        awsAccountId:
          title: AWS Account ID
          type: string
          pattern: '^[0-9]{12}$'
        awsAccountName:
          title: AWS Account Name
          type: string
          default: dev-account
        awsRegion:
          title: AWS Region
          type: string
          default: us-east-1
          pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

    - title: Weighted Routing (Optional)
      description: If the record is part of a weighted routing set, provide the identifier + weight here. Leave off otherwise.
      properties:
        enableWeightedRouting:
          title: Weighted Record
          type: boolean
          default: false
      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting: { const: false }
            - properties:
                enableWeightedRouting: { const: true }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight (0-255)
                  type: integer
                  minimum: 0
                  maximum: 255
              required: [setIdentifier, weight]

  steps:
    - id: fetchSystem
      name: Fetch System entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.system }}

    - id: writeXR
      name: Write Record import XR
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/record-${{ parameters.recordName }}.${{ parameters.zoneName }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Record
          metadata:
            name: record-${{ parameters.recordName }}.${{ parameters.zoneName }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            annotations:
              dock.tech/scaffolder-parameters: ${{ parameters | dump }}
          spec:
            name: record-${{ parameters.recordName }}.${{ parameters.zoneName }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ parameters.awsAccountId }}
              accountName: ${{ parameters.awsAccountName }}
              region: ${{ parameters.awsRegion }}
            zoneId: ${{ parameters.zoneId }}
            zoneName: ${{ parameters.zoneName }}
            recordName: ${{ parameters.recordName }}
            type: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for v in parameters.values %}
              - ${{ v }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}
            import:
              existing: true

    - id: openPR
      name: Open PR with record import
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-import-${{ parameters.recordName }}-${{ parameters.zoneName }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): import existing record ${{ parameters.recordName }}.${{ parameters.zoneName }}"
        description: |
          Adopt existing Route53 record into platform management.

          System: ${{ parameters.system }}
          Environment: ${{ parameters.environment }}
          Zone: ${{ parameters.zoneName }} (${{ parameters.zoneId }})
          Record: ${{ parameters.recordName }}.${{ parameters.zoneName }} (${{ parameters.type }})

          Resulting XR uses `managementPolicies: [Observe, Update]`. Deleting
          the XR will NOT delete the AWS record. Any drift between the values
          in this YAML and AWS will be reconciled **toward this YAML** on the
          next update cycle — double-check the values match the live record.

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
