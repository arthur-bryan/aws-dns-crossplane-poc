apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: AWS Route53 DNS Zone Template
  description: A template for creating an AWS Route53 hosted zone
  labels:
    category: resources
    visibility: "public"
    ape: "true"
    sre: "true"
    techlead: "true"
    developer: "false"
  tags:
    - resource
    - aws
    - dns
    - route53
spec:
  owner: group:application-platform-engineering
  type: resource

  parameters:
    - title: DNS Zone Information
      required:
        - system
        - environment
        - zoneName
      properties:
        system:
          title: System
          type: string
          description: System this zone belongs to
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: dev
        zoneName:
          title: Zone Name
          type: string
          pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'
          description: Fully qualified zone name (no trailing dot)
          ui:autofocus: true
          ui:help: "Example: example.com"
        comment:
          title: Comment
          type: string
          maxLength: 256
          description: Optional comment for the zone
        deletionProtection:
          title: Deletion Protection
          type: boolean
          default: false
          description: "When ON, removing this XR orphans the Route53 zone instead of deleting it. Strongly recommended for production zones."
        visibility:
          title: Zone Type
          type: string
          enum: [public, private]
          default: public
          description: "Public: resolvable on the internet. Private: only resolvable from associated VPCs (requires VPC IDs below)."
      dependencies:
        visibility:
          oneOf:
            - properties:
                visibility: { const: public }
            - properties:
                visibility: { const: private }
                vpcs:
                  title: Associated VPCs
                  description: At least one VPC association is required for a private zone.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [vpcId, vpcRegion]
                    properties:
                      vpcId:
                        title: VPC ID
                        type: string
                        pattern: '^vpc-[a-f0-9]+$'
                        description: "Example: vpc-0123456789abcdef0"
                      vpcRegion:
                        title: VPC Region
                        type: string
                        pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                        default: us-east-1
              required: [vpcs]

    - title: AWS Account
      required:
        - awsAccountId
        - awsAccountName
      properties:
        awsAccountId:
          title: AWS Account ID
          type: string
          pattern: '^[0-9]{12}$'
          description: Target AWS account (12 digits)
        awsAccountName:
          title: AWS Account Name
          type: string
          default: dev-account
          description: Must match a ClusterProviderConfig name
        awsRegion:
          title: AWS Region
          type: string
          default: us-east-1
          pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

    - title: Additional Tags (Optional)
      properties:
        tags:
          title: Tags
          type: object
          description: Additional AWS tags (hierarchy tags added automatically)
          additionalProperties:
            type: string

  steps:
    - id: fetchSystem
      name: Fetch System entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.system }}

    - id: writeXR
      name: Write Zone XR manifest
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/zone-${{ parameters.zoneName }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Zone
          metadata:
            name: zone-${{ parameters.zoneName }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
          spec:
            name: zone-${{ parameters.zoneName }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ parameters.awsAccountId }}
              accountName: ${{ parameters.awsAccountName }}
            zoneName: ${{ parameters.zoneName }}
            {%- if parameters.comment %}
            comment: ${{ parameters.comment }}
            {%- endif %}
            {%- if parameters.deletionProtection %}
            deletionProtection: true
            {%- endif %}
            visibility: ${{ parameters.visibility | default('public') }}
            {%- if parameters.visibility == 'private' and parameters.vpcs %}
            vpcs:
            {%- for vpc in parameters.vpcs %}
              - vpcId: ${{ vpc.vpcId }}
                vpcRegion: ${{ vpc.vpcRegion }}
            {%- endfor %}
            {%- endif %}
            {%- if parameters.tags %}
            tags:
              {%- for key, value in parameters.tags %}
              ${{ key }}: ${{ value }}
              {%- endfor %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/zones/zone-${{ parameters.zoneName }}.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: zone-${{ parameters.zoneName }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            title: "${{ parameters.zoneName }} · ${{ parameters.environment }}"
            description: "Route53 Hosted Zone ${{ parameters.zoneName }} (${{ parameters.environment }})"
            annotations:
              dock.tech/xr-kind: Zone
              dock.tech/xr-name: zone-${{ parameters.zoneName }}
              dock.tech/zone-name: ${{ parameters.zoneName }}
              dock.tech/domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ parameters.environment }}
              dock.tech/aws-account-id: "${{ parameters.awsAccountId }}"
              dock.tech/aws-account-name: ${{ parameters.awsAccountName }}
              dock.tech/managed-by: scaffolder
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/zone-${{ parameters.zoneName }}.yaml"
            tags:
              - aws
              - dns
              - route53
              - zone
              - ${{ parameters.environment }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones
                icon: cloud
              - title: Delete zone (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/zone-${{ parameters.zoneName }}.yaml
                icon: delete
          spec:
            type: aws-dns-zone
            owner: group:application-platform-engineering
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}

    - id: openPR
      name: Open PR with new zone manifest
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/zone-${{ parameters.zoneName }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): create zone ${{ parameters.zoneName }}"
        description: |
          Scaffolder-generated Zone XR + Backstage Resource entity.

          System: ${{ parameters.system }}
          Environment: ${{ parameters.environment }}
          Zone: ${{ parameters.zoneName }}

          After merge: the zone appears in the Backstage catalog as type=aws-dns-zone.

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
