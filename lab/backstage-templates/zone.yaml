apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: AWS Route53 DNS Zone Template
  description: Create a Route53 hosted zone delegated from an existing platform-managed zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - dns
    - zone
spec:
  type: resource

  parameters:
    - title: Zone Information
      required:
        - delegatedZone
        - prefix
      properties:
        delegatedZone:
          title: Delegated From (Parent Zone)
          type: string
          description: Existing platform-managed zone that will hold the NS delegation. The new zone inherits its account, system, and environment context.
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
            defaultKind: Resource
        prefix:
          title: Zone Prefix
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Single DNS label (lowercase, alphanumeric, hyphens). Joined with the parent zone name to form the FQDN.
          ui:help: "Example: prefix=infrastructure on parent=arthurbryan.com → infrastructure.arthurbryan.com"
        comment:
          title: Comment
          type: string
          maxLength: 256
          description: Optional comment attached to the Route53 hosted zone
        deletionProtection:
          title: Deletion Protection
          type: boolean
          default: false
          description: When ON, removing this XR orphans the Route53 zone instead of deleting it. Strongly recommended for production zones.
        private:
          title: Private Zone
          type: boolean
          default: false
          description: Private zones are only resolvable from associated VPCs.
      dependencies:
        private:
          oneOf:
            - properties:
                private: { const: false }
            - properties:
                private: { const: true }
                vpcs:
                  title: Associated VPCs
                  description: Pick one or more VPCs from the AWS catalog. The new private zone will be associated with each.
                  type: array
                  minItems: 1
                  ui:field: MultiEntityPicker
                  ui:options:
                    catalogFilter:
                      kind: Resource
                      spec.type: aws-vpc
              required: [vpcs]

    - title: Additional Tags (Optional)
      properties:
        tags:
          title: Tags
          type: object
          description: Additional AWS tags (hierarchy tags added automatically)
          additionalProperties:
            type: string

  steps:
    - id: fetchParent
      name: Fetch parent zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.delegatedZone }}

    - id: fetchVpcs
      name: Fetch selected VPC entities
      if: ${{ parameters.private }}
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.vpcs }}

    - id: computeZone
      name: Compute child zone identity
      action: roadiehq:utils:jsonata
      input:
        data:
          prefix: ${{ parameters.prefix }}
          parentZoneName: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}
        expression: '$lowercase(prefix & "." & parentZoneName)'

    - id: writeXR
      name: Write Zone XR manifest
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Zone
          metadata:
            name: zone-${{ steps.computeZone.output.result }}
            namespace: system-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
          spec:
            name: zone-${{ steps.computeZone.output.result }}
            domain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
            aws:
              account: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-id'] | int }}
              accountName: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
            zoneName: ${{ steps.computeZone.output.result }}
            delegatedFromZoneId: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }}
            {%- if parameters.comment %}
            comment: ${{ parameters.comment }}
            {%- endif %}
            {%- if parameters.deletionProtection %}
            deletionProtection: true
            {%- endif %}
            visibility: ${{ 'private' if parameters.private else 'public' }}
            {%- if parameters.private %}
            vpcs:
            {%- for vpc in steps.fetchVpcs.output.entities %}
              - vpcId: ${{ vpc.metadata.annotations['dock.tech/vpc-id'] }}
                vpcRegion: ${{ vpc.metadata.annotations['dock.tech/vpc-region'] }}
            {%- endfor %}
            {%- endif %}
            {%- if parameters.tags %}
            tags:
              {%- for key, value in parameters.tags %}
              ${{ key }}: ${{ value }}
              {%- endfor %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}/${{ steps.computeZone.output.result }}/zone.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: zone-${{ steps.computeZone.output.result }}
            namespace: system-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
            title: "${{ steps.computeZone.output.result }} · ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}"
            description: "Route53 Hosted Zone ${{ steps.computeZone.output.result }} (${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}) — delegated from ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}"
            annotations:
              dock.tech/xr-kind: Zone
              dock.tech/xr-name: zone-${{ steps.computeZone.output.result }}
              dock.tech/zone-name: ${{ steps.computeZone.output.result }}
              dock.tech/parent-zone-id: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }}
              dock.tech/parent-zone-name: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/domain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
              dock.tech/aws-account-id: "${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-id'] }}"
              dock.tech/aws-account-name: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
              dock.tech/visibility: ${{ 'private' if parameters.private else 'public' }}
              dock.tech/managed-by: scaffolder
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml"
            tags:
              - aws
              - dns
              - route53
              - zone
              - ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
              - ${{ 'private' if parameters.private else 'public' }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones
                icon: cloud
              - title: Delete zone (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml
                icon: delete
          spec:
            type: aws-dns-zone
            owner: ${{ steps.fetchParent.output.entity.spec.owner }}
            system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
            dependsOn:
              - resource:default/zone-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: openPR
      name: Open PR with new zone manifest
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/zone-${{ steps.computeZone.output.result }}-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): create zone ${{ steps.computeZone.output.result }}"
        description: |
          Scaffolder-generated Zone XR + Backstage Resource entity.

          Parent zone: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }})
          New zone: ${{ steps.computeZone.output.result }}
          Visibility: ${{ 'private' if parameters.private else 'public' }}
          System: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
          Environment: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/environment'] }}

          After merge: the composition creates the Route53 zone and, once nameservers are returned, automatically registers an NS record in the parent zone for delegation.

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
