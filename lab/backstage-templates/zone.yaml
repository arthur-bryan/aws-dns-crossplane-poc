apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: AWS Route53 DNS Zone
  description: Create a Route53 hosted zone delegated from an existing platform zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - dns
    - zone
spec:
  type: resource

  parameters:
    - title: Zone
      required:
        - delegatedZone
        - prefix
        - environment
      properties:
        delegatedZone:
          title: Delegated From
          type: string
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
            defaultKind: Resource
        prefix:
          title: Zone Name
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        environment:
          title: Environment
          type: string
          enum: [dev, prd]
          default: prd
        fqdnPreview:
          title: ''
          type: string
          ui:field: ZoneFqdnPreview
        private:
          title: Private Zone
          type: boolean
          default: false
      dependencies:
        private:
          oneOf:
            - properties:
                private: { const: false }
            - properties:
                private: { const: true }
                vpcs:
                  title: Associated VPCs
                  type: array
                  default: []
                  ui:field: MultiEntityPicker
                  ui:options:
                    catalogFilter:
                      - kind: Resource
                        spec.type: aws-vpc

    - title: Tags
      properties:
        tags:
          title: Tags
          type: object
          additionalProperties:
            type: string

  steps:
    - id: validateVpcs
      name: Validate VPC selection
      if: ${{ parameters.private }}
      action: roadiehq:utils:jsonata
      input:
        data:
          count: ${{ parameters.vpcs | length }}
        expression: '$assert(count >= 1, "Private zones require at least one VPC. Pick one in the Associated VPCs picker.")'

    - id: fetchParent
      name: Fetch parent zone
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.delegatedZone }}

    - id: fetchVpcs
      name: Fetch VPCs
      if: ${{ parameters.private }}
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.vpcs }}

    - id: computeZone
      name: Compute zone name
      action: roadiehq:utils:jsonata
      input:
        data:
          prefix: ${{ parameters.prefix }}
          parentZoneName: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}
        expression: '$lowercase(prefix & "." & parentZoneName)'

    - id: deriveAccount
      name: Derive account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
        expression: >-
          env = "dev" ? {"accountId": "309670275661", "accountName": "dev-account", "defaultVpcId": "vpc-0dd3eaef2e5c11f69", "defaultVpcRegion": "us-east-1"}
          : env = "prd" ? {"accountId": "597230762851", "accountName": "prd-account", "defaultVpcId": "vpc-0410f81cfe1bba322", "defaultVpcRegion": "us-east-1"}
          : {"accountId": "", "accountName": ""}

    - id: writeXR
      name: Write Zone XR
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchParent.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Zone
          metadata:
            name: zone-${{ steps.computeZone.output.result }}
            namespace: system-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
          spec:
            name: zone-${{ steps.computeZone.output.result }}
            domain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId | int }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            zoneName: ${{ steps.computeZone.output.result }}
            delegatedFromZoneId: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }}
            delegatedFromAccountName: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
            visibility: ${{ 'private' if parameters.private else 'public' }}
            {%- if parameters.private %}
            vpcs:
              - vpcId: ${{ steps.deriveAccount.output.result.defaultVpcId }}
                vpcRegion: ${{ steps.deriveAccount.output.result.defaultVpcRegion }}
                accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- for vpc in steps.fetchVpcs.output.entities %}
              - vpcId: ${{ vpc.metadata.annotations['dock.tech/vpc-id'] }}
                vpcRegion: ${{ vpc.metadata.annotations['dock.tech/vpc-region'] }}
                accountName: ${{ vpc.metadata.annotations['dock.tech/aws-account-name'] }}
            {%- endfor %}
            {%- endif %}
            {%- if parameters.tags and (parameters.tags | length) %}
            tags:
              {%- for key, value in parameters.tags %}
              ${{ key }}: ${{ value }}
              {%- endfor %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write catalog entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/${{ parameters.environment }}/${{ steps.computeZone.output.result }}/zone.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: zone-${{ steps.computeZone.output.result }}
            namespace: system-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            title: "${{ steps.computeZone.output.result }} · ${{ parameters.environment }}"
            description: "Route53 Hosted Zone ${{ steps.computeZone.output.result }} (${{ parameters.environment }}) — delegated from ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}"
            annotations:
              dock.tech/xr-kind: Zone
              dock.tech/xr-name: zone-${{ steps.computeZone.output.result }}
              dock.tech/zone-name: ${{ steps.computeZone.output.result }}
              dock.tech/parent-zone-id: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }}
              dock.tech/parent-zone-name: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/parent-aws-account-name: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
              dock.tech/domain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ parameters.environment }}
              dock.tech/aws-account-id: "${{ steps.deriveAccount.output.result.accountId }}"
              dock.tech/aws-account-name: ${{ steps.deriveAccount.output.result.accountName }}
              dock.tech/visibility: ${{ 'private' if parameters.private else 'public' }}
              dock.tech/managed-by: scaffolder
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml"
            tags:
              - aws
              - dns
              - route53
              - zone
              - ${{ parameters.environment }}
              - ${{ 'private' if parameters.private else 'public' }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones
                icon: cloud
              - title: Delete zone (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/${{ steps.computeZone.output.result }}/zone.yaml
                icon: delete
          spec:
            type: aws-dns-zone
            owner: ${{ steps.fetchParent.output.entity.spec.owner }}
            system: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/system'] }}
            dependsOn:
              - resource:default/zone-${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: openPR
      name: Open PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/zone-${{ steps.computeZone.output.result }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): create zone ${{ steps.computeZone.output.result }} (${{ parameters.environment }})"
        description: |
          Parent zone: ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/zone-id'] }}, ${{ steps.fetchParent.output.entity.metadata.annotations['dock.tech/aws-account-name'] }})
          New zone: ${{ steps.computeZone.output.result }}
          Environment: ${{ parameters.environment }}
          Account: ${{ steps.deriveAccount.output.result.accountName }} (${{ steps.deriveAccount.output.result.accountId }})
          Visibility: ${{ 'private' if parameters.private else 'public' }}

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
