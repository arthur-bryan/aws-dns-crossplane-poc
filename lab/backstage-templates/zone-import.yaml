apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone-import
  title: Import Existing AWS Route53 DNS Zone
  description: Adopt an existing Route53 hosted zone into platform management (observe + update; does not recreate)
  labels:
    category: resources
    visibility: "public"
    ape: "true"
    sre: "true"
    techlead: "true"
    developer: "false"
  tags:
    - resource
    - aws
    - dns
    - route53
    - import
spec:
  owner: group:application-platform-engineering
  type: resource

  parameters:
    - title: Zone Identification
      required:
        - system
        - environment
        - zoneName
        - zoneId
      properties:
        system:
          title: System
          type: string
          description: System that should own this zone
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: dev
        zoneName:
          title: Zone Name
          type: string
          pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'
          description: FQDN of the existing zone (no trailing dot)
          ui:autofocus: true
          ui:help: "Example: arthurbryan.com"
        zoneId:
          title: AWS Route53 Zone ID
          type: string
          pattern: '^Z[A-Z0-9]+$'
          description: Hosted Zone ID of the existing zone (find via AWS console or `aws route53 list-hosted-zones`)
          ui:help: "Example: Z03010981ALJFZB4QLU8W"
        comment:
          title: Comment (optional)
          type: string
          maxLength: 256
          description: New comment for the zone — leave empty to preserve the existing comment

    - title: AWS Account
      required: [awsAccountId, awsAccountName]
      properties:
        awsAccountId:
          title: AWS Account ID
          type: string
          pattern: '^[0-9]{12}$'
        awsAccountName:
          title: AWS Account Name
          type: string
          default: dev-account
          description: Must match a ClusterProviderConfig name

  steps:
    - id: fetchSystem
      name: Fetch System entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.system }}

    - id: writeXR
      name: Write Zone import XR
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/zone-${{ parameters.zoneName }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Zone
          metadata:
            name: zone-${{ parameters.zoneName }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            annotations:
              dock.tech/scaffolder-parameters: ${{ parameters | dump }}
          spec:
            name: zone-${{ parameters.zoneName }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ parameters.awsAccountId }}
              accountName: ${{ parameters.awsAccountName }}
            zoneName: ${{ parameters.zoneName }}
            {%- if parameters.comment %}
            comment: ${{ parameters.comment }}
            {%- endif %}
            import:
              existing: true
              zoneId: ${{ parameters.zoneId }}

    - id: openPR
      name: Open PR with zone import
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/zone-import-${{ parameters.zoneName }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): import existing zone ${{ parameters.zoneName }}"
        description: |
          Adopt existing Route53 zone into platform management.

          System: ${{ parameters.system }}
          Environment: ${{ parameters.environment }}
          Zone: ${{ parameters.zoneName }} (${{ parameters.zoneId }})

          Resulting XR uses `managementPolicies: [Observe, Update]` —
          deletion of the XR will NOT delete the AWS zone.

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
