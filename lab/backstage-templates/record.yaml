apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record
  title: AWS Route53 DNS Record Template
  description: A template for creating an AWS Route53 DNS record
  labels:
    category: resources
    visibility: "public"
    ape: "true"
    sre: "true"
    techlead: "true"
    developer: "true"
  tags:
    - resource
    - aws
    - dns
    - route53
spec:
  owner: group:application-platform-engineering
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        system:
          title: System
          type: string
          description: System this record belongs to
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: dev
        zone:
          title: Parent Zone
          type: string
          description: Hosted zone to add this record to. Only zones already managed by the platform (created via this template or batch-imported) are listed.
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
            defaultKind: Resource
        recordName:
          title: Record Name
          type: string
          minLength: 0
          maxLength: 253
          description: Short name; joined with the parent zone to form the FQDN. Leave empty for apex (zone root).
          ui:help: "Example: api-test → api-test.example.com. Leave empty for apex / zone root records (e.g. MX, apex ALIAS)."
        type:
          title: Record Type
          type: string
          enum: [A, AAAA, CNAME, TXT, ALIAS]

      dependencies:
        type:
          oneOf:
            - properties:
                type: { const: A }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  items: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: AAAA }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv6 Addresses
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CNAME }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Target Hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: TXT }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Text values
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: ALIAS }
                serviceType:
                  title: AWS Service Type
                  type: string
                  enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, Custom]
                dnsName:
                  title: Target DNS Name
                  type: string
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  default: false
              required: [serviceType, dnsName]
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum: [CloudFront, GlobalAccelerator, S3Website, APIGateway, ALB, NLB]
                    - properties:
                        serviceType: { const: Custom }
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          pattern: '^Z[A-Z0-9]+$'
                      required: [customZoneId]

    - title: AWS Account
      required: [awsAccountId, awsAccountName]
      properties:
        awsAccountId:
          title: AWS Account ID
          type: string
          pattern: '^[0-9]{12}$'
          description: Target AWS account (12 digits)
        awsAccountName:
          title: AWS Account Name
          type: string
          default: dev-account
          description: Must match a ClusterProviderConfig name
        awsRegion:
          title: AWS Region
          type: string
          default: us-east-1
          pattern: '^[a-z]{2}-[a-z]+-\d{1}$'

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          default: false
      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting: { const: false }
            - properties:
                enableWeightedRouting: { const: true }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight (0-255)
                  type: integer
                  minimum: 0
                  maximum: 255
                  default: 100
              required: [setIdentifier, weight]

  steps:
    - id: fetchSystem
      name: Fetch System entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.system }}

    - id: fetchZone
      name: Fetch parent Zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.zone }}

    # Compute the resource identity once — non-apex is just <recordName>, apex
    # is apex-<type-lowercase>. That becomes the XR metadata.name prefix and
    # the filename stem, so subsequent steps can reference it uniformly.
    - id: computeKey
      name: Derive resource key
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ parameters.recordName }}
          type: ${{ parameters.type }}
        expression: 'recordName ? recordName : "apex-" & $lowercase(type)'

    - id: writeXR
      name: Write Record XR manifest
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ parameters.environment }}/resources/aws/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Record
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            annotations:
              dock.tech/scaffolder-parameters: ${{ parameters | dump }}
          spec:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ parameters.awsAccountId }}
              accountName: ${{ parameters.awsAccountName }}
              region: ${{ parameters.awsRegion }}
            zoneId: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
            zoneName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            recordName: ${{ parameters.recordName }}
            type: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for v in parameters.values %}
              - ${{ v }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/records/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}-${{ parameters.environment }}
            title: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            description: "DNS ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ parameters.environment }})"
            annotations:
              dock.tech/xr-kind: Record
              dock.tech/xr-name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-id: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
              dock.tech/record-name: ${{ parameters.recordName }}
              dock.tech/record-type: ${{ parameters.type }}
              dock.tech/record-fqdn: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ parameters.environment }}
              dock.tech/managed-by: scaffolder
              backstage.io/edit-url: http://localhost:3000/create/templates/default/aws-dns-record-edit?formData=${{ {"system": parameters.system, "environment": parameters.environment, "zone": parameters.zone, "recordName": parameters.recordName, "type": parameters.type} | dump | urlencode }}
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml"
            tags:
              - aws
              - dns
              - route53
              - record
              - ${{ parameters.type | lower }}
              - ${{ parameters.environment }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones#ListRecordSets/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
                icon: cloud
              - title: Delete record (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}/${{ parameters.environment }}/resources/aws/record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}.yaml
                icon: delete
          spec:
            type: aws-dns-record
            owner: group:application-platform-engineering
            system: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/system'] }}
            dependsOn:
              - resource:default/zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: openPR
      name: Open PR with new record manifest
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-${{ steps.computeKey.output.result }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}-${{ parameters.environment }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): create ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else ('at apex of ' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) }}"
        description: |
          Scaffolder-generated Record XR.

          System: ${{ parameters.system }}
          Environment: ${{ parameters.environment }}
          Zone: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
          Record: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else (steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] + ' (apex)') }} (${{ parameters.type }})

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
