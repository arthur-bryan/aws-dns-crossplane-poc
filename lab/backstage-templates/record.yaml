apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record
  title: AWS Route53 DNS Record Template
  description: A template for creating an AWS Route53 DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - zone
        - recordName
        - type
      properties:
        zone:
          title: Parent Zone
          type: string
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
            defaultKind: Resource
        recordName:
          title: Record Name
          type: string
          minLength: 0
          maxLength: 253
          description: Short name; joined with the parent zone to form the FQDN. Leave empty for apex (zone root).
          ui:help: "Example: api-test → api-test.example.com. Leave empty for apex / zone root records (e.g. MX, apex ALIAS)."
        type:
          title: Record Type
          type: string
          enum: [A, AAAA, CNAME, TXT, ALIAS, MX, SRV, NS, CAA, PTR]

      dependencies:
        type:
          oneOf:
            - properties:
                type: { const: A }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: IPv4 Addresses
                  type: array
                  items: { type: string, pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$' }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: AAAA }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: IPv6 Addresses
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: CNAME }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: Target Hostname
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: TXT }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: Text values
                  type: array
                  items: { type: string }
                  minItems: 1
              required: [values]
            - properties:
                type: { const: MX }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: MX records
                  type: array
                  description: Each value is "<priority> <mail-server-fqdn>"
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 mail.example.com" (lower priority wins)'
              required: [values]
            - properties:
                type: { const: SRV }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: SRV records
                  type: array
                  description: Each value is "<priority> <weight> <port> <target-fqdn>"
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 60 5060 sipserver.example.com"'
              required: [values]
            - properties:
                type: { const: NS }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 172800
                  minimum: 60
                  maximum: 604800
                values:
                  title: Nameservers
                  type: array
                  description: Fully-qualified nameserver hostnames
                  items: { type: string }
                  minItems: 1
                  ui:help: 'Route53 auto-manages apex NS — use this for sub-delegation (e.g. staging.example.com → different NS set).'
              required: [values]
            - properties:
                type: { const: CAA }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: CAA records
                  type: array
                  description: Each value is "<flags> <tag> \"<value>\""
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                  minItems: 1
                  ui:help: 'Example: 0 issue "letsencrypt.org" — restricts which CAs can issue certs.'
              required: [values]
            - properties:
                type: { const: PTR }
                ttl:
                  title: TTL (seconds)
                  type: integer
                  default: 3600
                  minimum: 60
                  maximum: 604800
                values:
                  title: Target hostname
                  type: array
                  description: Hostname this IP reverse-resolves to
                  items: { type: string }
                  minItems: 1
                  maxItems: 1
              required: [values]
            - properties:
                type: { const: ALIAS }
                serviceType:
                  title: AWS Service Type
                  type: string
                  enum: [CloudFront, ALB, NLB, S3Website, APIGateway, GlobalAccelerator, ElasticBeanstalk, Custom]
                  description: AWS service hosting the target. Platform resolves the hosted-zone ID from this.
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the target resource.
                  ui:help: "Example: d1234567890.cloudfront.net or my-alb-12345.us-east-1.elb.amazonaws.com"
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  default: false
              required: [serviceType, dnsName]
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum: [CloudFront, GlobalAccelerator]
                    - properties:
                        serviceType:
                          enum: [ALB, NLB, S3Website, APIGateway, ElasticBeanstalk]
                        targetRegion:
                          title: Target Region
                          type: string
                          pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                          description: Region of the target (ALB/NLB/S3-website/API-Gateway), not the DNS account's region.
                          default: us-east-1
                      required: [targetRegion]
                    - properties:
                        serviceType: { const: Custom }
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          pattern: '^Z[A-Z0-9]+$'
                          description: Hosted zone ID of the target endpoint.
                      required: [customZoneId]

    - title: Routing Policy (Optional)
      description: |
        Anything other than 'simple' requires a setIdentifier.
      properties:
        routingPolicy:
          title: Routing Policy
          type: string
          enum: [simple, weighted, failover, latency, geolocation, geoproximity, multivalue]
          default: simple
      dependencies:
        routingPolicy:
          oneOf:
            - properties:
                routingPolicy: { const: simple }
            - properties:
                routingPolicy: { const: weighted }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight (0-255)
                  type: integer
                  minimum: 0
                  maximum: 255
                  default: 100
              required: [setIdentifier, weight]
            - properties:
                routingPolicy: { const: failover }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                failoverType:
                  title: Failover Role
                  type: string
                  enum: [PRIMARY, SECONDARY]
                healthCheckId:
                  title: Health Check ID (required for PRIMARY)
                  type: string
                  pattern: '^[a-f0-9-]+$'
              required: [setIdentifier, failoverType]
            - properties:
                routingPolicy: { const: latency }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                latencyRegion:
                  title: AWS region for this record
                  type: string
                  pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
              required: [setIdentifier, latencyRegion]
            - properties:
                routingPolicy: { const: geolocation }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                geoContinent:
                  title: Continent (optional)
                  type: string
                  enum: ["", "*", AF, AN, AS, EU, OC, NA, SA]
                  default: ""
                geoCountry:
                  title: Country code (optional)
                  type: string
                  description: ISO 3166-1 alpha-2 (e.g. BR, DE). '*' for default.
                geoSubdivision:
                  title: US state code (optional, only when country=US)
                  type: string
              required: [setIdentifier]
            - properties:
                routingPolicy: { const: geoproximity }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                geoproxAwsRegion:
                  title: AWS Region near which to route (optional)
                  type: string
                  pattern: '^[a-z]{2}-[a-z]+-\d{1}$'
                geoproxLatitude:
                  title: Latitude (optional)
                  type: string
                geoproxLongitude:
                  title: Longitude (optional)
                  type: string
                geoproxBias:
                  title: Bias (-90 to +90)
                  type: integer
                  minimum: -90
                  maximum: 90
                  default: 0
              required: [setIdentifier]
            - properties:
                routingPolicy: { const: multivalue }
                setIdentifier:
                  title: Set Identifier
                  type: string
                  minLength: 1
                  maxLength: 128
                healthCheckId:
                  title: Health Check ID (optional)
                  type: string
                  pattern: '^[a-f0-9-]+$'
              required: [setIdentifier]

  steps:
    - id: fetchZone
      name: Fetch parent Zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.zone }}

    - id: computeKey
      name: Derive resource key
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ parameters.recordName }}
          type: ${{ parameters.type }}
          setIdentifier: ${{ parameters.setIdentifier }}
        expression: '$lowercase((recordName ? recordName : "apex-" & type) & (setIdentifier ? "-" & setIdentifier : ""))'

    - id: writeXR
      name: Write Record XR manifest
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Record
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
          spec:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            aws:
              account: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-id'] | int }}
              accountName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
            zoneId: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
            zoneName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            recordName: ${{ parameters.recordName }}
            type: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for v in parameters.values %}
              - ${{ v }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
              {%- if parameters.targetRegion %}
              region: ${{ parameters.targetRegion }}
              {%- endif %}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
            {%- endif %}
            {%- if parameters.routingPolicy == 'weighted' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- elif parameters.routingPolicy == 'failover' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            failoverRoutingPolicy:
              type: ${{ parameters.failoverType }}
              {%- if parameters.healthCheckId %}
            healthCheckId: ${{ parameters.healthCheckId }}
              {%- endif %}
            {%- elif parameters.routingPolicy == 'latency' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            latencyRoutingPolicy:
              region: ${{ parameters.latencyRegion }}
            {%- elif parameters.routingPolicy == 'geolocation' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            geolocationRoutingPolicy:
              {%- if parameters.geoContinent %}
              continent: ${{ parameters.geoContinent }}
              {%- endif %}
              {%- if parameters.geoCountry %}
              country: ${{ parameters.geoCountry }}
              {%- endif %}
              {%- if parameters.geoSubdivision %}
              subdivision: ${{ parameters.geoSubdivision }}
              {%- endif %}
            {%- elif parameters.routingPolicy == 'geoproximity' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            geoproximityRoutingPolicy:
              {%- if parameters.geoproxAwsRegion %}
              awsRegion: ${{ parameters.geoproxAwsRegion }}
              {%- endif %}
              {%- if parameters.geoproxLatitude and parameters.geoproxLongitude %}
              coordinates:
                latitude: "${{ parameters.geoproxLatitude }}"
                longitude: "${{ parameters.geoproxLongitude }}"
              {%- endif %}
              {%- if parameters.geoproxBias %}
              bias: ${{ parameters.geoproxBias }}
              {%- endif %}
            {%- elif parameters.routingPolicy == 'multivalue' %}
            setIdentifier: ${{ parameters.setIdentifier }}
            multivalueAnswerRoutingPolicy: true
              {%- if parameters.healthCheckId %}
            healthCheckId: ${{ parameters.healthCheckId }}
              {%- endif %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            title: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            description: "DNS ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }})"
            annotations:
              dock.tech/xr-kind: Record
              dock.tech/xr-name: record-${{ steps.computeKey.output.result }}.${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-id: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
              dock.tech/record-name: ${{ parameters.recordName }}
              dock.tech/record-type: ${{ parameters.type }}
              dock.tech/record-fqdn: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
              dock.tech/managed-by: scaffolder
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
              backstage.io/edit-url: /create/templates/default/aws-dns-record-edit?formData=${{ parameters | dump | urlencode }}
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml"
            tags:
              - aws
              - dns
              - route53
              - record
              - ${{ parameters.type | lower }}
              - ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones#ListRecordSets/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-id'] }}
                icon: cloud
              - title: Delete record (opens GitHub delete UI)
                url: https://github.com/arthur-bryan/aws-dns-crossplane-poc/delete/feature/ape-platform-alignment/entities/environments/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/record-${{ steps.computeKey.output.result }}.yaml
                icon: delete
          spec:
            type: aws-dns-record
            owner: ${{ steps.fetchZone.output.entity.spec.owner }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
            dependsOn:
              - resource:default/zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}

    - id: openPR
      name: Open PR with new record manifest
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-${{ steps.computeKey.output.result }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
        targetBranchName: feature/ape-platform-alignment
        title: "feat(dns): create ${{ parameters.type }} record ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else ('at apex of ' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) }}"
        description: |
          Scaffolder-generated Record XR.

          System: ${{ parameters.system }}
          Environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
          Zone: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
          Record: ${{ (parameters.recordName + '.' + steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name']) if parameters.recordName else (steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] + ' (apex)') }} (${{ parameters.type }})

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
