apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing AWS Route53 DNS Record
  description: >
    Adopt an existing Route53 record into platform management. The platform
    finds the record by its zone + name + type, takes over its lifecycle,
    and from then on treats it like any other platform-managed record
    (no UI delete button; removing the XR is an admin-level operation
    that DOES propagate the deletion to Route53).
  labels:
    category: resources
  tags:
    - resource
    - aws
    - dns
    - claim
spec:
  type: resource

  parameters:
    - title: DNS Record to Claim
      required:
        - environment
        - zoneId
        - existingRecord
        - owner
      properties:
        environment:
          title: Environment
          type: string
          enum: [dev, hml, prd]
          default: prd
        zoneId:
          title: DNS Zone
          type: string
          description: Live Route53 hosted zones in the selected environment.
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment
        existingRecord:
          title: Existing Record
          type: object
          description: Pick the record. Type / TTL / values auto-populate from Route53.
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zoneId
          properties:
            name:    { type: string }
            type:    { type: string }
            ttl:     { type: integer }
            values:  { type: array, items: { type: string } }
            aliasTarget:
              type: object
              properties:
                dnsName:              { type: string }
                hostedZoneId:         { type: string }
                evaluateTargetHealth: { type: boolean }
        owner:
          title: Owner
          type: string
          description: One of your groups will own this record (controls who can view/edit). Claims require manual approval before merge.
          ui:field: MyGroupsPicker

  steps:
    - id: deriveAccount
      name: Derive account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
        expression: >-
          env = "dev" ? {"accountId": "309670275661", "accountName": "dev-account"}
          : env = "hml" ? {"accountId": "382598791794", "accountName": "hml-account"}
          : env = "prd" ? {"accountId": "597230762851", "accountName": "prd-account"}
          : {"accountId": "", "accountName": ""}

    - id: deriveZoneName
      name: Derive zone name from the picked record's FQDN
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ parameters.existingRecord.name }}
        # Trim the trailing dot Route53 returns and drop the record-name
        # prefix to leave the zone name (e.g. "host1.foo.example.com." -> "foo.example.com").
        # The record's FQDN is the picker output; the zone's FQDN is the
        # everything-after-the-first-label suffix. For apex records (where
        # recordName == zoneName) this is a no-op.
        expression: >-
          (
            $name := $replace(recordName, /\.$/, "");
            $contains($name, ".") and ($count($split($name, ".")) > 2)
              ? $join($filter($split($name, "."), function($v, $i) { $i > 0 }), ".")
              : $name
          )

    - id: computeRecordName
      name: Compute zone-relative record name
      action: roadiehq:utils:jsonata
      input:
        data:
          fqdn: ${{ parameters.existingRecord.name }}
          zoneName: ${{ steps.deriveZoneName.output.result }}
        # Strip trailing dot and the ".<zoneName>" suffix to leave just the
        # record name (e.g. "checkout-1.hml.arthurbryan.com." -> "checkout-1").
        # Apex records (where the FQDN equals the zone name) return "".
        expression: >-
          (
            $f := $replace(fqdn, /\.$/, "");
            $f = zoneName ? "" : $replace($f, "." & zoneName, "")
          )

    - id: editFormData
      name: Build edit form data for the catalog Resource entity
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          zoneName: ${{ steps.deriveZoneName.output.result }}
          recordName: ${{ steps.computeRecordName.output.result }}
          recordType: ${{ parameters.existingRecord.type }}
          ttl: ${{ parameters.existingRecord.ttl }}
          values: ${{ parameters.existingRecord.values }}
        # Shape the JSON the way aws-dns-record-edit expects, so clicking
        # the pencil in the catalog opens that template's form pre-filled
        # with the record's current state. No 'import' flag: the
        # composition adopts the existing AWS record via its external-name
        # (zoneId + fqdn + type) regardless, and we want kubectl-delete
        # of the XR to cascade to Route53.
        expression: >-
          {
            "zone": "resource:system-infrastructure-" & env & "/zone-" & zoneName,
            "recordName": recordName,
            "type": recordType,
            "ttl": ttl,
            "values": values,
            "routingPolicy": "simple"
          }

    - id: branchSuffix
      name: Compute unique branch suffix
      action: roadiehq:utils:jsonata
      input:
        data: {}
        expression: '$string($millis())'

    - id: writeXR
      name: Write Record XR manifest
      action: roadiehq:utils:fs:write
      input:
        # Same path convention as the create template so the pencil-edit
        # flow finds and overwrites this file in place.
        path: >-
          entities/environments/cross/cloud/infrastructure/${{ parameters.environment }}/resources/aws/${{ steps.deriveZoneName.output.result }}/record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Record
          metadata:
            name: record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.${{ steps.deriveZoneName.output.result }}
            namespace: system-infrastructure-${{ parameters.environment }}
            annotations:
              # Stored in the record-edit-shape so the edit template can read
              # it back via dock.tech/scaffolder-parameters and pre-fill.
              dock.tech/scaffolder-parameters: '${{ steps.editFormData.output.result | dump }}'
          spec:
            name: record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.${{ steps.deriveZoneName.output.result }}
            domain: cross
            subdomain: cloud
            system: infrastructure
            environment: ${{ parameters.environment }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId | int }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            zoneId: ${{ parameters.zoneId }}
            zoneName: ${{ steps.deriveZoneName.output.result }}
            recordName: "${{ steps.computeRecordName.output.result }}"
            type: ${{ parameters.existingRecord.type }}
            {%- if parameters.existingRecord.aliasTarget %}
            aliasTarget:
              serviceType: Custom
              dnsName: ${{ parameters.existingRecord.aliasTarget.dnsName }}
              hostedZoneId: ${{ parameters.existingRecord.aliasTarget.hostedZoneId }}
              evaluateTargetHealth: ${{ parameters.existingRecord.aliasTarget.evaluateTargetHealth }}
            {%- else %}
            ttl: ${{ parameters.existingRecord.ttl }}
            values:
            {%- for v in parameters.existingRecord.values %}
              - ${{ v }}
            {%- endfor %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Write Backstage Resource entity for the claimed record
      action: roadiehq:utils:fs:write
      input:
        # Same path + naming as the create template so the pencil-edit
        # action and the rest of the catalog tooling work uniformly.
        path: >-
          entities/catalog/${{ parameters.environment }}/${{ steps.deriveZoneName.output.result }}/record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.${{ steps.deriveZoneName.output.result }}
            namespace: system-infrastructure-${{ parameters.environment }}
            title: ${{ parameters.existingRecord.name }}
            description: "Claimed ${{ parameters.existingRecord.type }} record ${{ parameters.existingRecord.name }} (${{ parameters.environment }})"
            annotations:
              dock.tech/xr-kind: Record
              dock.tech/xr-name: record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.${{ steps.deriveZoneName.output.result }}
              dock.tech/zone-name: ${{ steps.deriveZoneName.output.result }}
              dock.tech/zone-id: ${{ parameters.zoneId }}
              dock.tech/record-name: "${{ steps.computeRecordName.output.result }}"
              dock.tech/record-type: ${{ parameters.existingRecord.type }}
              dock.tech/record-fqdn: ${{ parameters.existingRecord.name }}
              dock.tech/domain: cross
              dock.tech/subdomain: cloud
              dock.tech/system: infrastructure
              dock.tech/environment: ${{ parameters.environment }}
              dock.tech/aws-account-id: "${{ steps.deriveAccount.output.result.accountId }}"
              dock.tech/aws-account-name: ${{ steps.deriveAccount.output.result.accountName }}
              dock.tech/managed-by: scaffolder
              # Stored in record-edit-shape so the edit template can hydrate.
              dock.tech/scaffolder-parameters: '${{ steps.editFormData.output.result | dump }}'
              backstage.io/edit-url: /create/templates/default/aws-dns-record-edit?formData=${{ steps.editFormData.output.result | dump | urlencode }}
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/cross/cloud/infrastructure/${{ parameters.environment }}/resources/aws/${{ steps.deriveZoneName.output.result }}/record-${{ steps.computeRecordName.output.result if steps.computeRecordName.output.result else ('apex-' + (parameters.existingRecord.type | lower)) }}.yaml"
            tags:
              - aws
              - dns
              - route53
              - record
              - ${{ parameters.existingRecord.type | lower }}
              - ${{ parameters.environment }}
          spec:
            type: aws-dns-record
            owner: ${{ parameters.owner }}
            system: infrastructure
            dependsOn:
              - resource:default/zone-${{ steps.deriveZoneName.output.result }}

    - id: openPR
      name: Open PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/record-claim-${{ parameters.existingRecord.name | replace('.', '-') }}-${{ parameters.existingRecord.type | lower }}-${{ parameters.environment }}-${{ steps.branchSuffix.output.result }}
        targetBranchName: feature/ape-platform-alignment
        title: "chore(dns): claim existing ${{ parameters.existingRecord.type }} record ${{ parameters.existingRecord.name }} (${{ parameters.environment }})"
        description: |
          This is a **claim** PR — it brings an existing AWS Route53 record
          under platform management. Unlike create / edit PRs, claims are
          NOT auto-merged. A human must review and merge.

          What to check before merging:
            - the requester (PR author) is in the proposed owner group
            - the record really belongs to that team
            - the record is not already claimed (no duplicate XR for the
              same name + type in the cluster)

          After merge: the platform adopts the record via its external-name
          (`<zoneId>_<fqdn>_<type>`) and from then on runs it with full
          management policies. The current AWS state (TTL, values, routing
          policy) is preserved on adoption; subsequent edits propagate
          through the platform; and removing the XR with kubectl WILL
          delete the Route53 record (admin-level action, no UI button).

          Record: ${{ parameters.existingRecord.name }}
          Type: ${{ parameters.existingRecord.type }}
          Zone: ${{ steps.deriveZoneName.output.result }} (${{ parameters.zoneId }})
          Account: ${{ steps.deriveAccount.output.result.accountName }} (${{ steps.deriveAccount.output.result.accountId }})
          Owner: ${{ parameters.owner }}

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
