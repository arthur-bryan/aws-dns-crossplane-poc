apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing AWS Route53 DNS Record
  description: Bring an existing Route53 record under platform management
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
    - hidden
    - cloud-infrastructure
spec:
  owner: group:dock-tech/cloud-infrastructure
  type: resource

  parameters:
    - title: DNS Record to Claim
      required:
        - system
        - environment
        - zone
        - existingRecord
      properties:
        system:
          title: System
          type: string
          description: System that will own this record
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the record exists
          ui:field: EnvironmentPicker

        zone:
          title: DNS Zone
          type: object
          description: The Route53 hosted zone containing this record
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        existingRecord:
          title: Existing Record
          type: object
          description: Select the existing Route53 record to bring under management
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zone

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - id: deriveAccount
      name: Derive DNS account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          systemEnvironments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $env := $filter(systemEnvironments, function($e) { $e.name = env })[0];
            $env ? { "accountId": $string($env.aws.account), "accountName": $env.aws.accountName }
                 : { "accountId": "", "accountName": "" }
          )

    - id: computeRecordName
      name: Compute zone-relative record name
      action: roadiehq:utils:jsonata
      input:
        data:
          fqdn: ${{ parameters.existingRecord.name }}
          zoneName: ${{ parameters.zone.name }}
        expression: >-
          (
            $f := $replace(fqdn, /\.$/, "");
            $z := $replace(zoneName, /\.$/, "");
            $f = $z ? "" : $replace($f, "." & $z, "")
          )

    - id: composeName
      name: Compose resource name from record fields
      action: roadiehq:utils:jsonata
      input:
        data:
          recordName: ${{ steps.computeRecordName.output.result }}
          type: ${{ parameters.existingRecord.type }}
          zoneName: ${{ parameters.zone.name }}
          environment: ${{ parameters.environment }}
        expression: >-
          $join($split($replace(recordName, /\.$/, ""), "."), "-") & "-" & $lowercase(type) & "-" & $join($split($replace(zoneName, /\.$/, ""), "."), "-") & "-" & environment

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ steps.composeName.output.result }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS record already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ steps.composeName.output.result }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ steps.composeName.output.result }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: AWS Route53 DNS Record claimed by template
            annotations:
              dock.tech/created-at: ${{ "'" + now() + "'" }}
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: Record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            recordName: "${{ steps.computeRecordName.output.result }}"
            recordType: ${{ parameters.existingRecord.type }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.existingRecord.aliasTarget %}
            aliasTarget:
              serviceType: Custom
              dnsName: ${{ parameters.existingRecord.aliasTarget.dnsName }}
              hostedZoneId: ${{ parameters.existingRecord.aliasTarget.hostedZoneId }}
              evaluateTargetHealth: ${{ parameters.existingRecord.aliasTarget.evaluateTargetHealth }}
            {%- else %}
            ttl: ${{ parameters.existingRecord.ttl }}
            values:
            {%- for v in parameters.existingRecord.values %}
              - ${{ v }}
            {%- endfor %}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ steps.composeName.output.result }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
