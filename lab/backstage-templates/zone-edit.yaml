apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone-edit
  title: Edit AWS Route53 DNS Zone (VPC associations)
  description: Add or remove VPC associations on an existing private hosted zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - dns
    - zone
spec:
  type: resource

  parameters:
    - title: Zone to edit
      required:
        - zone
      properties:
        zone:
          title: Private hosted zone
          type: string
          description: |
            Pick the private hosted zone whose VPC associations you want to edit.
            Public zones cannot be edited through this template (they have no VPCs).
          ui:field: EntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              - kind: Resource
                spec.type: aws-dns-zone
            defaultKind: Resource

    - title: VPC associations
      description: |
        The first VPC in the list is the creation VPC and is immutable.
        Additional VPCs can be added or removed freely. AWS rejects requests
        that would leave the zone with zero VPCs.
      required:
        - vpcs
      properties:
        vpcs:
          title: Associated VPCs
          type: array
          description: All VPCs that should resolve names in this private hosted zone
          minItems: 1
          ui:field: MultiEntityPickerWithPrefill
          ui:options:
            entityRefField: zone
            catalogFilter:
              - kind: Resource
                spec.type: aws-vpc

  steps:
    - id: fetchZone
      name: Fetch existing Zone entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.zone }}

    - id: validateZoneIsPrivate
      name: Validate the picked zone is private
      action: roadiehq:utils:jsonata
      input:
        data:
          visibility: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/visibility'] }}
        # $assert throws when the predicate is false, halting the pipeline
        expression: '$assert(visibility = "private", "This template only edits private hosted zones. Pick a zone whose dock.tech/visibility annotation is `private`.")'

    - id: fetchVpcs
      name: Fetch picked VPC entities (for vpcId / vpcRegion / accountName)
      action: catalog:fetch
      input:
        entityRefs: ${{ parameters.vpcs }}

    - id: stageOriginalParams
      name: Stage original scaffolder parameters as JSON
      action: roadiehq:utils:fs:write
      input:
        path: .e2e/merged-params.json
        content: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/scaffolder-parameters'] }}

    - id: snapshotOriginal
      name: Read original parameters as object
      action: roadiehq:utils:jsonata:json:transform
      input:
        path: .e2e/merged-params.json
        expression: '$'
        as: object

    - id: applyEdits
      name: Merge new VPC selection into original parameters
      action: roadiehq:utils:json:merge
      input:
        path: .e2e/merged-params.json
        content: ${{ parameters }}

    - id: mergeParams
      name: Read merged parameters as object
      action: roadiehq:utils:jsonata:json:transform
      input:
        path: .e2e/merged-params.json
        expression: '$'
        as: object

    - id: writeXR
      name: Write Zone XR manifest with the updated VPC list
      action: roadiehq:utils:fs:write
      input:
        path: >-
          entities/environments/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain']
          }}/${{
            steps.fetchZone.output.entity.metadata.annotations['dock.tech/system']
          }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/zone.yaml
        content: |
          ---
          apiVersion: dock.tech/v1
          kind: Zone
          metadata:
            name: zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            annotations:
              dock.tech/scaffolder-parameters: '${{ steps.mergeParams.output.result | dump }}'
          spec:
            name: zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
            environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            aws:
              account: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-id'] | int }}
              accountName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
            zoneName: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            {%- if steps.mergeParams.output.result.delegatedFromZoneId %}
            delegatedFromZoneId: ${{ steps.mergeParams.output.result.delegatedFromZoneId }}
            {%- endif %}
            {%- if steps.mergeParams.output.result.delegatedFromAccountName %}
            delegatedFromAccountName: ${{ steps.mergeParams.output.result.delegatedFromAccountName }}
            {%- endif %}
            visibility: private
            vpcs:
            {%- for vpc in steps.fetchVpcs.output.entities %}
              - vpcId: ${{ vpc.metadata.annotations['dock.tech/vpc-id'] }}
                vpcRegion: ${{ vpc.metadata.annotations['dock.tech/vpc-region'] }}
                accountName: ${{ vpc.metadata.annotations['dock.tech/aws-account-name'] }}
            {%- endfor %}
            {%- if steps.mergeParams.output.result.tags and (steps.mergeParams.output.result.tags | length) %}
            tags:
              {%- for key, value in steps.mergeParams.output.result.tags %}
              ${{ key }}: ${{ value }}
              {%- endfor %}
            {%- endif %}

    - id: writeCatalogEntity
      name: Rewrite Backstage Resource entity for the zone
      action: roadiehq:utils:fs:write
      input:
        path: entities/catalog/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/zone.yaml
        content: |
          ---
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
            namespace: system-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
            title: "${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }} · ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}"
            description: ${{ steps.fetchZone.output.entity.metadata.description }}
            annotations:
              dock.tech/xr-kind: Zone
              dock.tech/xr-name: zone-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              dock.tech/zone-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
              {%- if steps.fetchZone.output.entity.metadata.annotations['dock.tech/parent-zone-id'] %}
              dock.tech/parent-zone-id: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/parent-zone-id'] }}
              dock.tech/parent-zone-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/parent-zone-name'] }}
              dock.tech/parent-aws-account-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/parent-aws-account-name'] }}
              {%- endif %}
              dock.tech/domain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}
              dock.tech/subdomain: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}
              dock.tech/system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}
              dock.tech/environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
              dock.tech/aws-account-id: "${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-id'] }}"
              dock.tech/aws-account-name: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-name'] }}
              dock.tech/visibility: private
              dock.tech/managed-by: scaffolder
              dock.tech/scaffolder-parameters: '${{ steps.mergeParams.output.result | dump }}'
              backstage.io/edit-url: http://localhost:3000/create/templates/default/aws-dns-zone-edit?formData=${{ {"zone": parameters.zone} | dump | urlencode }}
              backstage.io/source-location: "url:https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/feature/ape-platform-alignment/entities/environments/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/domain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/subdomain'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}/resources/aws/${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}/zone.yaml"
            tags:
              - aws
              - dns
              - route53
              - zone
              - ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
              - private
            links:
              - title: View in AWS Console
                url: https://console.aws.amazon.com/route53/v2/hostedzones
                icon: cloud
          spec:
            type: aws-dns-zone
            owner: ${{ steps.fetchZone.output.entity.spec.owner }}
            system: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/system'] }}

    - id: cleanupStaging
      name: Remove staging artifacts before publishing
      action: fs:delete
      input:
        files:
          - .e2e

    - id: openPR
      name: Open PR with edited VPC associations
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=arthur-bryan&repo=aws-dns-crossplane-poc
        branchName: scaffolder/zone-edit-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}-${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
        targetBranchName: feature/ape-platform-alignment
        title: "chore(dns): update VPC associations on ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }} (${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }})"
        description: |
          Scaffolder-generated edit of the VPC association list on a private hosted zone.

          Zone: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/zone-name'] }}
          Environment: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/environment'] }}
          AWS account: ${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-name'] }} (${{ steps.fetchZone.output.entity.metadata.annotations['dock.tech/aws-account-id'] }})

          The Crossplane composition will reconcile the difference between the new
          and existing VPC associations: removed cross-account VPCs are
          disassociated via DisassociateVPCFromHostedZone, added VPCs are
          associated via AssociateVPCWithHostedZone (with a prior
          CreateVPCAssociationAuthorization for cross-account VPCs).

          The creation VPC (first entry in `spec.vpcs`) is immutable; the XRD
          rejects an edit that changes it.

  output:
    links:
      - title: Pull Request
        url: ${{ steps.openPR.output.remoteUrl }}
