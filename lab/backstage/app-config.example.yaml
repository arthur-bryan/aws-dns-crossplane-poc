# Committed template for lab/backstage/ape-lab/app-config.local.yaml
#
# On first run:
#   export GITHUB_TOKEN=ghp_xxxxxxxxxxxxxxxxx   # PAT with `repo` scope
#   cp lab/backstage/app-config.example.yaml lab/backstage/ape-lab/app-config.local.yaml
#   cd lab/backstage/ape-lab && yarn dev
#
# app-config.local.yaml is gitignored so your PAT references stay local. Any
# non-secret customization lives in THIS file; keep them in sync.

app:
  title: APE Backstage
  baseUrl: http://localhost:3000
  listen:
    host: 0.0.0.0   # Bind to all interfaces so LAN access works through Windows portproxy
    port: 3000

backend:
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0
    port: 7007

organization:
  name: APE Platform

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Domain, Group, User]
  locations:
    # Paths are relative to packages/backend/ (backend cwd when `yarn dev`).
    # lab/backstage/ape-lab/packages/backend/ → 5 ups reaches the repo root.
    #
    # 1. APE hierarchy (Domain, SubDomain, System, Environment) seeded in entities/.
    - type: file
      target: ../../../../../entities/catalog-info.yaml
      rules:
        - allow: [Domain, System, Resource, Group]

    # 2. The DNS scaffolder templates.
    - type: file
      target: ../../../../backstage-templates/catalog-info.yaml
      rules:
        - allow: [Location, Template]

    # 3. Zone + Record Resource entities produced by the scaffolder (and by the
    #    batch import tool). Grouped by env/zone: entities/catalog/<env>/<zone>/*.yaml.
    #    Double-glob picks up every zone folder without needing one entry per env.
    - type: file
      target: ../../../../../entities/catalog/**/*.yaml
      rules:
        - allow: [Resource]

scaffolder:
  defaultAuthor:
    name: APE Scaffolder
    email: scaffolder@ape.local
  defaultCommitMessage: "chore(dns): scaffolder-generated change"

auth:
  providers:
    guest: {}
