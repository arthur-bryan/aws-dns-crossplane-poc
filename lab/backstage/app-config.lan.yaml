# Layer this on top of app-config.local.yaml when you want to reach the lab
# from another machine on your LAN. Edit BACKSTAGE_LAN_URL to your Windows
# host's IPv4 (find via `ipconfig` on Windows), then start Backstage with:
#
#   yarn start --config ../../app-config.local.yaml --config ../../app-config.lan.yaml
#
# Or commit-free: copy this file to ape-lab/app-config.lan.yaml and reference
# it in your start command.
#
# Required prerequisites on the Windows host:
#   - Port forwarding from Windows to WSL2 (netsh interface portproxy)
#   - Windows Defender firewall rules for ports 3000 / 7007 / 80 / 443
# See lab/README.md section "LAN access".

app:
  # Replace with http://<WIN_LAN_IP>:3000
  baseUrl: http://192.168.1.100:3000

backend:
  # Replace with http://<WIN_LAN_IP>:7007
  baseUrl: http://192.168.1.100:7007
  cors:
    # Accept requests coming from the LAN-advertised frontend URL
    origin: http://192.168.1.100:3000
    credentials: true
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
