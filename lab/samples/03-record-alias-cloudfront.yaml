---
# REFERENCE ONLY — showing XR shape produced by the scaffolder.
# Do NOT `kubectl apply` this directly. All Zone/Record lifecycle must flow
# through the Backstage scaffolder -> PR -> ArgoCD path.
#
# ALIAS to a CloudFront distribution. hostedZoneId is resolved by the
# composition from serviceType=CloudFront -> Z2FDTNDATAQYW2 (global).
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: record-cdn.example.com
  namespace: system-infrastructure-dev
spec:
  name: record-cdn.example.com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneName: example.com
  recordName: cdn
  type: ALIAS
  aliasTarget:
    serviceType: CloudFront
    dnsName: d1234567890abcd.cloudfront.net
    evaluateTargetHealth: false
