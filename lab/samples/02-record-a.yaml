# REFERENCE ONLY — showing XR shape produced by the scaffolder.
# Do NOT `kubectl apply` this directly. All Zone/Record lifecycle must flow
# through the Backstage scaffolder -> PR -> ArgoCD path.
#
# A record using zoneName lookup (composition resolves zoneId via an
# observe-only Zone MR).
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: www-example-com
  namespace: system-infrastructure-dev
spec:
  name: www-example-com
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneName: example.com
  recordName: www.example.com
  type: A
  values:
    - 192.0.2.1
    - 192.0.2.2
  ttl: 300
