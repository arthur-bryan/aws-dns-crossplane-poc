---
# REFERENCE ONLY — showing XR shape produced by the scaffolder.
# Do NOT `kubectl apply` this directly. All Zone/Record lifecycle must flow
# through the Backstage scaffolder -> PR -> ArgoCD path.
#
# Blue/green weighted routing: two Records with the same recordName but
# different setIdentifier + weight. Route53 splits traffic 70/30.
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: api-example-com-blue
  namespace: system-infrastructure-dev
spec:
  name: api-example-com-blue
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneName: example.com
  recordName: api.example.com
  type: A
  values:
    - 192.0.2.10
  ttl: 60
  setIdentifier: blue-deployment
  weight: 70
---
apiVersion: dock.tech/v1
kind: Record
metadata:
  name: api-example-com-green
  namespace: system-infrastructure-dev
spec:
  name: api-example-com-green
  domain: cross
  subdomain: cloud
  system: infrastructure
  environment: dev
  aws:
    account: 100000000000
    accountName: dev-account
    region: us-east-1
  zoneName: example.com
  recordName: api.example.com
  type: A
  values:
    - 192.0.2.20
  ttl: 60
  setIdentifier: green-deployment
  weight: 30
