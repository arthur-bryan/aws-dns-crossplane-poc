apiVersion: v1
kind: ServiceAccount
metadata:
  name: stuck-mr-recoverer
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stuck-mr-recoverer
rules:
  - apiGroups: ["route53.aws.m.upbound.io"]
    resources: ["records", "zoneassociations"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stuck-mr-recoverer
subjects:
  - kind: ServiceAccount
    name: stuck-mr-recoverer
    namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stuck-mr-recoverer
