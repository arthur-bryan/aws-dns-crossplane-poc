apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-mr-recoverer
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: stuck-mr-recoverer
    app.kubernetes.io/component: platform-glue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stuck-mr-recoverer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stuck-mr-recoverer
      annotations:
        # Bump to force pod restart when the script ConfigMap changes.
        kubectl.kubernetes.io/restartedAt: "2026-05-14T16:30:00Z"
    spec:
      serviceAccountName: stuck-mr-recoverer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recoverer
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Install boto3 to a writable layer (the rootfs is read-only).
              pip install --no-cache-dir --target /tmp/pylibs boto3 botocore >&2
              export PYTHONPATH=/tmp/pylibs
              exec python -u /script/recoverer.py
          env:
            - name: RECOVER_AFTER_SECONDS
              value: "60"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
            - name: AWS_CREDS_PATH
              value: /var/run/aws-creds/credentials
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: aws-creds
              mountPath: /var/run/aws-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: stuck-mr-recoverer-script
        - name: aws-creds
          secret:
            secretName: aws-creds
        - name: tmp
          emptyDir: {}
