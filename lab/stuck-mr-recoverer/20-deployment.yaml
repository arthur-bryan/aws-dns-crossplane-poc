apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-mr-recoverer
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: stuck-mr-recoverer
    app.kubernetes.io/component: platform-glue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stuck-mr-recoverer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stuck-mr-recoverer
      annotations:
        # Force pod restart when the embedded script changes; ArgoCD computes
        # the configmap hash and renders this annotation via Kustomize/Helm in
        # richer setups. For now we rely on `kubectl rollout restart` after an
        # ArgoCD-synced ConfigMap change.
        kubectl.kubernetes.io/restartedAt: "2026-05-14T00:00:00Z"
    spec:
      serviceAccountName: stuck-mr-recoverer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recoverer
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/script/recoverer.py"]
          env:
            - name: RECOVER_AFTER_SECONDS
              value: "60"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: stuck-mr-recoverer-script
        - name: tmp
          emptyDir: {}
