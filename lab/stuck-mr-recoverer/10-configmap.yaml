apiVersion: v1
kind: ConfigMap
metadata:
  name: stuck-mr-recoverer-script
  namespace: crossplane-system
data:
  recoverer.py: |
    # Watches route53.aws.m.upbound.io MRs and recovers two distinct
    # upjet+terraform-provider-aws bugs:
    #
    # (1) records-only UPDATE bug (crossplane-contrib/provider-upjet-aws#1806).
    #     When only `records` change in an UPDATE, Upjet fails to populate
    #     RawPlan with companion fields and AWS rejects with "Expected exactly
    #     one of [AliasTarget, all of [TTL, and ResourceRecords], or
    #     TrafficPolicyInstanceId], but found none". Recovery: delete the
    #     wrong Route 53 record via the AWS API so Crossplane's next Observe
    #     routes through the working CREATE path.
    #
    # (2) ZoneAssociation create-then-empty-read bug. When the composition
    #     emits a route53_zone_association MR for a second (non-inline) VPC,
    #     upjet's async-create fails with "reading Route 53 Zone Association
    #     (<zoneId>:<vpcId>:<region>): empty result". The actual AWS
    #     AssociateVPCWithHostedZone call is fine when issued directly --
    #     upjet is dropping the association request silently. Recovery: call
    #     the AWS API ourselves to make the association; upjet's next
    #     Observe will pick it up and the MR will go Ready.
    import datetime, json, logging, os, ssl, time, urllib.error, urllib.request

    import boto3
    from botocore.exceptions import ClientError

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("stuck-mr-recoverer")

    K8S_HOST = "https://kubernetes.default.svc"
    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    HEADERS_JSON = {
        "Authorization": f"Bearer {TOKEN}",
        "Accept": "application/json",
    }
    HEADERS_JSON_POST = {
        **HEADERS_JSON,
        "Content-Type": "application/json",
    }
    HEADERS_MERGE_PATCH = {
        **HEADERS_JSON,
        "Content-Type": "application/merge-patch+json",
    }

    RECOVER_AFTER = int(os.environ.get("RECOVER_AFTER_SECONDS", "60"))
    POLL_INTERVAL = int(os.environ.get("POLL_INTERVAL_SECONDS", "30"))
    AWS_CREDS_PATH = os.environ.get(
        "AWS_CREDS_PATH", "/var/run/aws-creds/credentials"
    )
    ERROR_SIGNATURE = (
        "Expected exactly one of [AliasTarget, all of [TTL, and ResourceRecords]"
    )
    ZONE_ASSOC_ERROR_SIGNATURE = (
        "reading Route 53 Zone Association"
    )

    ctx = ssl.create_default_context(cafile=CA_PATH)


    def _read_aws_creds(path):
        access_key = secret_key = None
        with open(path) as f:
            for line in f:
                line = line.strip()
                if line.startswith("aws_access_key_id"):
                    access_key = line.split("=", 1)[1].strip()
                elif line.startswith("aws_secret_access_key"):
                    secret_key = line.split("=", 1)[1].strip()
        if not (access_key and secret_key):
            raise RuntimeError(f"could not parse AWS credentials from {path}")
        return access_key, secret_key


    AWS_KEY, AWS_SECRET = _read_aws_creds(AWS_CREDS_PATH)

    # Role chains keyed by ClusterProviderConfig name. Mirrors the
    # `assumeRoleChain` in lab/provider-config/<account>.yaml. The prd-account
    # provider uses the base creds directly (no role assumption).
    PROVIDER_ROLE_CHAIN = {
        "dev-account": ["arn:aws:iam::309670275661:role/OrganizationAccountAccessRole"],
        "hml-account": ["arn:aws:iam::382598791794:role/OrganizationAccountAccessRole"],
        "prd-account": [],
    }

    _route53_clients: dict[str, object] = {}

    def route53_for(provider_config: str = "prd-account"):
        """Return a boto3 Route53 client whose credentials match the
        ClusterProviderConfig in question (assuming the configured role
        chain). Cached per-config; tokens last an hour so we let the cache
        live and rebuild on AccessDenied."""
        c = _route53_clients.get(provider_config)
        if c is not None:
            return c
        chain = PROVIDER_ROLE_CHAIN.get(provider_config, [])
        if not chain:
            c = boto3.client(
                "route53",
                aws_access_key_id=AWS_KEY,
                aws_secret_access_key=AWS_SECRET,
                region_name="us-east-1",
            )
        else:
            sts = boto3.client(
                "sts",
                aws_access_key_id=AWS_KEY,
                aws_secret_access_key=AWS_SECRET,
                region_name="us-east-1",
            )
            creds = {
                "AccessKeyId": AWS_KEY,
                "SecretAccessKey": AWS_SECRET,
                "SessionToken": None,
            }
            for role_arn in chain:
                sts_client = boto3.client(
                    "sts",
                    aws_access_key_id=creds["AccessKeyId"],
                    aws_secret_access_key=creds["SecretAccessKey"],
                    aws_session_token=creds["SessionToken"],
                    region_name="us-east-1",
                )
                out = sts_client.assume_role(
                    RoleArn=role_arn,
                    RoleSessionName=f"stuck-mr-recoverer-{provider_config}",
                )["Credentials"]
                creds = {
                    "AccessKeyId": out["AccessKeyId"],
                    "SecretAccessKey": out["SecretAccessKey"],
                    "SessionToken": out["SessionToken"],
                }
            c = boto3.client(
                "route53",
                aws_access_key_id=creds["AccessKeyId"],
                aws_secret_access_key=creds["SecretAccessKey"],
                aws_session_token=creds["SessionToken"],
                region_name="us-east-1",
            )
        _route53_clients[provider_config] = c
        return c

    # Records-recovery code path uses the prd-account client (existing zone
    # `arthurbryan.com` and all record MRs are in prd-account). Aliased for
    # backwards compatibility with the rest of the script.
    route53 = route53_for("prd-account")


    def k8s(method, path, headers=None, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(
            f"{K8S_HOST}{path}", method=method,
            headers=headers or HEADERS_JSON,
            data=data,
        )
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                raw = r.read()
                return json.loads(raw) if raw else {}
        except urllib.error.HTTPError as e:
            log.error(f"{method} {path} -> {e.code} {e.reason}: {e.read().decode()[:300]}")
            raise


    def list_records():
        return k8s("GET", "/apis/route53.aws.m.upbound.io/v1beta1/records").get("items", [])


    def list_zone_associations():
        return k8s("GET", "/apis/route53.aws.m.upbound.io/v1beta1/zoneassociations").get("items", [])


    # uid -> first time the recoverer observed this MR stuck on the signature.
    # We can't rely on the Synced condition's lastTransitionTime: Crossplane
    # bumps it on every failed retry, so it never ages past RECOVER_AFTER.
    first_seen = {}


    def is_stuck(mr):
        uid = mr["metadata"]["uid"]
        conditions = mr.get("status", {}).get("conditions", [])
        synced = next((c for c in conditions if c.get("type") == "Synced"), None)
        signature_match = (
            synced is not None
            and synced.get("status") == "False"
            and ERROR_SIGNATURE in (synced.get("message", "") or "")
        )
        if not signature_match:
            first_seen.pop(uid, None)
            return False
        now = datetime.datetime.now(datetime.timezone.utc)
        first = first_seen.setdefault(uid, now)
        age = (now - first).total_seconds()
        return age >= RECOVER_AFTER


    # Separate tracking dict for the create-then-empty-read stuck pattern.
    # See is_stuck_create_observe below.
    first_seen_co = {}


    def is_stuck_create_observe(mr):
        """Upjet 'create-then-empty-read': Create succeeded (succeeded
        annotation stamped), but the subsequent Observe returned empty
        (atProvider has no .type / no records) and external-create-pending
        was never cleared. Synced=True (the reconcile didn't raise), but
        Ready stays at False/Creating forever. The AWS record DOES exist
        (verified out-of-band) -- upjet just can't see it. Recovery is to
        clear external-create-pending so the next reconcile drops out of
        the create code path and goes straight to Observe."""
        uid = mr["metadata"]["uid"]
        ann = (mr.get("metadata", {}).get("annotations") or {})
        pending = ann.get("crossplane.io/external-create-pending")
        succeeded = ann.get("crossplane.io/external-create-succeeded")
        conditions = mr.get("status", {}).get("conditions", [])
        ready = next((c for c in conditions if c.get("type") == "Ready"), None)
        at = mr.get("status", {}).get("atProvider") or {}
        # Pattern: both create-state annotations set, atProvider empty,
        # Ready=False/Creating. (Synced is True/ReconcileSuccess in this
        # path, but we don't strictly require it -- the annotations + empty
        # atProvider + Ready=Creating already uniquely identify the case.)
        signature_match = (
            bool(pending)
            and bool(succeeded)
            and (not at.get("type"))
            and ready is not None
            and ready.get("status") == "False"
            and ready.get("reason") == "Creating"
        )
        if not signature_match:
            first_seen_co.pop(uid, None)
            return False
        now = datetime.datetime.now(datetime.timezone.utc)
        first = first_seen_co.setdefault(uid, now)
        age = (now - first).total_seconds()
        return age >= RECOVER_AFTER


    def recover_create_observe(mr):
        ns = mr["metadata"]["namespace"]
        name = mr["metadata"]["name"]
        uid = mr["metadata"]["uid"]
        path = (f"/apis/route53.aws.m.upbound.io/v1beta1/namespaces/"
                f"{ns}/records/{name}")
        try:
            k8s("PATCH", path, headers=HEADERS_MERGE_PATCH, body={
                "metadata": {"annotations": {
                    # Setting to null deletes the annotation via merge-patch.
                    "crossplane.io/external-create-pending": None,
                }},
            })
        except Exception as e:
            log.warning(f"{ns}/{name} create-observe patch failed: {e}")
            return
        emit_event(ns, name, uid, "CreateObserveRecovered",
                   "cleared external-create-pending; upjet will re-observe and "
                   "mark Ready (create-then-empty-read pattern)")
        first_seen_co.pop(uid, None)
        log.info(
            f"{ns}/{name} cleared external-create-pending (create-then-empty-"
            f"read); upjet will mark Ready on next observe"
        )


    def emit_event(ns, name, uid, reason, message):
        now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        body = {
            "apiVersion": "v1",
            "kind": "Event",
            "metadata": {
                "generateName": f"stuck-mr-recoverer-{name[:40]}-",
                "namespace": ns,
            },
            "involvedObject": {
                "apiVersion": "route53.aws.m.upbound.io/v1beta1",
                "kind": "Record",
                "namespace": ns,
                "name": name,
                "uid": uid,
            },
            "reason": reason,
            "message": message,
            "type": "Warning",
            "firstTimestamp": now,
            "lastTimestamp": now,
            "source": {"component": "stuck-mr-recoverer"},
        }
        try:
            k8s("POST", f"/api/v1/namespaces/{ns}/events",
                headers=HEADERS_JSON_POST, body=body)
        except Exception as e:
            log.warning(f"emit_event failed for {ns}/{name}: {e}")


    def delete_aws_record(mr):
        """Look the record up live in Route 53 and issue a DELETE that mirrors
        the existing ResourceRecordSet byte-for-byte. We can't trust
        status.atProvider here: the previous recovery iteration may have
        deleted+recomposed the MR before the provider had a chance to
        re-observe AWS, so atProvider is often empty in the stuck-loop case.
        spec.forProvider always has zoneId + name + type + (optional) setId,
        which is enough to find the record."""
        spec = mr["spec"]["forProvider"]
        zone_id = spec["zoneId"]
        name = spec["name"]
        record_type = spec["type"]
        set_id = (spec.get("setIdentifier") or "").strip() or None

        # AWS returns names with a trailing dot; compare both forms.
        name_with_dot = name if name.endswith(".") else name + "."

        paginator = route53.get_paginator("list_resource_record_sets")
        matching = []
        for page in paginator.paginate(
            HostedZoneId=zone_id,
            StartRecordName=name,
            StartRecordType=record_type,
        ):
            for rrs in page["ResourceRecordSets"]:
                if rrs["Name"] != name_with_dot:
                    continue
                if rrs["Type"] != record_type:
                    continue
                if set_id and rrs.get("SetIdentifier") != set_id:
                    continue
                if not set_id and "SetIdentifier" in rrs:
                    continue
                matching.append(rrs)
            # Stop early once paginator walks past the target name+type.
            if (
                page.get("IsTruncated")
                and page.get("NextRecordName", "") > name_with_dot
            ):
                break

        if not matching:
            log.info(
                f"AWS Route 53 record {name_with_dot} ({record_type}, "
                f"setId={set_id!r}) already absent in zone {zone_id}; nothing "
                f"to delete"
            )
            return

        changes = [{"Action": "DELETE", "ResourceRecordSet": rrs} for rrs in matching]
        log.info(
            f"AWS Route53 DELETE zone={zone_id} name={name_with_dot} "
            f"type={record_type} setId={set_id!r} count={len(changes)}"
        )
        try:
            route53.change_resource_record_sets(
                HostedZoneId=zone_id, ChangeBatch={"Changes": changes}
            )
        except ClientError as e:
            err = e.response.get("Error", {})
            msg = err.get("Message", "")
            # Concurrent recovery may have raced us to the DELETE; treat as ok.
            if err.get("Code") == "InvalidChangeBatch" and "not found" in msg.lower():
                log.info("AWS reported record gone mid-flight; nothing to do")
                return
            raise


    def recover(mr):
        meta = mr["metadata"]
        ns, name, uid = meta["namespace"], meta["name"], meta["uid"]
        log.info(
            f"{ns}/{name} stuck on upjet records-only UPDATE bug "
            f"(provider-upjet-aws#1806); deleting AWS record so Crossplane "
            f"re-Creates via the working CREATE path"
        )
        emit_event(
            ns, name, uid, "StuckMRRecovery",
            "Detected records-only UPDATE bug (provider-upjet-aws#1806); "
            "deleting the underlying AWS Route 53 record so Crossplane's next "
            "Observe routes through the CREATE path",
        )
        delete_aws_record(mr)
        # Reset our memory so we don't immediately retry if Crossplane has
        # already created a fresh MR with the same UID (it won't, but defensive).
        first_seen.pop(uid, None)
        log.info(
            f"{ns}/{name} AWS record deleted; Crossplane will recreate "
            f"with the correct forProvider state"
        )


    # -----------------------------------------------------------------------
    # ZoneAssociation handler: upjet "empty result" create bug
    # -----------------------------------------------------------------------

    def is_zone_assoc_stuck(mr):
        uid = mr["metadata"]["uid"]
        conditions = mr.get("status", {}).get("conditions", [])
        # Two signals: Synced=False with the signature, or LastAsyncOperation
        # AsyncCreateFailure with the signature (the more common state).
        synced = next((c for c in conditions if c.get("type") == "Synced"), None)
        last_op = next((c for c in conditions if c.get("type") == "LastAsyncOperation"), None)
        ready = next((c for c in conditions if c.get("type") == "Ready"), None)

        ready_status = ready.get("status") if ready else ""
        last_op_msg = (last_op.get("message", "") or "") if last_op else ""
        synced_msg = (synced.get("message", "") or "") if synced else ""

        # If Ready=True, nothing to do.
        if ready_status == "True":
            first_seen.pop(uid, None)
            return False

        # Either the Synced or LastAsyncOperation message must show the bug
        # signature; we tolerate either since upjet sometimes clears one while
        # leaving the other.
        signature_match = (
            ZONE_ASSOC_ERROR_SIGNATURE in last_op_msg
            or ZONE_ASSOC_ERROR_SIGNATURE in synced_msg
        )
        if not signature_match:
            first_seen.pop(uid, None)
            return False

        now = datetime.datetime.now(datetime.timezone.utc)
        first = first_seen.setdefault(uid, now)
        age = (now - first).total_seconds()
        return age >= RECOVER_AFTER


    def recover_zone_association(mr):
        meta = mr["metadata"]
        ns, name, uid = meta["namespace"], meta["name"], meta["uid"]
        spec = mr["spec"]["forProvider"]
        zone_id = spec["zoneId"]
        vpc_id = spec["vpcId"]
        vpc_region = spec.get("vpcRegion", "us-east-1")
        # The MR's providerConfigRef tells us which account to act in -- the
        # composition routes the ZoneAssociation MR to the VPC's owning
        # account so the AWS API call is authorized.
        provider_cfg = (mr.get("spec", {}).get("providerConfigRef", {})
                        .get("name", "prd-account"))
        log.info(
            f"{ns}/{name} stuck on upjet ZoneAssociation create bug; "
            f"associating vpc={vpc_id} region={vpc_region} to zone={zone_id} "
            f"via AWS API directly (using {provider_cfg} credentials)"
        )
        emit_event(
            ns, name, uid, "StuckMRRecovery",
            "Detected upjet ZoneAssociation 'empty result' bug; "
            "calling AssociateVPCWithHostedZone directly so Crossplane's "
            "next Observe will see the association and mark Ready",
        )
        client = route53_for(provider_cfg)
        try:
            client.associate_vpc_with_hosted_zone(
                HostedZoneId=zone_id,
                VPC={"VPCRegion": vpc_region, "VPCId": vpc_id},
            )
        except ClientError as e:
            err = e.response.get("Error", {})
            # ConflictingDomainExists means the VPC is already associated;
            # that's exactly the state we want, so treat as success.
            if err.get("Code") in ("ConflictingDomainExists",
                                   "VPCAlreadyAssociatedException"):
                log.info(f"{ns}/{name} VPC already associated; nothing to do")
            else:
                raise

        # The AWS state is now correct, but upjet is still stuck in
        # "Creating" because the original async-create returned an error and
        # its retry path keeps hitting VPCAlreadyAssociatedException without
        # transitioning the MR to Ready. We need to tell the Crossplane
        # runtime three things at once:
        #   1) Create has succeeded -> set external-create-succeeded
        #   2) There is no pending Create -> clear external-create-pending
        #   3) There is no past failure to retry -> clear external-create-failed
        # Without (2) and (3), upjet's reconciler will kick off another
        # Create attempt on the next sync-period and we flip back to
        # Ready=False reason=Creating.
        now_iso = datetime.datetime.now(datetime.timezone.utc).strftime(
            "%Y-%m-%dT%H:%M:%SZ"
        )
        path = (f"/apis/route53.aws.m.upbound.io/v1beta1/namespaces/"
                f"{ns}/zoneassociations/{name}")
        try:
            k8s("PATCH", path, headers=HEADERS_MERGE_PATCH, body={
                "metadata": {"annotations": {
                    "crossplane.io/external-create-succeeded": now_iso,
                    # Setting to null deletes the annotation via merge-patch.
                    "crossplane.io/external-create-pending": None,
                    "crossplane.io/external-create-failed": None,
                }},
            })
        except Exception as e:
            log.warning(f"{ns}/{name} annotation patch failed: {e}")

        first_seen.pop(uid, None)
        log.info(
            f"{ns}/{name} VPC associated and create-state annotations "
            f"reset; upjet will mark Ready"
        )


    def main():
        log.info(
            f"stuck-mr-recoverer started; recover_after={RECOVER_AFTER}s, "
            f"poll={POLL_INTERVAL}s"
        )
        tick = 0
        while True:
            tick += 1
            start = time.monotonic()
            stuck_records = stuck_co = stuck_assocs = 0
            try:
                mrs = list_records()
                for mr in mrs:
                    if is_stuck(mr):
                        stuck_records += 1
                        try:
                            recover(mr)
                        except Exception as e:
                            log.error(
                                f"records recovery failed for "
                                f"{mr['metadata']['namespace']}/"
                                f"{mr['metadata']['name']}: {e}"
                            )
                        continue  # don't double-recover the same MR
                    if is_stuck_create_observe(mr):
                        stuck_co += 1
                        try:
                            recover_create_observe(mr)
                        except Exception as e:
                            log.error(
                                f"create-observe recovery failed for "
                                f"{mr['metadata']['namespace']}/"
                                f"{mr['metadata']['name']}: {e}"
                            )
                assocs = list_zone_associations()
                for mr in assocs:
                    if not is_zone_assoc_stuck(mr):
                        continue
                    stuck_assocs += 1
                    try:
                        recover_zone_association(mr)
                    except Exception as e:
                        log.error(
                            f"zone-assoc recovery failed for "
                            f"{mr['metadata']['namespace']}/"
                            f"{mr['metadata']['name']}: {e}"
                        )
                if tick % 10 == 0:
                    log.info(
                        f"tick={tick} records={len(mrs)} stuck_records={stuck_records} "
                        f"stuck_create_observe={stuck_co} "
                        f"assocs={len(assocs)} stuck_assocs={stuck_assocs} "
                        f"tracking={len(first_seen)+len(first_seen_co)}"
                    )
            except Exception as e:
                log.error(f"loop error: {type(e).__name__}: {e}")
            elapsed = time.monotonic() - start
            time.sleep(max(0.0, POLL_INTERVAL - elapsed))


    if __name__ == "__main__":
        main()
