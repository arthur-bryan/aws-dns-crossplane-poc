---
# Root App-of-Apps — applies every manifest under lab/argocd/apps/.
# Deploy with: kubectl apply -f lab/argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/arthur-bryan/aws-dns-crossplane-poc
    targetRevision: feature/ape-platform-alignment
    path: lab/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo auto-stamps child Applications with the tracking label
  # argocd.argoproj.io/instance=lab-root. The label isn't in the manifests on
  # git, so without this rule the root-app would permanently show OutOfSync.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.metadata.labels."argocd.argoproj.io/instance"'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
