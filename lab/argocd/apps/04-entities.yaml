---
# Syncs all entity YAML files under entities/ into the cluster.
# This is the GitOps source of truth for XRs (Zone, Record) generated by
# Backstage scaffolder PRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: entities
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/arthur-bryan/aws-dns-crossplane-poc
    targetRevision: feature/ape-platform-alignment
    path: entities
    directory:
      recurse: true
      include: 'environments/**/*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 2m
        factor: 2
