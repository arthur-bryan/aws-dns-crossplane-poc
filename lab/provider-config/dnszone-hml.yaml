---
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: dnszone-hml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: credentials
  assumeRoleChain:
    - roleARN: arn:aws:iam::382598791794:role/OrganizationAccountAccessRole
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: hml-account
  labels:
    accountName: hml-account
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  aws:
    account: "382598791794"
    accountName: hml-account
    region: us-east-1
