# PoC Backstage config override — runs on top of ape-platform-backstage's app-config.yaml ONLY.
# Do NOT layer app-config.local.yaml — it has $include credential files that don't exist on Bryan's PC.
#
# Usage (from ape-platform-backstage/ directory):
#   GITHUB_TOKEN=<pat> \
#   AWS_ACCESS_KEY_ID=<dns-poc-key-id> \
#   AWS_SECRET_ACCESS_KEY=<dns-poc-secret> \
#   AWS_REGION=us-east-1 \
#   yarn start --config ./app-config.yaml --config ./app-config.poc.yaml
#
# The file lives in the PoC repo root so it stays out of the APE backstage repo.
# Symlink it before running:
#   ln -sf ~/github/aws-dns-crossplane-poc/app-config.poc.yaml ~/github/ape-platform-backstage/app-config.poc.yaml

app:
  title: DockStage (PoC)
  baseUrl: http://localhost:3000
  listen:
    host: 0.0.0.0

backend:
  baseUrl: http://localhost:7007
  cors:
    origin: http://localhost:3000
  database:
    client: better-sqlite3
    connection: ':memory:'

# Disable Okta — use guest auth in PoC
auth:
  environment: development
  session:
    secret: poc-local-secret
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
  signIn:
    providers: ['guest']

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  readonly: false
  processingInterval: { minutes: 1 }
  providers:
    # Disable dock-tech Okta/org providers — not available locally
    dock: null
  # Mirrors the real ape-platform-backstage app-config.local.yaml pattern:
  # direct recursive globs at the source repos, no intermediate Location
  # wrapper file. (That file uses github.com/dock-tech/ape-platform-backstage-templates
  # blob/develop/templates/**/*.yaml -- same shape, different repo/branch/allow-list.)
  locations:
    # DNS System entity (System/Domain/Group) -- just the one file, no crawl needed
    - type: url
      target: https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/ape-platform-alignment/ape-platform-entities/catalog-info.yaml
      rules:
        - allow: [System, Domain, Group, Resource]
    # DNS scaffolder templates -- recursive glob, same pattern as production
    - type: url
      target: https://github.com/arthur-bryan/aws-dns-crossplane-poc/blob/ape-platform-alignment/ape-platform-backstage-templates/templates/**/*.yaml
      rules:
        - allow: [Location, Template]

# DNS account IDs — all pointing to arthur-bryan personal AWS account (dns-poc IAM user)
dns:
  accounts:
    dev:
      accountId: '597230762851'
    hml:
      accountId: '597230762851'
    poc:
      accountId: '597230762851'
    prd:
      accountId: '597230762851'

# Scaffolder: point to PoC repo for entity commits/PRs
scaffolder:
  defaultEnvironment:
    parameters:
      entitiesRepository: https://github.com/arthur-bryan/aws-dns-crossplane-poc.git
      entitiesBranch: ape-platform-alignment
      githubTeamSuffix: ''

# Disable features that need dock-tech infra
aws:
  useMock: true

# Suppress okta/dora/jira — no credentials on Bryan's PC
okta: null
doraMetrics: null

# Open permissions for PoC — guest user gets full access
permission:
  enabled: true
  dock:
    - name: poc-admin
      description: Full access for PoC guest user
      members:
        - 'user:default/guest'
      permissions:
        - match:
            type: full
          decision: allow
