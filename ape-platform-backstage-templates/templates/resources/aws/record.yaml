apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record
  title: DNS Record Template
  description: A template for creating a DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - system
        - environment
        - zone
        - name
        - type
      properties:
        system:
          title: System
          type: string
          description: System of Resource
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the DNS record will be created
          ui:field: EnvironmentPicker

        zone:
          title: Parent Zone
          type: object
          description: Select the DNS zone where this record will be created
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        kind:
          title: Kind
          type: string
          default: Record
          ui:widget: hidden

        name:
          title: Record Name
          type: string
          description: Record name relative to the zone (e.g., 'www', 'api', 'cdn')
          ui:autofocus: true
          ui:field: EntityNameComposerPicker
          ui:options:
            rows: 5

        fqdnPreview:
          title: FQDN Preview
          type: string
          ui:field: RecordFqdnPreview

        type:
          title: Record Type
          type: string
          description: DNS record type
          default: A
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS
            - MX
            - SRV
            - NS
            - CAA
            - PTR

      dependencies:
        type:
          oneOf:
            - properties:
                type:
                  const: A
                values:
                  title: IPv4 Addresses
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
                  ui:help: "Example: 10.0.1.100"
              required:
                - values

            - properties:
                type:
                  const: AAAA
                values:
                  title: IPv6 Addresses
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: 2001:0db8:85a3::8a2e:0370:7334"
              required:
                - values

            - properties:
                type:
                  const: CNAME
                values:
                  title: Target Hostname
                  type: array
                  description: Target canonical name (only one value allowed for CNAME)
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
                  ui:help: "Example: api.example.com"
              required:
                - values

            - properties:
                type:
                  const: TXT
                values:
                  title: Text Values
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: v=spf1 include:_spf.google.com ~all"
              required:
                - values

            - properties:
                type:
                  const: MX
                values:
                  title: MX Records
                  type: array
                  description: 'Mail exchange records (format: "priority hostname")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 mail.example.com" (lower priority wins)'
              required:
                - values

            - properties:
                type:
                  const: SRV
                values:
                  title: SRV Records
                  type: array
                  description: 'Service records (format: "priority weight port target")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 60 5060 sipserver.example.com"'
              required:
                - values

            - properties:
                type:
                  const: NS
                values:
                  title: Nameservers
                  type: array
                  description: Nameserver hostnames for subdomain delegation
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: ns1.example.com (for delegating subdomains)"
              required:
                - values

            - properties:
                type:
                  const: CAA
                values:
                  title: CAA Records
                  type: array
                  description: 'Certificate authority authorization (format: "flags tag value")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                  minItems: 1
                  ui:help: 'Example: 0 issue "letsencrypt.org" (restricts which CAs can issue certs)'
              required:
                - values

            - properties:
                type:
                  const: PTR
                values:
                  title: Target Hostname
                  type: array
                  description: Hostname for reverse DNS lookup
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1
                  ui:help: "Example: server.example.com (for reverse DNS)"
              required:
                - values

            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: AWS Service Type
                  type: string
                  description: Type of AWS service being aliased
                  default: CloudFront
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - Custom
                  enumNames:
                    - "CloudFront Distribution"
                    - "Application Load Balancer (ALB)"
                    - "Network Load Balancer (NLB)"
                    - "S3 Website Endpoint"
                    - "API Gateway"
                    - "Global Accelerator"
                    - "Custom (provide zone ID manually)"
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the AWS resource
                  ui:help: "Example: d111111abcdef8.cloudfront.net"
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
              required:
                - serviceType
                - dnsName
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum:
                            - CloudFront
                            - GlobalAccelerator
                            - S3Website
                            - APIGateway
                    - properties:
                        serviceType:
                          const: Custom
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          description: Hosted zone ID for custom alias target
                          pattern: "^Z[A-Z0-9]+$"
                          ui:help: "Example: Z2FDTNDATAQYW2"
                      required:
                        - customZoneId
                    - properties:
                        serviceType:
                          enum:
                            - ALB
                            - NLB

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                  ui:help: "Example: primary-us-east-2"
                weight:
                  title: Weight
                  type: integer
                  description: Traffic weight (0-255) for weighted routing
                  minimum: 0
                  maximum: 255
                  default: 100
                  ui:help: "Higher weight = more traffic (relative to other records with same name)"
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - $yaml: ../../../shared/entities/fetch-dns-system.yaml

    - id: deriveAccount
      name: Derive DNS account from environment
      # Account always comes from the dns system's spec.environments,
      # NOT from the user's selected system. A record owned by team-X
      # in env=dev lives in DNS's dev account, not team-X's dev account.
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
        expression: >-
          (
            $envName := env;
            $envCfg := environments[name = $envName];
            {
              "accountId": $envCfg.aws.account,
              "accountName": $envCfg.aws.accountName
            }
          )

    - id: extractRecordName
      name: Extract record name from composed entity name
      action: roadiehq:utils:jsonata
      input:
        data:
          composedName: ${{ parameters.name }}
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $prefix := systemName & "-";
            $suffix := "-" & environment;
            $s := $substringAfter(composedName, $prefix);
            $substringBefore($s, $suffix)
          )

    - id: deriveTtl
      name: Derive TTL from environment and record type
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
          recordType: ${{ parameters.type }}
          weighted: ${{ parameters.enableWeightedRouting }}
        expression: >-
          (
            $isWeighted := weighted = true;
            $isPrd := environment = "prd";
            $isNs := recordType = "NS";
            $isWeighted and ($isPrd = false) ? 600 :
            $isNs ? 172800 :
            3600
          )

    - id: buildEditParams
      name: Build edit-template formData snapshot
      action: roadiehq:utils:jsonata
      input:
        data:
          name: ${{ parameters.name }}
          system: ${{ parameters.system }}
          environment: ${{ parameters.environment }}
          zone: ${{ parameters.zone.name }}
          zoneId: ${{ parameters.zone.id }}
          recordName: ${{ steps.extractRecordName.output.result }}
          recordType: ${{ parameters.type }}
          ttl: ${{ steps.deriveTtl.output.result }}
          values: ${{ parameters.values }}
          serviceType: ${{ parameters.serviceType }}
          dnsName: ${{ parameters.dnsName }}
          customZoneId: ${{ parameters.customZoneId }}
          evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
          enableWeightedRouting: ${{ parameters.enableWeightedRouting }}
          setIdentifier: ${{ parameters.setIdentifier }}
          weight: ${{ parameters.weight }}
        expression: >-
          (
            $base := {
              "name": name,
              "system": system,
              "environment": environment,
              "zone": zone,
              "zoneId": zoneId,
              "recordName": recordName,
              "type": recordType,
              "originalType": recordType
            };
            $typed := recordType = "ALIAS" ?
              {
                "serviceType": serviceType,
                "dnsName": dnsName,
                "customZoneId": customZoneId,
                "evaluateTargetHealth": evaluateTargetHealth
              } :
              {
                "ttl": ttl,
                "values": values
              };
            $weighted := enableWeightedRouting = true ?
              {
                "enableWeightedRouting": true,
                "setIdentifier": setIdentifier,
                "weight": weight
              } :
              { "enableWeightedRouting": false };
            $merge([$base, $typed, $weighted])
          )

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS record already exists. Please choose a different name.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record created by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: '${{ steps.buildEditParams.output.result | dump }}'
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            recordName: ${{ steps.extractRecordName.output.result }}
            recordType: ${{ parameters.type }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ steps.deriveTtl.output.result }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
