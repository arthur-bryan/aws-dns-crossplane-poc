apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record
  title: DNS Record
  description: A template for creating one or more AWS Route53 DNS records
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Zone
      required:
        - system
        - environment
        - zone
      properties:
        system:
          title: System
          type: string
          description: System of Resource
          ui:field: OwnedEntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the DNS records will be created
          ui:field: EnvironmentPicker
          ui:options:
            systemFieldName: system

        zone:
          title: Parent Zone
          type: object
          description: Select the DNS zone where these records will be created
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        kind:
          title: Kind
          type: string
          default: Record
          ui:widget: hidden

    - title: DNS Records
      required:
        - records
      properties:
        records:
          title: DNS Records
          type: array
          minItems: 1
          default:
            - {}
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                title: Record Name
                type: string
                description: Context to compose the record name (e.g., 'www', 'api', 'cdn')
                maxLength: 30
                ui:autofocus: true
                ui:field: EntityNameComposerPicker
                ui:options:
                  systemFieldName: system
                  environmentFieldName: environment

              fqdnPreview:
                title: FQDN Preview
                type: string
                ui:field: RecordFqdnPreview

              type:
                title: Record Type
                type: string
                description: DNS record type
                default: A
                enum:
                  - A
                  - AAAA
                  - CNAME
                  - TXT
                  - ALIAS
                  # MX, SRV, NS, CAA, PTR temporarily disabled -- only A, AAAA, CNAME, TXT,
                  # ALIAS are supported for now. Commented out (not deleted) so the record-type
                  # oneOf branches below and this enum can be restored together later.
                  # - MX
                  # - SRV
                  # - NS
                  # - CAA
                  # - PTR

              enableWeightedRouting:
                title: Enable Weighted Routing
                type: boolean
                description: Enable traffic distribution across multiple records with the same name
                default: false

            dependencies:
              type:
                oneOf:
                  - properties:
                      type:
                        const: A
                      values:
                        title: Record Value
                        type: array
                        description: "List of IPv4 addresses. Example: 10.0.1.100"
                        items:
                          type: string
                          pattern: '^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$'
                          errorMessage: "Enter a valid IPv4 address. Example: 10.0.1.100. CIDR notation (e.g. /24) is not allowed."
                        minItems: 1
                    required:
                      - values

                  - properties:
                      type:
                        const: AAAA
                      values:
                        title: Record Value
                        type: array
                        description: "List of IPv6 addresses. Example: 2001:0db8:85a3::8a2e:0370:7334"
                        items:
                          type: string
                          pattern: '^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]+|::(ffff(:0{1,4})?:)?((25[0-5]|(2[0-4]|1?[0-9])?[0-9])\.){3}(25[0-5]|(2[0-4]|1?[0-9])?[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1?[0-9])?[0-9])\.){3}(25[0-5]|(2[0-4]|1?[0-9])?[0-9]))$'
                          errorMessage: "Enter a valid IPv6 address. Example: 2001:db8::1. Plain IPv4 addresses are not valid here."
                        minItems: 1
                    required:
                      - values

                  - properties:
                      type:
                        const: CNAME
                      values:
                        title: Record Value
                        type: array
                        description: "Target canonical name (only one value allowed for CNAME). Example: api.example.com"
                        items:
                          type: string
                          pattern: '^(?!.*\d+\.\d+\.\d+\.\d+)(?:[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}\.?$'
                          errorMessage: "Enter a valid hostname (e.g. api.example.com). IP addresses and single-label names are not allowed."
                        maxItems: 1
                        minItems: 1
                        ui:help: "Example: api.example.com"
                    required:
                      - values

                  - properties:
                      type:
                        const: TXT
                      values:
                        title: Record Value
                        type: array
                        description: "Text values for the record. Example: v=spf1 include:_spf.google.com ~all"
                        items:
                          type: string
                          maxLength: 255
                          errorMessage: "Each TXT string must be 255 characters or fewer. Split longer content into multiple values."
                        minItems: 1
                    required:
                      - values

                  # - properties:
                      # type:
                        # const: MX
                      # values:
                        # title: Record Value
                        # type: array
                        # description: 'Mail exchange records (format: "priority hostname")'
                        # items:
                          # type: string
                          # pattern: '^\s*[0-9]+\s+\S+\s*$'
                        # minItems: 1
                        # ui:help: 'Example: "10 mail.example.com" (lower priority wins)'
                    # required:
                      # - values

                  # - properties:
                      # type:
                        # const: SRV
                      # values:
                        # title: Record Value
                        # type: array
                        # description: 'Service records (format: "priority weight port target")'
                        # items:
                          # type: string
                          # pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                        # minItems: 1
                        # ui:help: 'Example: "10 60 5060 sipserver.example.com"'
                    # required:
                      # - values

                  # - properties:
                      # type:
                        # const: NS
                      # values:
                        # title: Record Value
                        # type: array
                        # description: Nameserver hostnames for subdomain delegation
                        # items:
                          # type: string
                        # minItems: 1
                        # ui:help: "Example: ns1.example.com (for delegating subdomains)"
                    # required:
                      # - values

                  # - properties:
                      # type:
                        # const: CAA
                      # values:
                        # title: Record Value
                        # type: array
                        # description: 'Certificate authority authorization (format: "flags tag value")'
                        # items:
                          # type: string
                          # pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                        # minItems: 1
                        # ui:help: 'Example: 0 issue "letsencrypt.org" (restricts which CAs can issue certs)'
                    # required:
                      # - values

                  # - properties:
                      # type:
                        # const: PTR
                      # values:
                        # title: Record Value
                        # type: array
                        # description: Hostname for reverse DNS lookup
                        # items:
                          # type: string
                        # minItems: 1
                        # maxItems: 1
                    # required:
                      # - values

                  - properties:
                      type:
                        const: ALIAS
                      serviceType:
                        title: AWS Service Type
                        type: string
                        description: >-
                          Type of AWS service being aliased. The hosted zone
                          ID is always resolved automatically from this and
                          the region below -- there is no manual zone ID
                          entry.
                        default: CloudFront
                        enum:
                          - CloudFront
                          - ALB
                          - NLB
                          - S3Website
                          - APIGateway
                          - GlobalAccelerator
                          - ElasticBeanstalk
                          - AppRunner
                          - SameZoneRecord
                        enumNames:
                          - "CloudFront Distribution"
                          - "Application Load Balancer (ALB)"
                          - "Network Load Balancer (NLB)"
                          - "S3 Website Endpoint"
                          - "API Gateway"
                          - "Global Accelerator"
                          - "Elastic Beanstalk"
                          - "App Runner"
                          - "Another Record in This Zone"
                      region:
                        title: Region
                        type: string
                        ui:field: AliasRegionField
                      dnsName:
                        title: Record Value
                        type: string
                        description: >-
                          DNS name of the AWS resource, or -- when aliasing to
                          another record in this zone -- that record's full
                          DNS name.
                        pattern: '^(?:[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}\.?$'
                        errorMessage: "Enter a valid DNS hostname. Example: d111111abcdef8.cloudfront.net"
                        ui:help: "Example: d111111abcdef8.cloudfront.net"
                      zoneIdPreview:
                        title: ' '
                        type: string
                        ui:field: AliasZoneIdPreview
                    required:
                      - serviceType
                      - dnsName

              enableWeightedRouting:
                oneOf:
                  - properties:
                      enableWeightedRouting:
                        const: false
                      # Declared here too (unrequired) so WeightedSetIdentifierField /
                      # WeightedWeightField stay mounted across the toggle instead of
                      # unmounting -- see those components for why that matters: a field
                      # that only exists in the "true" branch never gets a render with the
                      # post-toggle value before React unmounts it.
                      setIdentifier:
                        type: string
                        ui:field: WeightedSetIdentifierField
                      weight:
                        type: integer
                        ui:field: WeightedWeightField
                  - properties:
                      enableWeightedRouting:
                        const: true
                      setIdentifier:
                        title: Set Identifier
                        type: string
                        description: Unique identifier for this weighted record
                        minLength: 1
                        maxLength: 128
                        pattern: '^\S+$'
                        errorMessage: "Set identifier cannot contain spaces. Example: primary-us-east-2"
                        ui:help: "Example: primary-us-east-2 (no spaces allowed)"
                        ui:field: WeightedSetIdentifierField
                      weight:
                        title: Weight
                        type: integer
                        description: >-
                          Relative traffic share, as a percentage (0-100) of this
                          record's set-identifier group. Converted automatically to
                          Route53's native 0-255 weight range behind the scenes.
                        minimum: 0
                        maximum: 100
                        default: 100
                        ui:field: WeightedWeightField
                    required:
                      - setIdentifier
                      - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - id: verifySystemOwnership
      name: Verify System Ownership
      action: catalog:system:ownership:verify
      input:
        systemRef: ${{ parameters.system }}

    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: computeRecordNames
      name: Compute per-record names, TTLs and edit-template parameters
      action: roadiehq:utils:jsonata
      input:
        data:
          records: ${{ parameters.records }}
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
          namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
          system: ${{ parameters.system }}
          environment: ${{ parameters.environment }}
          zone: ${{ parameters.zone }}
          kind: ${{ parameters.kind }}
          environments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $prefix := systemName & "-";
            $suffix := "-" & environment;
            $env := environment;
            $envCfg := environments[name = $env];
            $aws := { "account": $envCfg.aws.account, "accountName": $envCfg.aws.accountName };
            $sys := system;
            $zn := zone;
            $kd := kind;
            $ns := namespace;
            [ records.(
              $weighted := enableWeightedRouting = true and $string(setIdentifier) != "";
              $s := $substringAfter(name, $prefix);
              $recordName := $substringBefore($s, $suffix);
              $entityName := $weighted ? name & "-" & setIdentifier : name;
              $isNs := type = "NS";
              $isPrd := $env = "prd";
              $ttl := $weighted and ($isPrd = false) ? 600 : $isNs ? 172800 : 3600;
              {
                "recordName": $recordName,
                "entityName": $entityName,
                "ttl": $ttl,
                "aws": $aws,
                "params": $merge([
                  { "system": $sys, "environment": $env, "zone": $zn, "kind": $kd },
                  $,
                  { "name": $entityName, "recordName": $recordName, "entityRef": "resource:" & $ns & "/" & $entityName }
                ])
              }
            ) ]
          )

    - id: checkDuplicateRecordNames
      name: Check for duplicate record names in this request
      action: roadiehq:utils:jsonata
      input:
        data:
          computed: ${{ steps.computeRecordNames.output.result }}
        expression: >-
          (
            $names := computed.entityName;
            $count($distinct($names)) != $count($names)
          )

    - id: launchErrorIfDuplicates
      name: Abort if this request has duplicate record names
      if: ${{ steps.checkDuplicateRecordNames.output.result }}
      action: error:launch
      input:
        message: >-
          Two or more records in this request would produce the same entity name
          (same name + environment + weighted set-identifier combination). Give
          each record a unique name, or a unique Set Identifier if using weighted
          routing, and try again.

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      each: ${{ parameters.records }}
      action: fs:file:exists
      input:
        filepath: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeRecordNames.output.result[each.key].entityName }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      each: ${{ parameters.records }}
      if: ${{ steps.checkIfFileAlreadyExists.output.exists[each.key] }}
      action: error:launch
      input:
        message: "A resource file for record '${{ steps.computeRecordNames.output.result[each.key].entityName }}' already exists. Please choose a different name."

    - id: writeFile
      name: Create Resource File
      each: ${{ parameters.records }}
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeRecordNames.output.result[each.key].entityName }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ steps.computeRecordNames.output.result[each.key].entityName }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record created by template
            annotations:
              dock.tech/created-at: ${{ "'" + now() + "'" }}
              dock.tech/created-by: ${{ user.ref }}
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + steps.computeRecordNames.output.result[each.key].params | dump + "'" }}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: DNSRecord
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            tribe: ${{ steps.fetchSystem.output.entity.spec.tribe }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            name: ${{ steps.computeRecordNames.output.result[each.key].entityName }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            aws:
              account: "${{ steps.computeRecordNames.output.result[each.key].aws.account }}"
              accountName: ${{ steps.computeRecordNames.output.result[each.key].aws.accountName }}
            recordName: ${{ steps.computeRecordNames.output.result[each.key].recordName }}
            recordType: ${{ each.value.type }}
            {%- if each.value.type != 'ALIAS' %}
            ttl: ${{ steps.computeRecordNames.output.result[each.key].ttl }}
            values:
            {%- for value in each.value.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ each.value.serviceType }}
              dnsName: ${{ each.value.dnsName }}
              {%- if each.value.region and each.value.region != 'global' %}
              region: ${{ each.value.region }}
              {%- endif %}
            {%- endif %}
            {%- if each.value.enableWeightedRouting %}
            setIdentifier: ${{ each.value.setIdentifier }}
            weight: ${{ each.value.weight }}
            {%- endif %}

    - id: buildRequestSummary
      name: Build request summary for commit/notify messages
      action: roadiehq:utils:jsonata
      input:
        data:
          computed: ${{ steps.computeRecordNames.output.result }}
        expression: >-
          (
            $names := computed.entityName;
            { "count": $count($names), "summary": $join($names, ", ") }
          )

    - id: commit
      name: Commit changes
      action: github:extras:commit
      input:
        folder: entities
        message: "add or edit ${{ steps.buildRequestSummary.output.result.count }} DNS record(s): ${{ steps.buildRequestSummary.output.result.summary }}"
        gitAuthorName: ${{ user.entity.spec.profile.displayName | default(user.entity.metadata.name) }}
        gitAuthorEmail: ${{ user.entity.spec.profile.email }}

    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      each: ${{ parameters.records }}
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ steps.computeRecordNames.output.result[each.key].entityName }}
        payload: ${{ steps.computeRecordNames.output.result[each.key].params }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml

    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ user.ref }}
        title: "Template of ${{ parameters.kind }} executed"
        info: "Created ${{ steps.buildRequestSummary.output.result.count }} DNS record(s) in zone ${{ parameters.zone.name }}: ${{ steps.buildRequestSummary.output.result.summary }}"
        severity: "normal"

  output: {}
