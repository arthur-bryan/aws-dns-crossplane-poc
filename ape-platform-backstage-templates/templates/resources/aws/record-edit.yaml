apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dns-record-edit
  title: DNS Record Edit
  description: Edit an existing AWS Route53 DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - hidden
spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        entityRef:
          title: Entity Reference
          type: string
          ui:disabled: true

        name:
          title: Name
          type: string
          ui:disabled: true

        system:
          title: System
          type: string
          ui:disabled: true

        environment:
          title: Environment
          type: string
          ui:disabled: true

        zone:
          title: DNS Zone
          type: object
          ui:disabled: true

        recordName:
          title: Record Name
          type: string
          ui:disabled: true

        fqdnPreview:
          title: FQDN Preview
          type: string
          ui:field: RecordFqdnPreview

        type:
          title: Record Type
          type: string
          description: >-
            Record types that would require Route53 to destroy and recreate
            this record can't be selected here. A and ALIAS both map to
            Route53 record type A, so switching between them is the only
            cross-type change allowed; every other type is locked to itself.
          ui:field: RecordTypeField
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS
            - MX
            - SRV
            - NS
            - CAA
            - PTR

        ttlPreview:
          title: TTL (seconds)
          type: number
          description: >-
            TTL is derived automatically from environment, record type, and
            weighted-routing status -- it can't be set directly.
          ui:field: RecordTtlPreview

      dependencies:
        type:
          oneOf:
            - properties:
                type:
                  const: A
                values:
                  title: Record Value
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: AAAA
                values:
                  title: Record Value
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: CNAME
                values:
                  title: Record Value
                  type: array
                  description: Target canonical name
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: TXT
                values:
                  title: Record Value
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: MX
                values:
                  title: Record Value
                  type: array
                  description: 'Mail exchange records (format: "priority hostname")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+\S+\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: SRV
                values:
                  title: Record Value
                  type: array
                  description: 'Service records (format: "priority weight port target")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: NS
                values:
                  title: Record Value
                  type: array
                  description: Nameserver hostnames for subdomain delegation
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: CAA
                values:
                  title: Record Value
                  type: array
                  description: 'Certificate authority authorization (format: "flags tag value")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: PTR
                values:
                  title: Record Value
                  type: array
                  description: Hostname for reverse DNS lookup
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1
              required:
                - values

            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: AWS Service Type
                  type: string
                  description: >-
                    Switching service type is safe -- Route53 has no concept
                    of "service type" on an alias target, only a hosted zone
                    ID, so this is an ordinary field update, never a
                    recreation. Update region and target DNS name to match
                    the new target, and use the zone ID preview below to
                    confirm the platform resolves the correct alias before
                    submitting.
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - ElasticBeanstalk
                  enumNames:
                    - "CloudFront Distribution"
                    - "Application Load Balancer (ALB)"
                    - "Network Load Balancer (NLB)"
                    - "S3 Website Endpoint"
                    - "API Gateway"
                    - "Global Accelerator"
                    - "Elastic Beanstalk"
                region:
                  title: Region
                  type: string
                  ui:field: AliasRegionField
                dnsName:
                  title: Record Value
                  type: string
                  description: DNS name of the AWS resource
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
                zoneIdPreview:
                  title: ' '
                  type: string
                  ui:field: AliasZoneIdPreview
              required:
                - serviceType
                - dnsName

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight
                  type: integer
                  description: >-
                    Relative traffic share, as a percentage (0-100) of this
                    record's set-identifier group. Converted automatically to
                    Route53's native 0-255 weight range behind the scenes.
                  minimum: 0
                  maximum: 100
                  default: 100
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - id: verifySystemOwnership
      name: Verify System Ownership
      action: catalog:system:ownership:verify
      input:
        systemRef: ${{ parameters.system }}

    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: fetchExisting
      name: Fetch existing catalog entity
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.entityRef }}

    - id: checkImmutableTypeChange
      name: Check whether this edit changes the underlying Route53 record type
      action: roadiehq:utils:jsonata
      input:
        data:
          existingType: ${{ steps.fetchExisting.output.entity.spec.recordType }}
          newType: ${{ parameters.type }}
        expression: >-
          (
            $normalize := function($t) { $t = "ALIAS" ? "A" : $t };
            $normalize(existingType) != $normalize(newType)
          )

    - id: launchErrorIfImmutableTypeChange
      name: Abort if the edit would require Route53 to recreate the record
      if: ${{ steps.checkImmutableTypeChange.output.result }}
      action: error:launch
      input:
        message: >-
          Changing type from ${{ steps.fetchExisting.output.entity.spec.recordType }}
          to ${{ parameters.type }} is not allowed here -- Route53 would have to
          destroy and recreate the record, and the underlying provider refuses
          this kind of update outright. A and ALIAS are the only interchangeable
          pair (both map to Route53 type A); every other type is locked to itself.
          Delete this record and create a new one with the desired type instead.

    - id: deriveTtl
      name: Derive TTL from environment and record type
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
          recordType: ${{ parameters.type }}
          weighted: ${{ parameters.enableWeightedRouting }}
        expression: >-
          (
            $isWeighted := weighted = true;
            $isPrd := environment = "prd";
            $isNs := recordType = "NS";
            $isWeighted and ($isPrd = false) ? 600 :
            $isNs ? 172800 :
            3600
          )

    - id: deriveRoute53Weight
      name: Convert weight percentage to Route53 native 0-255 range
      action: roadiehq:utils:jsonata
      input:
        data:
          weighted: ${{ parameters.enableWeightedRouting }}
          weight: ${{ parameters.weight }}
        expression: >-
          weighted = true and $type(weight) = "number" ? $round(weight * 255 / 100) : undefined

    - id: deriveAccount
      name: Derive AWS account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
          environments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $env := environment;
            $envCfg := environments[name = $env];
            { "account": $envCfg.aws.account, "accountName": $envCfg.aws.accountName }
          )

    - id: nextParams
      name: Compute next-edit scaffolder-parameters snapshot
      action: roadiehq:utils:jsonata
      input:
        data:
          params: ${{ parameters }}
        expression: >-
          $merge([params, {"originalType": params.type}])

    - id: writeFile
      name: Update Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record managed by template
            annotations:
              {%- if steps.fetchExisting.output.entity.metadata.annotations['dock.tech/created-at'] %}
              dock.tech/created-at: '${{ steps.fetchExisting.output.entity.metadata.annotations['dock.tech/created-at'] }}'
              {%- endif %}
              {%- if steps.fetchExisting.output.entity.metadata.annotations['dock.tech/created-by'] %}
              dock.tech/created-by: ${{ steps.fetchExisting.output.entity.metadata.annotations['dock.tech/created-by'] }}
              {%- endif %}
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + steps.nextParams.output.result | dump + "'" }}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: DNSRecord
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            tribe: ${{ steps.fetchSystem.output.entity.spec.tribe }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            name: ${{ parameters.name }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            aws:
              account: "${{ steps.deriveAccount.output.result.account }}"
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            recordName: "${{ parameters.recordName }}"
            recordType: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ steps.deriveTtl.output.result }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.region and parameters.region != 'global' %}
              region: ${{ parameters.region }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ steps.deriveRoute53Weight.output.result }}
            {%- endif %}
            {%- if steps.fetchExisting.output.entity.spec.import %}
            import:
              existing: true
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: updated
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/notify.yaml

  output: {}
