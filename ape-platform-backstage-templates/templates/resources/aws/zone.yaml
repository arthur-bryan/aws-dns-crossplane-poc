apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: DNS Zone Template
  description: A template for creating a DNS hosted zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Zone Information
      required:
        - environment
        - name
        - parentZone
      properties:
        environment:
          title: Environment
          type: string
          description: Environment where the DNS zone will be created
          ui:field: EnvironmentPicker
          ui:options:
            systemRef: system:dns-eds437/dns

        kind:
          title: Kind
          type: string
          default: Zone
          ui:widget: hidden

        name:
          title: Subdomain
          type: string
          description: Subdomain label for the new zone (e.g., 'payments' to create payments.dev.dock.tech)
          ui:autofocus: true
          ui:field: EntityNameComposerPicker
          ui:options:
            systemRef: system:dns-eds437/dns
            suffix: zone

        parentZone:
          title: Parent Zone
          type: object
          description: Existing zone this subdomain will be delegated from
          ui:field: AwsDnsZonePicker

        fqdnPreview:
          title: Resulting Zone
          type: string
          ui:field: ZoneFqdnPreview

        comment:
          title: Comment
          type: string
          description: Optional comment for the zone (max 256 characters)
          maxLength: 256

    - title: Additional Tags (Optional)
      properties:
        tags:
          title: Tags
          type: object
          description: Additional AWS tags (hierarchy tags are added automatically)
          ui:field: KeyValuePairInput

  steps:
    - $yaml: ../../../shared/entities/clone.yaml

    - id: fetchDnsSystem
      name: Fetch DNS System Entity
      action: catalog:fetch
      input:
        entityRef: system:dns-eds437/dns
        defaultKind: System

    - id: deriveAccount
      name: Derive DNS account from environment
      # Source from the dns System entity's spec.environments[] (same pattern
      # as the record templates) so account numbers stay consistent with
      # catalog truth. The bare-word `env` inside the jsonata filter would
      # bind to each environment item's field rather than the top-level
      # variable, so alias it to $envName first.
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
        expression: >-
          (
            $envName := env;
            $envCfg := environments[name = $envName];
            {
              "accountId": $envCfg.aws.account,
              "accountName": $envCfg.aws.accountName
            }
          )

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS zone already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}
            description: DNS Zone created by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-zone-edit
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-zone
            cloud: aws
            owner: ${{ steps.fetchDnsSystem.output.entity.spec.owner }}
            system: system:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ steps.fetchDnsSystem.output.entity.metadata.name }}
            environment: ${{ parameters.environment }}
            zoneName: ${{ parameters.name }}.${{ parameters.parentZone.name }}
            delegatedFromZoneId: ${{ parameters.parentZone.id }}
            delegatedFromAccountName: ${{ parameters.parentZone.accountName }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.comment %}
            comment: ${{ parameters.comment }}
            {%- endif %}
            {%- if parameters.tags %}
            tags:
            {%- for key, value in parameters.tags %}
              {{ key }}: {{ value }}
            {%- endfor %}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
