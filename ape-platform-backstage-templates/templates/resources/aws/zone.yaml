apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: DNS Zone Template
  description: A template for creating a DNS hosted zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Zone Information
      required:
        - system
        - environment
      properties:
        system:
          title: System
          type: string
          description: System that will own this zone
          ui:field: OwnedEntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the DNS zone will be created
          ui:field: EnvironmentPicker
          ui:options:
            systemFieldName: system

        kind:
          title: Kind
          type: string
          default: Zone
          ui:widget: hidden

        private:
          title: Private Hosted Zone
          type: boolean
          default: false

        fqdnPreview:
          title: Resulting Zone
          type: string
          ui:field: ZoneFqdnPreview
          ui:options:
            rootDomain: arthurbryan.com

  steps:
    - $yaml: ../../../shared/entities/clone.yaml

    - id: verifySystemOwnership
      name: Verify System Ownership
      action: catalog:system:ownership:verify
      input:
        systemRef: ${{ parameters.system }}

    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: fetchDnsSystem
      name: Fetch DNS System Entity
      action: catalog:fetch
      input:
        entityRef: system:dns-eds437/dns
        defaultKind: System

    - id: deriveAccount
      name: Derive AWS account from DNS system entity
      action: roadiehq:utils:jsonata
      input:
        data:
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $env := environment;
            $envCfg := environments[name = $env];
            {"account": $envCfg.aws.account, "accountName": $envCfg.aws.accountName}
          )

    - id: computeZoneName
      name: Compute zone FQDN
      action: roadiehq:utils:jsonata
      input:
        data:
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
          environment: ${{ parameters.environment }}
          private: ${{ parameters.private }}
        expression: >-
          (
            $visPart := private = true ? ".internal" : "";
            $envSuffix := environment = "prd" ? "" : ("." & environment);
            systemName & $visPart & $envSuffix & ".arthurbryan.com"
          )

    - id: validateSystemLabel
      name: Validate system name is a valid DNS label
      action: roadiehq:utils:jsonata
      input:
        data:
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
        expression: >-
          $exists($match(systemName, /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/))

    - id: launchErrorIfInvalidLabel
      name: Abort if the system name cannot be used as a DNS label
      if: ${{ not steps.validateSystemLabel.output.result }}
      action: error:launch
      input:
        message: System name "${{ steps.fetchSystem.output.entity.metadata.name }}" is not a valid DNS label (lowercase letters, digits and hyphens, max 63 chars), so a zone cannot be created for it.

    - id: checkZoneExistsInAws
      name: Check whether the hosted zone already exists in Route53
      action: aws:route53:zone:exists
      input:
        environment: ${{ parameters.environment }}
        zoneName: ${{ steps.computeZoneName.output.result }}
        private: ${{ parameters.private }}

    - id: launchErrorIfZoneExistsInAws
      name: Abort if the hosted zone already exists in Route53
      if: ${{ steps.checkZoneExistsInAws.output.exists }}
      action: error:launch
      input:
        message: A ${{ "private" if parameters.private else "public" }} hosted zone named ${{ steps.computeZoneName.output.result }} already exists in ${{ parameters.environment }} (${{ steps.checkZoneExistsInAws.output.zoneId }}). Use Claim Existing DNS Zone to bring it under platform management instead of creating it again.

    - id: resolveParentZone
      name: Resolve immediate parent zone for NS delegation
      if: ${{ not parameters.private }}
      action: roadiehq:utils:jsonata
      input:
        data:
          zoneName: ${{ steps.computeZoneName.output.result }}
        expression: >-
          (
            $parentName := $substringAfter(zoneName, ".");
            $parents := {
              "dev.arthurbryan.com": {"id": "Z0945364EYNE5KZW0WIF", "accountName": "dnszone-dev"},
              "hml.arthurbryan.com": {"id": "Z091442636MPUK86SZJ1T", "accountName": "dnszone-hml"},
              "arthurbryan.com": {"id": "Z03010981ALJFZB4QLU8W", "accountName": "dnszone-prd"}
            };
            $p := $lookup($parents, $parentName);
            $p ? {"name": $parentName, "id": $p.id, "accountName": $p.accountName} : {}
          )

    - id: launchErrorIfParentUnknown
      name: Abort if no parent zone exists for delegation
      if: ${{ not parameters.private and not steps.resolveParentZone.output.result.id }}
      action: error:launch
      input:
        message: No parent zone found to delegate ${{ steps.computeZoneName.output.result }} from.

    - id: computeEntityName
      name: Compute entity name from zone name and environment
      action: roadiehq:utils:jsonata
      input:
        data:
          zoneName: ${{ steps.computeZoneName.output.result }}
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $sanitized := $replace(zoneName, ".", "-");
            $sanitized & "-" & environment & "-zone"
          )

    - id: validateNameLengths
      name: Validate generated names fit Kubernetes and Backstage limits
      action: roadiehq:utils:jsonata
      input:
        data:
          zoneName: ${{ steps.computeZoneName.output.result }}
          entityName: ${{ steps.computeEntityName.output.result }}
        expression: >-
          $length("zone-" & zoneName) <= 63 and $length(entityName) <= 63

    - id: launchErrorIfNameTooLong
      name: Abort if the generated names are too long
      if: ${{ not steps.validateNameLengths.output.result }}
      action: error:launch
      input:
        message: The system name is too long for this zone. The generated names ${{ steps.computeZoneName.output.result }} would exceed the 63 character limit for the platform object names.

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeEntityName.output.result }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS zone already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeEntityName.output.result }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ steps.computeEntityName.output.result }}
            namespace: ${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}
            description: DNS Zone created by template
            annotations:
              dock.tech/created-at: ${{ "'" + now() + "'" }}
              dock.tech/created-by: ${{ user.ref }}
              dock.tech/scaffolder-editable-template: dns-zone-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: DNSZone
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            tribe: ${{ steps.fetchSystem.output.entity.spec.tribe }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            name: ${{ steps.computeEntityName.output.result }}
            zoneName: ${{ steps.computeZoneName.output.result }}
            visibility: ${{ "private" if parameters.private else "public" }}
            aws:
              account: "${{ steps.deriveAccount.output.result.account }}"
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if not parameters.private %}
            delegatedFromZoneId: ${{ steps.resolveParentZone.output.result.id }}
            delegatedFromAccountName: ${{ steps.resolveParentZone.output.result.accountName }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ steps.computeEntityName.output.result }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
