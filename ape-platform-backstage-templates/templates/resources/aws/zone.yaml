apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-zone
  title: DNS Zone Template
  description: A template for creating a DNS hosted zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Zone Information
      required:
        - environment
        - name
        - parentZone
      properties:
        environment:
          title: Environment
          type: string
          description: Environment where the DNS zone will be created
          ui:field: EnvironmentPicker
          ui:options:
            systemRef: system:dns-eds437/dns

        kind:
          title: Kind
          type: string
          default: Zone
          ui:widget: hidden

        name:
          title: Subdomain
          type: string
          description: Subdomain label for the new zone (e.g., 'payments' to create payments.dev.dock.tech)
          ui:autofocus: true
          ui:field: EntityNameComposerPicker
          ui:options:
            systemRef: system:dns-eds437/dns
            suffix: zone

        parentZone:
          title: Parent Zone
          type: object
          description: Existing zone this subdomain will be delegated from
          ui:field: AwsDnsZonePicker

        fqdnPreview:
          title: Resulting Zone
          type: string
          ui:field: ZoneFqdnPreview

  steps:
    - $yaml: ../../../shared/entities/clone.yaml

    - id: fetchDnsSystem
      name: Fetch DNS System Entity
      action: catalog:fetch
      input:
        entityRef: system:dns-eds437/dns
        defaultKind: System

    - id: deriveAccount
      name: Derive AWS account from environment
      action: roadiehq:utils:jsonata
      input:
        data:
          environment: ${{ parameters.environment }}
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
        expression: >-
          (
            $env := environment;
            $envCfg := environments[name = $env];
            { "account": $envCfg.aws.account, "accountName": $envCfg.aws.accountName }
          )

    - id: computeZoneName
      name: Compute child zone FQDN
      action: roadiehq:utils:jsonata
      input:
        data:
          composedName: ${{ parameters.name }}
          systemName: ${{ steps.fetchDnsSystem.output.entity.metadata.name }}
          environment: ${{ parameters.environment }}
          parentZoneName: ${{ parameters.parentZone.name }}
        expression: >-
          (
            $suffix := "-" & environment & "-zone";
            $withoutSuffix := $substringBefore(composedName, $suffix);
            $prefix := systemName & "-";
            $context := $substringAfter($withoutSuffix, $prefix);
            $context & "." & parentZoneName
          )

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS zone already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/ape-platform-entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}
            description: DNS Zone created by template
            annotations:
              dock.tech/created-at: ${{ "'" + now() + "'" }}
              dock.tech/created-by: ${{ user.ref }}
              dock.tech/scaffolder-editable-template: dns-zone-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: DNSZone
            cloud: aws
            owner: ${{ steps.fetchDnsSystem.output.entity.spec.owner }}
            tribe: ${{ steps.fetchDnsSystem.output.entity.spec.tribe }}
            system: system:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ steps.fetchDnsSystem.output.entity.metadata.name }}
            environment: ${{ parameters.environment }}
            name: ${{ parameters.name }}
            aws:
              account: "${{ steps.deriveAccount.output.result.account }}"
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            zoneName: ${{ steps.computeZoneName.output.result }}
            delegatedFromZoneId: ${{ parameters.parentZone.id }}
            delegatedFromAccountName: dnszone-${{ parameters.parentZone.environment }}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
