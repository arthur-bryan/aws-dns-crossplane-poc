apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing DNS Record
  description: Bring an existing DNS record under platform management
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Record to Claim
      required:
        - system
        - environment
        - zone
        - existingRecord
      properties:
        system:
          title: System
          type: string
          description: System that will own this record
          ui:field: OwnedEntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the record exists
          ui:field: EnvironmentPicker
          ui:options:
            systemFieldName: system

        zone:
          title: DNS Zone
          type: object
          description: The hosted zone containing this record
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        existingRecord:
          title: Existing Record
          type: object
          description: Select the existing DNS record to bring under management
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zone
            excludeTypes:
              - SOA
              - NS
            excludeClaimed: true

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - id: verifySystemOwnership
      name: Verify System Ownership
      action: catalog:system:ownership:verify
      input:
        systemRef: ${{ parameters.system }}

    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: computeRecordName
      name: Compute zone-relative record name and entity name
      action: roadiehq:utils:jsonata
      input:
        data:
          fqdn: ${{ parameters.existingRecord.name }}
          zoneName: ${{ parameters.zone.name }}
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $f := $replace(fqdn, /\.$/, "");
            $z := $replace(zoneName, /\.$/, "");
            $recordName := $f = $z ? "" : $replace($f, "." & $z, "");
            $context := $recordName != "" ? $recordName : $z;
            $entityName := systemName & "-" & $context & "-" & environment;
            { "recordName": $recordName, "entityName": $entityName }
          )

    - id: buildEditParams
      name: Build edit-template formData snapshot
      action: roadiehq:utils:jsonata
      input:
        data:
          name: ${{ steps.computeRecordName.output.result.entityName }}
          system: ${{ parameters.system }}
          environment: ${{ parameters.environment }}
          zone: ${{ parameters.zone }}
          recordName: ${{ steps.computeRecordName.output.result.recordName }}
          existingRecord: ${{ parameters.existingRecord }}
          namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
        expression: >-
          (
            $alias := existingRecord.aliasTarget;
            $resolvedType := $alias ? "ALIAS" : existingRecord.type;
            $isWeighted := $exists(existingRecord.setIdentifier);
            $base := {
              "name": name,
              "system": system,
              "environment": environment,
              "zone": zone,
              "recordName": recordName,
              "type": $resolvedType,
              "originalType": $resolvedType,
              "entityRef": "resource:" & namespace & "/" & name
            };
            $withRouting := $isWeighted ?
              $merge([$base, {
                "enableWeightedRouting": true,
                "setIdentifier": existingRecord.setIdentifier,
                "weight": existingRecord.weight
              }]) : $base;
            $zoneMap := {
