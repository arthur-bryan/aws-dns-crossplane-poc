apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing DNS Record
  description: Bring an existing DNS record under platform management
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
spec:
  type: resource

  parameters:
    - title: DNS Record to Claim
      required:
        - system
        - environment
        - zone
        - existingRecord
      properties:
        system:
          title: System
          type: string
          description: System that will own this record
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System
                metadata.labels.aws: "true"

        environment:
          title: Environment
          type: string
          description: Environment where the record exists
          ui:field: EnvironmentPicker

        zone:
          title: DNS Zone
          type: object
          description: The hosted zone containing this record
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        existingRecord:
          title: Existing Record
          type: object
          description: Select the existing DNS record to bring under management
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zone
            excludeTypes:
              - SOA
              - NS
            excludeClaimed: true

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - $yaml: ../../../shared/entities/fetch-dns-system.yaml

    - id: deriveAccount
      name: Derive DNS account from environment
      # See record.yaml -- account always sourced from dns system, never
      # from the user's selected (owning) system.
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
        expression: >-
          (
            $envName := env;
            $envCfg := environments[name = $envName];
            {
              "accountId": $envCfg.aws.account,
              "accountName": $envCfg.aws.accountName
            }
          )

    - id: computeRecordName
      name: Compute zone-relative record name and entity name
      action: roadiehq:utils:jsonata
      input:
        data:
          fqdn: ${{ parameters.existingRecord.name }}
          zoneName: ${{ parameters.zone.name }}
          systemName: ${{ steps.fetchSystem.output.entity.metadata.name }}
          environment: ${{ parameters.environment }}
        expression: >-
          (
            $f := $replace(fqdn, /\.$/, "");
            $z := $replace(zoneName, /\.$/, "");
            $recordName := $f = $z ? "" : $replace($f, "." & $z, "");
            $context := $recordName != "" ? $recordName : $z;
            $entityName := systemName & "-" & $context & "-" & environment;
            { "recordName": $recordName, "entityName": $entityName }
          )

    - id: buildEditParams
      name: Build edit-template formData snapshot
      action: roadiehq:utils:jsonata
      input:
        data:
          entityName: ${{ steps.computeRecordName.output.result.entityName }}
          namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
          system: ${{ parameters.system }}
          environment: ${{ parameters.environment }}
          zone: ${{ parameters.zone.name }}
          zoneId: ${{ parameters.zone.id }}
          recordName: ${{ steps.computeRecordName.output.result.recordName }}
          existingRecord: ${{ parameters.existingRecord }}
        expression: >-
          (
            $alias := existingRecord.aliasTarget;
            $recordType := $alias ? "ALIAS" : existingRecord.type;
            $base := {
              "entityRef": "resource:" & namespace & "/" & entityName,
              "name": entityName,
              "system": system,
              "environment": environment,
              "zone": zone,
              "zoneId": zoneId,
              "recordName": recordName,
              "type": $recordType,
              "originalType": $recordType
            };
            $alias ?
              $merge([$base, {
                "serviceType": "Custom",
                "dnsName": $alias.dnsName,
                "customZoneId": $alias.hostedZoneId,
                "evaluateTargetHealth": $alias.evaluateTargetHealth
              }]) :
              $merge([$base, {
                "ttl": existingRecord.ttl,
                "values": existingRecord.values
              }])
          )

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeRecordName.output.result.entityName }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS record already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./ape-platform-entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ steps.computeRecordName.output.result.entityName }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ steps.computeRecordName.output.result.entityName }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record claimed by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: '${{ steps.buildEditParams.output.result | dump }}'
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            recordName: "${{ steps.computeRecordName.output.result.recordName }}"
            recordType: {% if parameters.existingRecord.aliasTarget %}ALIAS{% else %}${{ parameters.existingRecord.type }}{% endif %}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.existingRecord.aliasTarget %}
            aliasTarget:
              serviceType: Custom
              dnsName: ${{ parameters.existingRecord.aliasTarget.dnsName }}
              hostedZoneId: ${{ parameters.existingRecord.aliasTarget.hostedZoneId }}
              evaluateTargetHealth: ${{ parameters.existingRecord.aliasTarget.evaluateTargetHealth }}
            {%- else %}
            ttl: ${{ parameters.existingRecord.ttl }}
            values:
            {%- for v in parameters.existingRecord.values %}
              - ${{ v }}
            {%- endfor %}
            {%- endif %}
            # Claim semantics: the AWS record already exists; tell the
            # composition's importing branch to take over -- MR will be
            # stamped with managementPolicies [Observe, Update, Delete]
            # (no Create), so Crossplane adopts via external-name and
            # never tries to (re-)create the record.
            import:
              existing: true

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ steps.computeRecordName.output.result.entityName }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
