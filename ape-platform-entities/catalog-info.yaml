---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: dns
  namespace: dns-eds437
  description: DNS Platform — manages hosted zones and records across AWS accounts
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: dns
  labels:
    aws: "true"
spec:
  owner: group:default/infrastructure
  domain: default/cloud
  environments:
    - name: dev
      aws:
        account: "309670275661"
        accountName: dev-account
    - name: hml
      aws:
        account: "382598791794"
        accountName: hml-account
    - name: prd
      aws:
        account: "597230762851"
        accountName: prd-account
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cross
  description: Cross-cutting platform domain
  annotations:
    dock.tech/domain: cross
spec:
  owner: group:default/infrastructure
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cloud
  description: Cloud subdomain under the cross domain
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
spec:
  owner: group:default/infrastructure
  subdomainOf: cross
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: dns-dev
  namespace: system-dns-dev
  description: Dev environment for the dns system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: dns
    dock.tech/environment: dev
spec:
  type: environment
  owner: group:default/infrastructure
  system: dns
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: dns-hml
  namespace: system-dns-hml
  description: HML environment for the dns system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: dns
    dock.tech/environment: hml
spec:
  type: environment
  owner: group:default/infrastructure
  system: dns
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: dns-prd
  namespace: system-dns-prd
  description: Production environment for the dns system
  annotations:
    dock.tech/domain: cross
    dock.tech/subdomain: cloud
    dock.tech/system: dns
    dock.tech/environment: prd
spec:
  type: environment
  owner: group:default/infrastructure
  system: dns
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: infrastructure
  description: Infrastructure Services team
spec:
  type: team
  children: []
  members:
    - user:development/guest
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
  namespace: development
  description: PoC guest identity used for local Backstage auth
spec:
  memberOf:
    - group:default/infrastructure
