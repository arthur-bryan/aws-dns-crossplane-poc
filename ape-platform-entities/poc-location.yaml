apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: poc-dns-entities
  description: Root location for all PoC DNS entities and templates
spec:
  targets:
    # DNS system, domains, groups (System entity "dns" is defined here already)
    - ./catalog-info.yaml
    # DNS zone/record resources per environment
    # NOTE: trailing /*.yaml is required -- Backstage's GithubUrlReader only
    # treats a target as a directory crawl (git tree search) if the path is a
    # glob; a bare directory path is misread as a single file, which for a
    # GitHub directory returns a JSON listing array ("Expected object at
    # root, got object").
    - ./dock-tech/systems/dns-eds437/resources/dev/*.yaml
    - ./dock-tech/systems/dns-eds437/resources/hml/*.yaml
    - ./dock-tech/systems/dns-eds437/resources/prd/*.yaml
    # NOTE: environments/**/resources/aws/*.yaml are intentionally NOT crawled here.
    # Those are Crossplane XR manifests (apiVersion: dock.tech/v1, kind: DNSRecord/
    # DNSZone), auto-generated by the catalog-to-xr CI workflow from the Resource
    # entities above. They're GitOps output for ArgoCD/Crossplane, not Backstage
    # catalog entities -- Backstage has no kind validator for dock.tech/v1 and
    # correctly rejects them ("No processor recognized ... foreign kind or
    # apiVersion") if pointed at them.
    # NOTE: namespaces/*.yaml are also intentionally NOT crawled here -- they're
    # plain Kubernetes Namespace manifests (apiVersion: v1, kind: Namespace),
    # not Backstage catalog entities. Same "foreign kind" rejection applies.
