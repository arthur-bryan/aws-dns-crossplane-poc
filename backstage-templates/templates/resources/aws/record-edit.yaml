apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dns-record-edit
  title: Edit DNS Record
  description: Edit an existing DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - hidden
    - cloud-infrastructure

spec:
  owner: group:dock-tech/cloud-infrastructure
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        entityRef:
          title: Entity Reference
          type: string
          ui:disabled: true

        name:
          title: Name
          type: string
          ui:disabled: true

        system:
          title: System
          type: string
          ui:disabled: true

        environment:
          title: Environment
          type: string
          ui:disabled: true

        zone:
          title: DNS Zone
          type: string
          ui:disabled: true

        zoneId:
          title: Zone ID
          type: string
          ui:widget: hidden

        originalType:
          # The record type at form-load time. When the user changes `type`,
          # writeFile detects the diff and stamps the XR with
          # argocd.argoproj.io/sync-options: Force=true,Replace=true so the
          # MR gets deleted-and-recreated -- the only way Route53 will let
          # us swap A <-> CNAME on the same name.
          title: Original Record Type
          type: string
          ui:widget: hidden

        recordName:
          title: Record Name
          type: string
          ui:disabled: true

        type:
          title: Record Type
          type: string
          description: >-
            Changing the record type destroys the existing record in Route53 and
            re-creates it with the new type. Expect brief DNS unavailability
            during the swap.
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS

      dependencies:
        type:
          oneOf:
            - properties:
                type:
                  const: A
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: AAAA
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv6 Addresses
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: CNAME
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Target Hostname
                  type: array
                  description: Target canonical name
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: TXT
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Text Values
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: AWS Service Type (immutable)
                  type: string
                  description: Type of AWS service (cannot be changed)
                  ui:disabled: true
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - Custom
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the AWS resource
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
              required:
                - serviceType
                - dnsName
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum:
                            - CloudFront
                            - GlobalAccelerator
                            - S3Website
                            - APIGateway
                    - properties:
                        serviceType:
                          const: Custom
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          description: Hosted zone ID for custom alias target
                          pattern: "^Z[A-Z0-9]+$"
                      required:
                        - customZoneId
                    - properties:
                        serviceType:
                          enum:
                            - ALB
                            - NLB

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight
                  type: integer
                  description: Traffic weight (0-255)
                  minimum: 0
                  maximum: 255
                  default: 100
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - id: deriveAccount
      name: Derive DNS account from environment
      # See record-claim.yaml for rationale -- source from System entity.
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          environments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $envCfg := environments[name = env];
            {
              "accountId": $envCfg.aws.account,
              "accountName": $envCfg.aws.accountName
            }
          )

    - id: nextParams
      name: Compute next-edit scaffolder-parameters snapshot
      # After this edit lands, originalType must equal the *new* type so the
      # next edit sees the post-save state as its baseline. Without this,
      # every subsequent edit would re-stamp Force=Replace even when the
      # user didn't change the type.
      action: roadiehq:utils:jsonata
      input:
        data:
          params: ${{ parameters }}
        expression: >-
          $merge([params, {"originalType": params.type}])

    - id: writeFile
      name: Update Resource File
      # Full rewrite (not merge): switching record type or toggling weighted
      # routing must NOT leave stale ttl/values/aliasTarget/setIdentifier/
      # weight keys behind. The template owns the spec shape; emit it whole
      # so the file always matches the form's current state. Shape matches
      # what record.yaml (create) and record-claim.yaml emit so all three
      # paths produce identical Resource entities.
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record managed by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: '${{ steps.nextParams.output.result | dump }}'
              {%- if parameters.originalType and parameters.type != parameters.originalType %}
              # Type change (e.g. A -> CNAME). The converter copies this
              # argocd.argoproj.io/* annotation onto the XR, which makes
              # ArgoCD delete-and-recreate the XR (and therefore the MR),
              # which lets Crossplane drop the old AWS record before
              # creating the new-type one. Without this, Route53 rejects
              # the create with InvalidChangeBatch (name+type collision).
              argocd.argoproj.io/sync-options: Force=true,Replace=true
              {%- endif %}
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zoneId }}
            zoneName: ${{ parameters.zone }}
            recordName: "${{ parameters.recordName }}"
            recordType: ${{ parameters.type }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: updated
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/notify.yaml

  output: {}
