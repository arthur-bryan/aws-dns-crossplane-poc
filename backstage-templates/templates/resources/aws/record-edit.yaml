apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dns-record-edit
  title: Edit DNS Record
  description: Edit an existing DNS record
  labels:
    category: resources
  tags:
    - resource
    - dns
    - aws
    - public
    - hidden

spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - zone
        - recordName
        - type
      properties:
        entityRef:
          title: Entity Reference
          type: string
          description: Internal — pre-filled when opened via the pencil
          ui:disabled: true
          ui:widget: hidden

        name:
          title: Name
          type: string
          description: Name of the DNS record resource
          ui:disabled: true

        system:
          title: System
          type: string
          description: Owning system (immutable)
          ui:disabled: true

        zone:
          title: DNS Zone
          type: string
          description: DNS zone (immutable)
          ui:disabled: true

        recordName:
          title: Record Name
          type: string
          description: Record name (immutable)
          ui:disabled: true

        type:
          title: Record Type
          type: string
          description: DNS record type (immutable)
          ui:disabled: true
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS

      dependencies:
        type:
          oneOf:
            # A Record
            - properties:
                type:
                  const: A
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
              required:
                - values

            # AAAA Record
            - properties:
                type:
                  const: AAAA
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv6 Addresses
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            # CNAME Record
            - properties:
                type:
                  const: CNAME
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Target Hostname
                  type: array
                  description: Target canonical name
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
              required:
                - values

            # TXT Record
            - properties:
                type:
                  const: TXT
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Text Values
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
              required:
                - values

            # ALIAS Record
            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: Target Service Type (immutable)
                  type: string
                  description: Service type (cannot be changed)
                  ui:disabled: true
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - Custom
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the target
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
              required:
                - serviceType
                - dnsName
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum:
                            - CloudFront
                            - GlobalAccelerator
                            - S3Website
                            - APIGateway
                    - properties:
                        serviceType:
                          const: Custom
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          description: Hosted zone ID for custom alias target
                          pattern: "^Z[A-Z0-9]+$"
                      required:
                        - customZoneId
                    - properties:
                        serviceType:
                          enum:
                            - ALB
                            - NLB

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                weight:
                  title: Weight
                  type: integer
                  description: Traffic weight (0-255)
                  minimum: 0
                  maximum: 255
                  default: 100
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - id: writeFile
      name: Update Resource File
      action: roadiehq:utils:merge
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/dev/record-${{ parameters.name }}-dev.yaml
        content: |
          metadata:
            annotations:
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
          spec:
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: updated
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/notify.yaml

  output: {}
