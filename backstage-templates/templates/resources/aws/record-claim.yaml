apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing DNS Record
  description: Bring an existing DNS record under platform management
  labels:
    category: resources
  tags:
    - resource
    - dns
    - aws
    - public

spec:
  type: resource

  parameters:
    - title: Record to Claim
      required:
        - name
        - system
        - environment
        - zone
        - existingRecord
      properties:
        name:
          title: Resource Name
          type: string
          description: Catalog entity name (must be unique)
          ui:autofocus: true

        kind:
          title: Kind
          type: string
          default: Record
          ui:widget: hidden

        system:
          title: System
          type: string
          description: System that owns this record
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System

        environment:
          title: Environment
          type: string
          description: Environment
          ui:field: EnvironmentPicker
          ui:options:
            systemFieldName: system

        zone:
          title: DNS Zone
          type: object
          description: Live DNS zones in the selected environment
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        existingRecord:
          title: Existing Record
          type: object
          description: Pick the record you want to claim. Details auto-populate.
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zone
          properties:
            name:    { type: string }
            type:    { type: string }
            ttl:     { type: integer }
            values:  { type: array, items: { type: string } }
            aliasTarget:
              type: object
              properties:
                dnsName:              { type: string }
                hostedZoneId:         { type: string }
                evaluateTargetHealth: { type: boolean }

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: deriveAccount
      name: Derive AWS account from the selected environment
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          systemEnvironments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $e := $filter(systemEnvironments, function($x) { $x.name = env })[0];
            $e ? { "account": $string($e.aws.account), "accountName": $e.aws.accountName }
               : { "account": "", "accountName": "" }
          )

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ parameters.name }}-${{ parameters.environment }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: DNS Record (claimed)
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
              dock.tech/import-existing: "true"
          spec:
            type: Record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            aws:
              account: ${{ steps.deriveAccount.output.result.account }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            recordName: ${{ parameters.existingRecord.name }}
            recordType: ${{ parameters.existingRecord.type }}
            {%- if parameters.existingRecord.aliasTarget %}
            aliasTarget:
              dnsName: ${{ parameters.existingRecord.aliasTarget.dnsName }}
              hostedZoneId: ${{ parameters.existingRecord.aliasTarget.hostedZoneId }}
              evaluateTargetHealth: ${{ parameters.existingRecord.aliasTarget.evaluateTargetHealth }}
            {%- else %}
            ttl: ${{ parameters.existingRecord.ttl }}
            values:
            {%- for value in parameters.existingRecord.values %}
              - ${{ value }}
            {%- endfor %}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: claimed
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
