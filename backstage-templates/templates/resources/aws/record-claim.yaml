apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record-claim
  title: Claim Existing AWS Route53 DNS Record
  description: Claim ownership of an existing AWS Route53 DNS record and register it in the catalog
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public

spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - environment
        - zoneId
        - existingRecord
        - owner
      properties:
        name:
          title: Resource Name
          type: string
          description: Unique catalog name for this record resource
          ui:autofocus: true

        kind:
          title: Kind
          type: string
          default: Record
          ui:widget: hidden

        system:
          title: System
          type: string
          description: System that owns this record
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System

        environment:
          title: Environment
          type: string
          description: Pick the environment whose AWS account owns the zone
          ui:field: EnvironmentPicker
          ui:options:
            systemFieldName: system

        zoneId:
          title: DNS Zone
          type: string
          description: Live list of Route53 hosted zones in the selected environment
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        existingRecord:
          title: Existing Record
          type: object
          description: Pick the record you want to claim. Details auto-populate.
          ui:field: AwsDnsRecordPicker
          ui:options:
            environmentFieldName: environment
            zoneFieldName: zoneId
          properties:
            name:    { type: string }
            type:    { type: string }
            ttl:     { type: integer }
            values:  { type: array, items: { type: string } }
            aliasTarget:
              type: object
              properties:
                dnsName:              { type: string }
                hostedZoneId:         { type: string }
                evaluateTargetHealth: { type: boolean }

        owner:
          title: Claiming Team
          type: string
          description: Your team will become the owner of this record
          ui:field: MyGroupsPicker

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ parameters.name }}-${{ parameters.environment }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: AWS Route53 DNS Record (claimed)
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
              dock.tech/import-existing: "true"
          spec:
            type: Record
            cloud: aws
            owner: ${{ parameters.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            zoneId: ${{ parameters.zoneId }}
            recordName: ${{ parameters.existingRecord.name }}
            recordType: ${{ parameters.existingRecord.type }}
            {%- if parameters.existingRecord.aliasTarget %}
            aliasTarget:
              dnsName: ${{ parameters.existingRecord.aliasTarget.dnsName }}
              hostedZoneId: ${{ parameters.existingRecord.aliasTarget.hostedZoneId }}
              evaluateTargetHealth: ${{ parameters.existingRecord.aliasTarget.evaluateTargetHealth }}
            {%- else %}
            ttl: ${{ parameters.existingRecord.ttl }}
            values:
            {%- for value in parameters.existingRecord.values %}
              - ${{ value }}
            {%- endfor %}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: claimed
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
