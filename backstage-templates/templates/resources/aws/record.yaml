apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-dns-record
  title: AWS Route53 DNS Record Template
  description: A template for creating an AWS Route53 DNS record
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public

spec:
  type: resource

  parameters:
    - title: DNS Record Information
      required:
        - name
        - system
        - environment
        - zone
        - recordName
        - type
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the DNS record resource
          ui:autofocus: true
          ui:options:
            rows: 5

        system:
          title: System
          type: string
          description: System of Resource
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System

        environment:
          title: Environment
          type: string
          description: Environment of the DNS record (e.g. dev, hml, prod)
          ui:field: EnvironmentPicker
          ui:options:
            rows: 5
            systemFieldName: system

        zone:
          title: Parent Zone
          type: object
          description: Live Route53 hosted zones in the selected environment
          ui:field: AwsDnsZonePicker
          ui:options:
            environmentFieldName: environment

        kind:
          title: Kind
          type: string
          default: Record
          ui:widget: hidden

        recordName:
          title: Record Name
          type: string
          description: Record name (e.g., 'www', 'api', 'cdn')
          pattern: '^[a-z0-9]([a-z0-9\-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9\-]*[a-z0-9])?)*$'
          ui:help: "Examples: www, api, cdn, app.staging"

        type:
          title: Record Type
          type: string
          description: DNS record type
          default: A
          enum:
            - A
            - AAAA
            - CNAME
            - TXT
            - ALIAS
            - MX
            - SRV
            - NS
            - CAA
            - PTR

      dependencies:
        type:
          oneOf:
            # A Record
            - properties:
                type:
                  const: A
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv4 Addresses
                  type: array
                  description: List of IPv4 addresses
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                  minItems: 1
                  ui:help: "Example: 10.0.1.100"
              required:
                - values

            # AAAA Record
            - properties:
                type:
                  const: AAAA
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: IPv6 Addresses
                  type: array
                  description: List of IPv6 addresses
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: 2001:0db8:85a3::8a2e:0370:7334"
              required:
                - values

            # CNAME Record
            - properties:
                type:
                  const: CNAME
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Target Hostname
                  type: array
                  description: Target canonical name (only one value allowed for CNAME)
                  items:
                    type: string
                  maxItems: 1
                  minItems: 1
                  ui:help: "Example: api.example.com"
              required:
                - values

            # TXT Record
            - properties:
                type:
                  const: TXT
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Text Values
                  type: array
                  description: Text values for the record
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: v=spf1 include:_spf.google.com ~all"
              required:
                - values

            # MX Record
            - properties:
                type:
                  const: MX
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: MX Records
                  type: array
                  description: 'Mail exchange records (format: "priority hostname")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 mail.example.com" (lower priority wins)'
              required:
                - values

            # SRV Record
            - properties:
                type:
                  const: SRV
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: SRV Records
                  type: array
                  description: 'Service records (format: "priority weight port target")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+[0-9]+\s+[0-9]+\s+\S+\s*$'
                  minItems: 1
                  ui:help: 'Example: "10 60 5060 sipserver.example.com"'
              required:
                - values

            # NS Record
            - properties:
                type:
                  const: NS
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 172800
                  minimum: 60
                  maximum: 86400
                values:
                  title: Nameservers
                  type: array
                  description: Nameserver hostnames for subdomain delegation
                  items:
                    type: string
                  minItems: 1
                  ui:help: "Example: ns1.example.com (for delegating subdomains)"
              required:
                - values

            # CAA Record
            - properties:
                type:
                  const: CAA
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: CAA Records
                  type: array
                  description: 'Certificate authority authorization (format: "flags tag value")'
                  items:
                    type: string
                    pattern: '^\s*[0-9]+\s+(issue|issuewild|iodef|contactemail|contactphone)\s+".*"\s*$'
                  minItems: 1
                  ui:help: 'Example: 0 issue "letsencrypt.org" (restricts which CAs can issue certs)'
              required:
                - values

            # PTR Record
            - properties:
                type:
                  const: PTR
                ttl:
                  title: TTL (seconds)
                  type: integer
                  description: Time to live in seconds
                  default: 3600
                  minimum: 60
                  maximum: 86400
                values:
                  title: Target Hostname
                  type: array
                  description: Hostname for reverse DNS lookup
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1
                  ui:help: "Example: server.example.com (for reverse DNS)"
              required:
                - values

            # ALIAS Record
            - properties:
                type:
                  const: ALIAS
                serviceType:
                  title: AWS Service Type
                  type: string
                  description: Type of AWS service being aliased
                  default: CloudFront
                  enum:
                    - CloudFront
                    - ALB
                    - NLB
                    - S3Website
                    - APIGateway
                    - GlobalAccelerator
                    - Custom
                  enumNames:
                    - "CloudFront Distribution"
                    - "Application Load Balancer (ALB)"
                    - "Network Load Balancer (NLB)"
                    - "S3 Website Endpoint"
                    - "API Gateway"
                    - "Global Accelerator"
                    - "Custom (provide zone ID manually)"
                dnsName:
                  title: Target DNS Name
                  type: string
                  description: DNS name of the AWS resource
                  ui:help: "Example: d111111abcdef8.cloudfront.net"
                evaluateTargetHealth:
                  title: Evaluate Target Health
                  type: boolean
                  description: Whether to evaluate the health of the target
                  default: false
              required:
                - serviceType
                - dnsName
              dependencies:
                serviceType:
                  oneOf:
                    - properties:
                        serviceType:
                          enum:
                            - CloudFront
                            - GlobalAccelerator
                            - S3Website
                            - APIGateway
                    - properties:
                        serviceType:
                          const: Custom
                        customZoneId:
                          title: Custom Hosted Zone ID
                          type: string
                          description: Hosted zone ID for custom alias target
                          pattern: "^Z[A-Z0-9]+$"
                          ui:help: "Example: Z2FDTNDATAQYW2"
                      required:
                        - customZoneId
                    - properties:
                        serviceType:
                          enum:
                            - ALB
                            - NLB

    - title: Weighted Routing (Optional)
      description: Enable weighted routing to distribute traffic across multiple records
      properties:
        enableWeightedRouting:
          title: Enable Weighted Routing
          type: boolean
          description: Enable traffic distribution based on weight
          default: false

      dependencies:
        enableWeightedRouting:
          oneOf:
            - properties:
                enableWeightedRouting:
                  const: false
            - properties:
                enableWeightedRouting:
                  const: true
                setIdentifier:
                  title: Set Identifier
                  type: string
                  description: Unique identifier for this weighted record
                  minLength: 1
                  maxLength: 128
                  ui:help: "Example: primary-us-east-2"
                weight:
                  title: Weight
                  type: integer
                  description: Traffic weight (0-255) for weighted routing
                  minimum: 0
                  maximum: 255
                  default: 100
                  ui:help: "Higher weight = more traffic (relative to other records with same name)"
              required:
                - setIdentifier
                - weight

  steps:
    - $yaml: ../../../shared/entities/clone.yaml
    - $yaml: ../../../shared/entities/fetch-system.yaml
    - $yaml: ../../../shared/entities/fetch-system-domain.yaml

    - id: deriveAccount
      name: Derive AWS account from the selected environment
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          systemEnvironments: ${{ steps.fetchSystem.output.entity.spec.environments }}
        expression: >-
          (
            $e := $filter(systemEnvironments, function($x) { $x.name = env })[0];
            $e ? { "account": $string($e.aws.account), "accountName": $e.aws.accountName }
               : { "account": "", "accountName": "" }
          )

    - id: checkIffileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ parameters.name }}-${{ parameters.environment }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIffileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS record already exists. Please choose a different name.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/record-${{ parameters.name }}-${{ parameters.environment }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchSystem.output.entity.metadata.namespace }}
            description: AWS Route53 DNS Record created by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-record-edit
              dock.tech/scaffolder-parameters: ${{ "'" + parameters | dump + "'" }}
          spec:
            type: Record
            cloud: aws
            owner: ${{ steps.fetchSystem.output.entity.spec.owner }}
            system: ${{ parameters.system }}
            environment: ${{ parameters.environment }}
            domain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/domain'] }}
            subdomain: ${{ steps.fetchSystem.output.entity.metadata.annotations['dock.tech/subdomain'] }}
            aws:
              account: ${{ steps.deriveAccount.output.result.account }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            zoneId: ${{ parameters.zone.id }}
            zoneName: ${{ parameters.zone.name }}
            recordName: ${{ parameters.recordName }}
            recordType: ${{ parameters.type }}
            {%- if parameters.type != 'ALIAS' %}
            ttl: ${{ parameters.ttl }}
            values:
            {%- for value in parameters.values %}
              - ${{ value }}
            {%- endfor %}
            {%- else %}
            aliasTarget:
              serviceType: ${{ parameters.serviceType }}
              dnsName: ${{ parameters.dnsName }}
              {%- if parameters.serviceType == 'Custom' %}
              hostedZoneId: ${{ parameters.customZoneId }}
              {%- endif %}
              evaluateTargetHealth: ${{ parameters.evaluateTargetHealth }}
            {%- endif %}
            {%- if parameters.enableWeightedRouting %}
            setIdentifier: ${{ parameters.setIdentifier }}
            weight: ${{ parameters.weight }}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
