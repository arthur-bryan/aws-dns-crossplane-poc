apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dns-zone
  title: DNS Zone Template
  description: A template for creating a DNS hosted zone
  labels:
    category: resources
  tags:
    - resource
    - aws
    - public
    - cloud-infrastructure
spec:
  owner: group:dock-tech/cloud-infrastructure
  type: resource

  parameters:
    - title: DNS Zone Information
      required:
        - environment
        - name
        - zoneName
        - visibility
      properties:
        environment:
          title: Environment
          type: string
          description: Environment where the DNS zone will be created
          ui:field: AwsEnvironmentPicker
        kind:
          title: Kind
          type: string
          default: Zone
          ui:widget: hidden

        name:
          title: Context
          type: string
          description: Context to compose the name of the zone
          ui:autofocus: true
          ui:field: EntityNameComposerPicker
          ui:options:
            systemRef: system:default/infrastructure
            suffix: zone

        zoneName:
          title: Zone Name
          type: string
          description: DNS zone name (FQDN without trailing dot, e.g., test.dev.dock.tech)
          pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}$'
          ui:help: "Example: test.dev.dock.tech (no trailing dot)"

        visibility:
          title: Visibility
          type: string
          description: Public zones are resolvable from the internet. Private zones only resolve from associated VPCs.
          default: public
          enum:
            - public
            - private

        comment:
          title: Comment
          type: string
          description: Optional comment for the zone (max 256 characters)
          maxLength: 256

      dependencies:
        visibility:
          oneOf:
            - properties:
                visibility:
                  const: public
            - properties:
                visibility:
                  const: private
                vpcs:
                  title: Associated VPCs
                  type: array
                  description: VPCs that may resolve this private zone (same AWS account as the zone).
                  minItems: 1
                  items:
                    type: object
                    required:
                      - vpcId
                      - vpcRegion
                    properties:
                      vpcId:
                        title: VPC ID
                        type: string
                        pattern: '^vpc-[a-f0-9]+$'
                        description: e.g. vpc-0a1b2c3d4e5f
                      vpcRegion:
                        title: VPC Region
                        type: string
                        default: us-east-1
                        description: AWS region where the VPC lives
              required:
                - vpcs

    - title: Additional Tags (Optional)
      properties:
        tags:
          title: Tags
          type: object
          description: Additional AWS tags (hierarchy tags are added automatically)
          ui:field: KeyValuePairInput

  steps:
    - $yaml: ../../../shared/entities/clone.yaml

    - id: fetchDnsSystem
      name: Fetch DNS System Entity
      action: catalog:fetch
      input:
        entityRef: system:default/infrastructure
        defaultKind: System

    - id: deriveAccount
      name: Derive DNS account from environment
      # Source from the System entity's spec.environments[] so account
      # numbers stay consistent with catalog truth (same pattern as the
      # record / record-claim / record-edit templates).
      action: roadiehq:utils:jsonata
      input:
        data:
          env: ${{ parameters.environment }}
          environments: ${{ steps.fetchDnsSystem.output.entity.spec.environments }}
        expression: >-
          (
            $envCfg := environments[name = env];
            {
              "accountId": $envCfg.aws.account,
              "accountName": $envCfg.aws.accountName
            }
          )

    - id: checkIfFileAlreadyExists
      name: Check If File Already Exists
      action: fs:file:exists
      input:
        filepath: ./entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml

    - id: launchErrorIfFileExists
      name: Launch Error If File Exists
      if: ${{ steps.checkIfFileAlreadyExists.output.exists }}
      action: error:launch
      input:
        message: A resource file for this DNS zone already exists.

    - id: writeFile
      name: Create Resource File
      action: roadiehq:utils:fs:write
      input:
        path: ./entities/dock-tech/systems/${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/resources/${{ parameters.environment }}/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}
            description: DNS Zone created by template
            annotations:
              dock.tech/scaffolder-editable-template: dns-zone-edit
              dock.tech/scaffolder-parameters: '${{ parameters | dump }}'
            labels:
              environment: ${{ parameters.environment }}
              cloud: aws
          spec:
            type: dns-zone
            cloud: aws
            owner: ${{ steps.fetchDnsSystem.output.entity.spec.owner }}
            system: system:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ steps.fetchDnsSystem.output.entity.metadata.name }}
            environment: ${{ parameters.environment }}
            zoneName: ${{ parameters.zoneName }}
            visibility: ${{ parameters.visibility }}
            aws:
              account: ${{ steps.deriveAccount.output.result.accountId }}
              accountName: ${{ steps.deriveAccount.output.result.accountName }}
            {%- if parameters.visibility == 'private' %}
            vpcs:
            {%- for v in parameters.vpcs %}
              - vpcId: ${{ v.vpcId }}
                vpcRegion: ${{ v.vpcRegion }}
            {%- endfor %}
            {%- endif %}
            {%- if parameters.comment %}
            comment: ${{ parameters.comment }}
            {%- endif %}
            {%- if parameters.tags %}
            tags:
            {%- for key, value in parameters.tags %}
              {{ key }}: {{ value }}
            {%- endfor %}
            {%- endif %}

    - $yaml: ../../../shared/entities/commit.yaml
    - $yaml: ../../../shared/entities/push.yaml

    - id: publish-activity-log
      action: activity-log:publish
      input:
        action: created
        entityRef: resource:${{ steps.fetchDnsSystem.output.entity.metadata.namespace }}/${{ parameters.name }}
        payload: ${{ parameters }}

    - $yaml: ../../../shared/entities/refresh-entities.yaml
    - $yaml: ../../../shared/notify.yaml

  output: {}
