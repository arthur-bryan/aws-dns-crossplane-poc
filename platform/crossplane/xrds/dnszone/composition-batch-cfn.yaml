apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnszones.batch.cloudformation
  labels:
    provider: aws
    service: route53
    mode: batch
    method: cloudformation
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: dns.crossplane.poc/v1alpha1
    kind: XDNSZone

  mode: Pipeline

  pipeline:
    - step: manage-zone
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: zone
            base:
              apiVersion: route53.aws.upbound.io/v1beta1
              kind: Zone
              spec:
                managementPolicies: ["Observe", "Create", "Update"]
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Optional

              - type: FromCompositeFieldPath
                fromFieldPath: spec.zoneName
                toFieldPath: spec.forProvider.name

              - type: FromCompositeFieldPath
                fromFieldPath: spec.comment
                toFieldPath: spec.forProvider.comment
                policy:
                  fromFieldPath: Optional

              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: spec.providerConfigRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "aws-%s"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: spec.forProvider.tags.Environment

              - type: FromCompositeFieldPath
                fromFieldPath: spec.tags
                toFieldPath: spec.forProvider.tags
                policy:
                  fromFieldPath: Optional

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.zoneName
                  strategy: string
                  string:
                    fmt: "Crossplane"
                toFieldPath: spec.forProvider.tags.ManagedBy

              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.zoneId

              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.nameServers
                toFieldPath: status.nameServers

            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

    - step: batch-create-records
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $zoneId := "" }}
            {{ $zoneName := .observed.composite.resource.spec.zoneName }}
            {{ $env := .observed.composite.resource.spec.environment }}
            {{ $hasRecords := false }}

            {{- /* Extract zone ID from Zone resource */ -}}
            {{- if .observed.resources }}
            {{- range .observed.resources }}
            {{- if eq .resource.kind "Zone" }}
            {{- if .resource.status }}
            {{- if .resource.status.atProvider }}
            {{- if .resource.status.atProvider.id }}
            {{ $zoneId = .resource.status.atProvider.id }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* Check if records exist */ -}}
            {{- if .observed.composite.resource.spec.records }}
            {{- if gt (len .observed.composite.resource.spec.records) 0 }}
            {{ $hasRecords = true }}
            {{- end }}
            {{- end }}

            {{- /* Only create stack if zone ID exists AND records exist */ -}}
            {{- if and $zoneId $hasRecords }}
            ---
            apiVersion: cloudformation.aws.upbound.io/v1beta1
            kind: Stack
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: records-batch-stack
            spec:
              providerConfigRef:
                name: aws-{{ $env }}
              forProvider:
                region: us-east-1
                name: dns-records-{{ $zoneName | replace "." "-" }}
                templateBody: |
                  {
                    "AWSTemplateFormatVersion": "2010-09-09",
                    "Description": "Batch DNS records for zone {{ $zoneName }}",
                    "Resources": {
                      {{- $recordCount := len .observed.composite.resource.spec.records }}
                      {{- range $idx, $record := .observed.composite.resource.spec.records }}
                      {{- $recordName := $record.name }}
                      {{- if not (hasSuffix $record.name $zoneName) }}
                      {{- $recordName = printf "%s.%s" $record.name $zoneName }}
                      {{- end }}
                      "Record{{ printf "%04d" $idx }}": {
                        "Type": "AWS::Route53::RecordSet",
                        "Properties": {
                          "HostedZoneId": "{{ $zoneId }}",
                          "Name": "{{ $recordName }}",
                          "Type": "{{ $record.type }}"{{ if or $record.aliasTarget $record.values $record.weight $record.setIdentifier }},{{ end }}
                          {{- if $record.aliasTarget }}
                          "AliasTarget": {
                            "DNSName": "{{ $record.aliasTarget.dnsName }}",
                            "HostedZoneId": "{{ $record.aliasTarget.hostedZoneId }}",
                            "EvaluateTargetHealth": {{ $record.aliasTarget.evaluateTargetHealth | default false }}
                          }{{ if or $record.weight $record.setIdentifier }},{{ end }}
                          {{- else if $record.values }}
                          "TTL": {{ $record.ttl | default 300 }},
                          "ResourceRecords": [
                            {{- $valueCount := len $record.values }}
                            {{- range $vIdx, $value := $record.values }}
                            {{- if eq $record.type "TXT" }}
                            "\"{{ $value }}\""{{ if lt $vIdx (sub $valueCount 1) }},{{ end }}
                            {{- else }}
                            "{{ $value }}"{{ if lt $vIdx (sub $valueCount 1) }},{{ end }}
                            {{- end }}
                            {{- end }}
                          ]{{ if or $record.weight $record.setIdentifier }},{{ end }}
                          {{- end }}
                          {{- if $record.setIdentifier }}
                          "SetIdentifier": "{{ $record.setIdentifier }}"{{ if $record.weight }},{{ end }}
                          {{- end }}
                          {{- if $record.weight }}
                          "Weight": {{ $record.weight }}
                          {{- end }}
                        }
                      }{{ if lt $idx (sub $recordCount 1) }},{{ end }}
                      {{- end }}
                    },
                    "Outputs": {
                      "ZoneId": {
                        "Description": "Route53 hosted zone ID",
                        "Value": "{{ $zoneId }}"
                      },
                      "RecordCount": {
                        "Description": "Number of DNS records created",
                        "Value": "{{ $recordCount }}"
                      }
                    }
                  }
                tags:
                  Zone: {{ $zoneName }}
                  Environment: {{ $env }}
                  ManagedBy: Crossplane
                  GitOps: "true"
                  RecordCount: "{{ len .observed.composite.resource.spec.records }}"
            {{- end }}

    - step: auto-ready
      functionRef:
        name: function-auto-ready
