apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnszones.function.gitops
  labels:
    provider: aws
    service: route53
    resource: zone-gitops
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: dns.crossplane.poc/v1alpha1
    kind: XDNSZone

  # Use Patchand-Transform for Zone (to handle import annotation)
  # Use Pipeline for Records (to handle dynamic generation)
  mode: Pipeline
  pipeline:
    # Step 1: Create Zone using patch-and-transform (handles import properly)
    - step: patch-zone
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: zone
            base:
              apiVersion: route53.aws.upbound.io/v1beta1
              kind: Zone
              spec:
                providerConfigRef:
                  name: aws-poc
                managementPolicies: ["Observe", "Create", "Update"]
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
            patches:
              # Copy external-name annotation for import
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                policy:
                  fromFieldPath: Optional

              # Basic fields
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zoneName
                toFieldPath: spec.forProvider.name

              - type: FromCompositeFieldPath
                fromFieldPath: spec.comment
                toFieldPath: spec.forProvider.comment
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s"

              # Tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: spec.forProvider.tags.Environment

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environment
                  strategy: string
                  string:
                    fmt: "true"
                toFieldPath: spec.forProvider.tags.GitOps

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.zoneName
                  strategy: string
                  string:
                    fmt: "Crossplane"
                toFieldPath: spec.forProvider.tags.ManagedBy

    # Step 2: Generate Records dynamically using go-templating
    - step: render-records
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $zoneId := "" }}
            {{- if .observed.resources }}
            {{- range .observed.resources }}
            {{- if eq .resource.kind "Zone" }}
            {{- if .resource.status }}
            {{- if .resource.status.atProvider }}
            {{- if .resource.status.atProvider.id }}
            {{ $zoneId = .resource.status.atProvider.id }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $zoneId }}
            {{- range .observed.composite.resource.spec.records }}
            ---
            apiVersion: route53.aws.upbound.io/v1beta2
            kind: Record
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: record-{{ .name }}-{{ .type }}
            spec:
              providerConfigRef:
                name: aws-poc
              managementPolicies: ["Observe", "Create", "Update"]
              deletionPolicy: Orphan
              forProvider:
                region: us-east-1
                zoneId: {{ $zoneId }}
                name: {{ .name }}
                type: {{ .type }}
                {{- if ne .type "ALIAS" }}
                ttl: {{ .ttl | default 300 }}
                records:
                  {{- range .values }}
                  - {{ . | quote }}
                  {{- end }}
                {{- else }}
                alias:
                  - name: {{ .aliasTarget.dnsName }}
                    zoneId: {{ .aliasTarget.hostedZoneId }}
                    evaluateTargetHealth: {{ .aliasTarget.evaluateTargetHealth | default false }}
                {{- end }}
            {{- end }}
            {{- end }}

    # Step 3: Mark as ready
    - step: auto-ready
      functionRef:
        name: function-auto-ready
