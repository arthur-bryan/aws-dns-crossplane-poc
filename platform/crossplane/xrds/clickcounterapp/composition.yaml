apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: clickcounterapps.aws.dns.platform.example
  labels:
    crossplane.io/xrd: xclickcounterapps.dns.platform.example
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: dns.platform.example/v1alpha1
    kind: XClickCounterApp

  resources:
    # CloudFormation Stack for Lambda + DynamoDB + API Gateway
    - name: clickcounter-stack
      base:
        apiVersion: cloudformation.aws.upbound.io/v1beta1
        kind: Stack
        spec:
          providerConfigRef:
            name: aws-poc
          forProvider:
            region: us-east-2
            templateBody: |
              AWSTemplateFormatVersion: '2010-09-09'
              Description: 'Click Counter Application - Lambda + DynamoDB + API Gateway'

              Parameters:
                ProjectName:
                  Type: String
                  Description: Project name for resource naming

              Resources:
                # DynamoDB Table
                ClickCounterTable:
                  Type: AWS::DynamoDB::Table
                  Properties:
                    TableName: !Sub '${ProjectName}-clicks'
                    AttributeDefinitions:
                      - AttributeName: id
                        AttributeType: S
                    KeySchema:
                      - AttributeName: id
                        KeyType: HASH
                    BillingMode: PAY_PER_REQUEST
                    Tags:
                      - Key: Project
                        Value: !Ref ProjectName
                      - Key: ManagedBy
                        Value: crossplane

                # Lambda Execution Role
                LambdaExecutionRole:
                  Type: AWS::IAM::Role
                  Properties:
                    AssumeRolePolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                        - Effect: Allow
                          Principal:
                            Service: lambda.amazonaws.com
                          Action: sts:AssumeRole
                    ManagedPolicyArns:
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                    Policies:
                      - PolicyName: DynamoDBAccess
                        PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                            - Effect: Allow
                              Action:
                                - dynamodb:GetItem
                                - dynamodb:PutItem
                                - dynamodb:UpdateItem
                                - dynamodb:Scan
                              Resource: !GetAtt ClickCounterTable.Arn

                # Lambda Function
                ClickCounterFunction:
                  Type: AWS::Lambda::Function
                  Properties:
                    FunctionName: !Sub '${ProjectName}-handler'
                    Runtime: python3.12
                    Handler: index.handler
                    Role: !GetAtt LambdaExecutionRole.Arn
                    Environment:
                      Variables:
                        TABLE_NAME: !Ref ClickCounterTable
                    Code:
                      ZipFile: |
                        import json
                        import os
                        import boto3
                        from datetime import datetime

                        dynamodb = boto3.resource('dynamodb')
                        table = dynamodb.Table(os.environ['TABLE_NAME'])

                        def handler(event, context):
                            # CORS headers
                            headers = {
                                'Content-Type': 'application/json',
                                'Access-Control-Allow-Origin': '*',
                                'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
                                'Access-Control-Allow-Headers': 'Content-Type'
                            }

                            # Handle OPTIONS for CORS preflight
                            if event.get('httpMethod') == 'OPTIONS':
                                return {
                                    'statusCode': 200,
                                    'headers': headers,
                                    'body': ''
                                }

                            try:
                                # GET - retrieve current count
                                if event.get('httpMethod') == 'GET':
                                    response = table.get_item(Key={'id': 'counter'})
                                    count = response.get('Item', {}).get('count', 0)
                                    return {
                                        'statusCode': 200,
                                        'headers': headers,
                                        'body': json.dumps({'count': count})
                                    }

                                # POST - increment count
                                elif event.get('httpMethod') == 'POST':
                                    response = table.update_item(
                                        Key={'id': 'counter'},
                                        UpdateExpression='ADD #count :inc SET lastUpdated = :timestamp',
                                        ExpressionAttributeNames={'#count': 'count'},
                                        ExpressionAttributeValues={
                                            ':inc': 1,
                                            ':timestamp': datetime.utcnow().isoformat()
                                        },
                                        ReturnValues='UPDATED_NEW'
                                    )
                                    count = response['Attributes']['count']
                                    return {
                                        'statusCode': 200,
                                        'headers': headers,
                                        'body': json.dumps({'count': count, 'message': 'Counter incremented'})
                                    }

                                else:
                                    return {
                                        'statusCode': 405,
                                        'headers': headers,
                                        'body': json.dumps({'error': 'Method not allowed'})
                                    }

                            except Exception as e:
                                return {
                                    'statusCode': 500,
                                    'headers': headers,
                                    'body': json.dumps({'error': str(e)})
                                }
                    Tags:
                      - Key: Project
                        Value: !Ref ProjectName
                      - Key: ManagedBy
                        Value: crossplane

                # API Gateway REST API
                ClickCounterApi:
                  Type: AWS::ApiGateway::RestApi
                  Properties:
                    Name: !Sub '${ProjectName}-api'
                    Description: API for Click Counter application
                    EndpointConfiguration:
                      Types:
                        - REGIONAL

                # API Gateway Resource
                ClickCounterResource:
                  Type: AWS::ApiGateway::Resource
                  Properties:
                    RestApiId: !Ref ClickCounterApi
                    ParentId: !GetAtt ClickCounterApi.RootResourceId
                    PathPart: clicks

                # OPTIONS Method (CORS)
                ClickCounterOptionsMethod:
                  Type: AWS::ApiGateway::Method
                  Properties:
                    RestApiId: !Ref ClickCounterApi
                    ResourceId: !Ref ClickCounterResource
                    HttpMethod: OPTIONS
                    AuthorizationType: NONE
                    Integration:
                      Type: MOCK
                      IntegrationResponses:
                        - StatusCode: 200
                          ResponseParameters:
                            method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
                            method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                            method.response.header.Access-Control-Allow-Origin: "'*'"
                          ResponseTemplates:
                            application/json: ''
                      RequestTemplates:
                        application/json: '{"statusCode": 200}'
                    MethodResponses:
                      - StatusCode: 200
                        ResponseParameters:
                          method.response.header.Access-Control-Allow-Headers: true
                          method.response.header.Access-Control-Allow-Methods: true
                          method.response.header.Access-Control-Allow-Origin: true

                # GET Method
                ClickCounterGetMethod:
                  Type: AWS::ApiGateway::Method
                  Properties:
                    RestApiId: !Ref ClickCounterApi
                    ResourceId: !Ref ClickCounterResource
                    HttpMethod: GET
                    AuthorizationType: NONE
                    Integration:
                      Type: AWS_PROXY
                      IntegrationHttpMethod: POST
                      Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClickCounterFunction.Arn}/invocations'

                # POST Method
                ClickCounterPostMethod:
                  Type: AWS::ApiGateway::Method
                  Properties:
                    RestApiId: !Ref ClickCounterApi
                    ResourceId: !Ref ClickCounterResource
                    HttpMethod: POST
                    AuthorizationType: NONE
                    Integration:
                      Type: AWS_PROXY
                      IntegrationHttpMethod: POST
                      Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClickCounterFunction.Arn}/invocations'

                # Lambda Permission for API Gateway (GET)
                ApiGatewayGetInvokePermission:
                  Type: AWS::Lambda::Permission
                  Properties:
                    FunctionName: !Ref ClickCounterFunction
                    Action: lambda:InvokeFunction
                    Principal: apigateway.amazonaws.com
                    SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ClickCounterApi}/*/GET/clicks'

                # Lambda Permission for API Gateway (POST)
                ApiGatewayPostInvokePermission:
                  Type: AWS::Lambda::Permission
                  Properties:
                    FunctionName: !Ref ClickCounterFunction
                    Action: lambda:InvokeFunction
                    Principal: apigateway.amazonaws.com
                    SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ClickCounterApi}/*/POST/clicks'

                # API Deployment
                ApiDeployment:
                  Type: AWS::ApiGateway::Deployment
                  DependsOn:
                    - ClickCounterGetMethod
                    - ClickCounterPostMethod
                    - ClickCounterOptionsMethod
                  Properties:
                    RestApiId: !Ref ClickCounterApi

                # API Stage
                ApiStage:
                  Type: AWS::ApiGateway::Stage
                  Properties:
                    RestApiId: !Ref ClickCounterApi
                    DeploymentId: !Ref ApiDeployment
                    StageName: prod
                    Description: Production stage

              Outputs:
                ApiEndpoint:
                  Description: API Gateway endpoint URL
                  Value: !Sub 'https://${ClickCounterApi}.execute-api.${AWS::Region}.amazonaws.com/prod/clicks'
                  Export:
                    Name: !Sub '${ProjectName}-api-endpoint'

                LambdaFunctionArn:
                  Description: Lambda function ARN
                  Value: !GetAtt ClickCounterFunction.Arn
                  Export:
                    Name: !Sub '${ProjectName}-lambda-arn'

                DynamoTableName:
                  Description: DynamoDB table name
                  Value: !Ref ClickCounterTable
                  Export:
                    Name: !Sub '${ProjectName}-table-name'
      patches:
        # Pass project name to CloudFormation parameter
        - type: FromCompositeFieldPath
          fromFieldPath: spec.projectName
          toFieldPath: spec.forProvider.parameters.ProjectName

        # Patch CloudFormation outputs back to XR status
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.outputs.ApiEndpoint
          toFieldPath: status.apiEndpoint

        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.outputs.LambdaFunctionArn
          toFieldPath: status.lambdaArn

        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.outputs.DynamoTableName
          toFieldPath: status.dynamoTableName

        # Set Ready condition based on Stack status
        - type: ToCompositeFieldPath
          fromFieldPath: status.conditions[0]
          toFieldPath: status.conditions[0]

  # Define required parameter
  patchSets: []
