apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnsrequests.batch.aws.cloudformation
  labels:
    provider: aws
    service: route53
    resource: dns-request-batch
    method: cloudformation
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: dns.infra.dock.tech/v1alpha1
    kind: XDNSRequest

  mode: Pipeline

  pipeline:
    # Step 1: Lookup hosted zone to get zone ID
    - step: lookup-zone
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: zone-lookup
            base:
              apiVersion: dns.crossplane.poc/v1alpha1
              kind: DNSZone
              spec:
                observeOnly: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.hostedzone
                toFieldPath: spec.zoneName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.env
                toFieldPath: spec.environment
              - type: ToCompositeFieldPath
                fromFieldPath: status.zoneId
                toFieldPath: status.zoneId
            readinessChecks:
              - type: None

    # Step 2: Generate CloudFormation stack with batch records
    - step: generate-cfn-stack
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $zoneId := "" }}
            {{ $env := .observed.composite.resource.spec.env }}
            {{ $hostedzone := .observed.composite.resource.spec.hostedzone }}

            {{- /* Extract zone ID from DNSZone resource or composite status */ -}}
            {{- if .observed.resources }}
            {{- range .observed.resources }}
            {{- if eq .resource.kind "DNSZone" }}
            {{- if .resource.status }}
            {{- if .resource.status.zoneId }}
            {{ $zoneId = .resource.status.zoneId }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* Fallback to composite status if available */ -}}
            {{- if not $zoneId }}
            {{- if .observed.composite.resource.status }}
            {{- if .observed.composite.resource.status.zoneId }}
            {{ $zoneId = .observed.composite.resource.status.zoneId }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- if $zoneId }}
            ---
            apiVersion: cloudformation.aws.upbound.io/v1beta1
            kind: Stack
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-batch-stack
            spec:
              providerConfigRef:
                name: aws-{{ $env }}
              forProvider:
                region: us-east-1
                templateBody: |
                  {
                    "AWSTemplateFormatVersion": "2010-09-09",
                    "Description": "Batch DNS records for {{ $hostedzone }}",
                    "Resources": {
                      {{- $recordCount := len .observed.composite.resource.spec.records }}
                      {{- range $idx, $record := .observed.composite.resource.spec.records }}
                      "Record{{ printf "%04d" $idx }}": {
                        "Type": "AWS::Route53::RecordSet",
                        "Properties": {
                          "HostedZoneId": "{{ $zoneId }}",
                          "Name": "{{ $record.name }}.{{ $hostedzone }}",
                          "Type": "{{ $record.type }}",
                          {{- if eq $record.type "ALIAS" }}
                          {{- if $record.aliasTarget }}
                          "AliasTarget": {
                            "DNSName": "{{ $record.aliasTarget.dnsName }}",
                            "HostedZoneId": "{{ $record.aliasTarget.hostedZoneId }}",
                            "EvaluateTargetHealth": {{ $record.aliasTarget.evaluateTargetHealth | default false }}
                          }
                          {{- end }}
                          {{- else }}
                          "TTL": "{{ $record.ttl | default "300" }}",
                          "ResourceRecords": ["{{ $record.value }}"]
                          {{- end }}
                          {{- if $record.weight }}
                          ,"Weight": {{ $record.weight }},
                          "SetIdentifier": "{{ $record.setidentifier | default (printf "%s-%s" $record.name $record.value) }}"
                          {{- end }}
                        }
                      }{{ if lt $idx (sub $recordCount 1) }},{{ end }}
                      {{- end }}
                    },
                    "Outputs": {
                      "RecordCount": {
                        "Description": "Number of DNS records created",
                        "Value": "{{ $recordCount }}"
                      }
                    }
                  }
                tags:
                  Environment: {{ $env }}
                  ManagedBy: Crossplane
                  GitOps: "true"
                  RequestId: {{ .observed.composite.resource.metadata.name }}
            {{- end }}

    # Step 3: Mark as ready
    - step: auto-ready
      functionRef:
        name: function-auto-ready
