apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnsrequests.aws.dns.infra.dock.tech
  labels:
    provider: aws
    service: route53
    resource: dns-request
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: dns.infra.dock.tech/v1alpha1
    kind: XDNSRequest

  patchSets:
    - name: common-fields
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.env
          toFieldPath: spec.environment
        - type: FromCompositeFieldPath
          fromFieldPath: spec.env
          toFieldPath: spec.providerConfigRef.name
          transforms:
            - type: string
              string:
                fmt: "aws-%s"

  resources:
    # Composed resource 1: XDNSZone (conditional - only for create_hosted_zone action)
    - name: hosted-zone
      base:
        apiVersion: dns.crossplane.poc/v1alpha1
        kind: DNSZone
        spec: {}
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.hostedzone
          toFieldPath: spec.zoneName
        - type: FromCompositeFieldPath
          fromFieldPath: spec.env
          toFieldPath: spec.environment
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.annotations[crossplane.io/external-name]
          toFieldPath: metadata.annotations[crossplane.io/external-name]
          policy:
            fromFieldPath: Optional
        - type: ToCompositeFieldPath
          fromFieldPath: status.zoneId
          toFieldPath: status.zoneId
        - type: ToCompositeFieldPath
          fromFieldPath: status.ready
          toFieldPath: status.conditions[0].status
          transforms:
            - type: map
              map:
                "true": "True"
                "false": "False"
      readinessChecks:
        - type: MatchString
          fieldPath: status.ready
          matchString: "true"

      # Only create if action is create_hosted_zone AND status is approved
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.action
          toFieldPath: metadata.labels[action]
        - type: FromCompositeFieldPath
          fromFieldPath: status.status
          toFieldPath: metadata.labels[approval-status]

    # Composed resource 2-N: XDNSRecord[] (one per record in spec.records)
    # Note: Crossplane does not support dynamic resource generation based on array length
    # This is a limitation - we'll handle multi-record operations via the approval controller
    # creating multiple DNSRequest resources (one per record)

    - name: dns-record-single
      base:
        apiVersion: dns.crossplane.poc/v1alpha1
        kind: DNSRecord
        spec: {}
      patches:
        # Route to correct AWS account
        - type: FromCompositeFieldPath
          fromFieldPath: spec.env
          toFieldPath: spec.environment

        # Map first record fields (limitation: only supports single record per DNSRequest)
        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].name
          toFieldPath: spec.recordName
          transforms:
            - type: string
              string:
                type: Format
                fmt: "%s.%s"
              combine:
                variables:
                  - fromFieldPath: spec.records[0].name
                  - fromFieldPath: spec.hostedzone
                strategy: string

        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].type
          toFieldPath: spec.recordType

        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].ttl
          toFieldPath: spec.ttl
          policy:
            fromFieldPath: Optional

        # Handle regular record values
        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].value
          toFieldPath: spec.values[0]
          policy:
            fromFieldPath: Optional
          transforms:
            - type: string
              string:
                type: Convert
                convert: ToJson

        # Handle ALIAS target
        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].aliasTarget
          toFieldPath: spec.aliasTarget
          policy:
            fromFieldPath: Optional

        # Handle weighted routing
        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].weight
          toFieldPath: spec.weight
          policy:
            fromFieldPath: Optional
          transforms:
            - type: math
              math:
                multiply: 255
                type: Multiply
            - type: math
              math:
                type: Divide
                divide: 100

        - type: FromCompositeFieldPath
          fromFieldPath: spec.records[0].setidentifier
          toFieldPath: spec.setIdentifier
          policy:
            fromFieldPath: Optional

        # Status propagation
        - type: ToCompositeFieldPath
          fromFieldPath: status.ready
          toFieldPath: status.conditions[1].status
          transforms:
            - type: map
              map:
                "true": "True"
                "false": "False"

      readinessChecks:
        - type: MatchString
          fieldPath: status.ready
          matchString: "true"

  # Composition functions (future enhancement for dynamic resource generation)
  # functions:
  #   - name: generate-records
  #     type: Container
  #     container:
  #       image: crossplane/function-patch-and-transform:latest
