apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default

  source:
    repoURL: https://github.com/arthur-bryan/aws-dns-crossplane-poc.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: dns-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: dns.crossplane.poc
      kind: DNSZone
      jsonPointers:
        - /status
        - /metadata/finalizers
        - /metadata/resourceVersion
    - group: dns.crossplane.poc
      kind: DNSRecord
      jsonPointers:
        - /status
        - /metadata/finalizers
        - /metadata/resourceVersion
