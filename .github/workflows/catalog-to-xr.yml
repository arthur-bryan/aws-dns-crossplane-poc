name: Catalog Resource -> Crossplane XR

# APE-style conversion: scaffolder templates write Backstage catalog Resource
# entities under ape-platform-entities/dock-tech/systems/**/resources/**. Crossplane does not
# reconcile those -- it reconciles XRs under ape-platform-entities/environments/**. This job
# is the lab's stand-in for the APE controller that bridges the two: on every
# push that touches the catalog Resources, it regenerates the XRs and commits
# them so the ArgoCD `entities` app applies them.
#
# The commit only ever touches ape-platform-entities/environments/**, never the source
# ape-platform-entities/dock-tech/systems/** -- so the path filter below does not re-trigger
# the workflow (no self-loop).

on:
  push:
    branches:
      - ape-platform-alignment
    paths:
      - 'ape-platform-entities/dock-tech/systems/**/resources/**'

permissions:
  contents: write

concurrency:
  group: catalog-to-xr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ape-platform-alignment
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Generate XRs from catalog Resources
        run: python3 lab/tools/catalog_to_xr.py --repo-root .

      - name: Commit generated XRs (if any)
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain ape-platform-entities/environments)" ]; then
            echo "No XR changes to commit."
            exit 0
          fi
          git config user.name "Arthur Bryan"
          git config user.email "arthurbryan2030@gmail.com"
          git add ape-platform-entities/environments
          git commit -m "chore(dns): regenerate XRs from catalog Resources [skip ci]"
          git push origin HEAD:ape-platform-alignment
