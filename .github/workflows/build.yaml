name: Build and Test Helm Charts

on:
  pull_request:
    branches: [main, feature/**]
  push:
    branches: [main]

jobs:
  lint-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Lint Helm charts
        run: |
          for chart in crossplane-*/; do
            echo "Linting $chart..."
            helm lint "$chart"
          done

  test-charts:
    runs-on: ubuntu-latest
    needs: lint-charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Template charts
        run: |
          for chart in crossplane-*/; do
            echo "Templating $chart..."
            helm template test "$chart" --debug
          done

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate YAML syntax
        run: |
          for file in $(find crossplane-*/tests -name "*.yaml" 2>/dev/null || true); do
            echo "Validating $file..."
            yq eval "$file" > /dev/null
          done
