apiVersion: dns.crossplane.poc/v1alpha1
kind: DNSZone
metadata:
  name: arthurbryan-com
  namespace: dns-system
spec:
  zoneName: arthurbryan.com
  environment: poc
  compositionRef:
    name: dnszones.batch.cloudformation
  comment: "POC test zone"
  tags:
    ManagedBy: Crossplane
    GitOps: "true"
    Environment: poc
    Purpose: testing
    Team: platform

  records:
    - name: www
      type: A
      ttl: 300
      values:
        - "10.0.1.10"

    - name: api
      type: A
      ttl: 300
      values:
        - "10.0.1.11"
      setIdentifier: "api-primary"
      weight: 70

    - name: api
      type: A
      ttl: 300
      values:
        - "10.0.1.21"
      setIdentifier: "api-secondary"
      weight: 30

    - name: db
      type: A
      ttl: 600
      values:
        - "10.0.1.12"

    - name: cache
      type: A
      ttl: 300
      values:
        - "10.0.1.13"

    - name: cdn
      type: A
      aliasTarget:
        dnsName: "d111111abcdef8.cloudfront.net"
        hostedZoneId: "Z2FDTNDATAQYW2"
        evaluateTargetHealth: false

    - name: mail
      type: A
      ttl: 300
      values:
        - "10.0.1.14"

    - name: ftp
      type: A
      ttl: 300
      values:
        - "10.0.1.15"

    - name: admin
      type: A
      ttl: 300
      values:
        - "10.0.1.16"

    - name: monitor
      type: A
      ttl: 300
      values:
        - "10.0.1.17"

    - name: _verify
      type: TXT
      ttl: 300
      values:
        - "v=spf1 include:_spf.google.com ~all"

    - name: _dmarc
      type: TXT
      ttl: 300
      values:
        - "v=DMARC1; p=none; rua=mailto:dmarc@arthurbryan.com"
