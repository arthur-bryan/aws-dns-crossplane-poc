apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-platform-templates
  namespace: dns-platform
data:
  base.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}DNS Lab{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>DNS Lab - Crossplane IDP Portal</h1>
                <nav>
                    <a href="{{ url_for('index') }}" class="nav-btn {% if request.endpoint == 'index' %}active{% endif %}">Create App</a>
                    <a href="{{ url_for('dns_dashboard') }}" class="nav-btn {% if request.endpoint == 'dns_dashboard' %}active{% endif %}">DNS Zones</a>
                    <a href="{{ url_for('resources') }}" class="nav-btn {% if request.endpoint == 'resources' %}active{% endif %}">My Apps</a>
                </nav>
            </header>

            <main>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </main>

            <footer>
                <p>Crossplane DNS Management - IDP Portal Emulation</p>
            </footer>
        </div>
    </body>
    </html>
  index.html: |
    {% extends "base.html" %}

    {% block title %}Create App - DNS Lab{% endblock %}

    {% block content %}
    <div style="margin-bottom: 30px; text-align: center;">
        <a href="{{ url_for('resources') }}" class="btn-secondary" style="display: inline-block; text-decoration: none; padding: 12px 24px;">
            View Applications
        </a>
    </div>

    <section class="page">
        <h2>Create New Click Counter App</h2>
        <form method="POST" action="{{ url_for('provision') }}">
            <div class="form-group">
                <label for="project_name">Project Name</label>
                <input
                    type="text"
                    id="project_name"
                    name="project_name"
                    placeholder="my-project"
                    pattern="[a-z0-9][a-z0-9-]{0,61}[a-z0-9]"
                    required
                >
                <small>Lowercase alphanumeric with hyphens, 3-63 characters</small>
            </div>

            <div class="form-group">
                <label for="zone_name">DNS Zone</label>
                <select id="zone_name" name="zone_name" required>
                    <option value="">Select a zone...</option>
                    {% for zone in zones %}
                    <option value="{{ zone.name }}">{{ zone.name }}</option>
                    {% endfor %}
                </select>
                <small>Select the DNS zone for your application</small>
            </div>

            <div class="form-group">
                <label for="env">Environment</label>
                <select id="env" name="env" required>
                    <option value="dev">Development</option>
                    <option value="hml">Homolog</option>
                    <option value="prd">Production</option>
                </select>
            </div>

            <button type="submit">Provision</button>
        </form>

        {% if not zones %}
        <div class="info-box" style="margin-top: 20px; padding: 15px; background-color: #fff3cd; border-left: 4px solid #ffc107;">
            <strong>Note:</strong> No DNS zones available yet. Create a zone in the DNS Zones tab first.
        </div>
        {% endif %}
    </section>
    {% endblock %}
  dns_dashboard.html: |
    {% extends "base.html" %}

    {% block title %}DNS Zones - Internal Developer Platform{% endblock %}

    {% block content %}
    <div class="container">
        <div class="header">
            <h1>DNS Management</h1>
            <p>Manage Route53 hosted zones via Crossplane DNSZone XRD</p>
        </div>

        <div class="actions">
            <button onclick="document.getElementById('createZoneModal').style.display='block'" class="btn-primary">
                Create New Zone
            </button>
            <a href="/" class="btn-secondary">Back to Apps</a>
        </div>

        {% if zones %}
        <div class="resource-list">
            <h2>Hosted Zones</h2>
            <table>
                <thead>
                    <tr>
                        <th>Zone Name</th>
                        <th>Zone ID</th>
                        <th>Environment</th>
                        <th>Comment</th>
                        <th>Status</th>
                        <th>Name Servers</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for zone in zones %}
                    <tr>
                        <td>
                            <a href="{{ url_for('zone_detail', zone_name=zone.name) }}">
                                {{ zone.zone_name }}
                            </a>
                        </td>
                        <td><code>{{ zone.zone_id or 'Pending...' }}</code></td>
                        <td>{{ zone.environment or '-' }}</td>
                        <td>{{ zone.comment or '-' }}</td>
                        <td>
                            {% if zone.ready %}
                            <span class="status-ready">Ready</span>
                            {% else %}
                            <span class="status-pending">Pending</span>
                            {% endif %}
                        </td>
                        <td>
                            {% if zone.name_servers %}
                            <details>
                                <summary>{{ zone.name_servers|length }} NS</summary>
                                <ul style="font-size: 0.85em; margin: 5px 0;">
                                    {% for ns in zone.name_servers %}
                                    <li><code>{{ ns }}</code></li>
                                    {% endfor %}
                                </ul>
                            </details>
                            {% else %}
                            -
                            {% endif %}
                        </td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_zone', zone_name=zone.name) }}"
                                  style="display: inline;"
                                  onsubmit="return confirm('Delete zone {{ zone.zone_name }}?');">
                                <button type="submit" class="btn-danger-small">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="empty-state">
            <p>No DNS zones found. Create your first zone to get started.</p>
        </div>
        {% endif %}
    </div>

    <div id="createZoneModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('createZoneModal').style.display='none'">&times;</span>
            <h2>Create New DNS Zone</h2>
            <form method="POST" action="{{ url_for('create_zone') }}">
                <div class="form-group">
                    <label for="zone_name">Zone Name (FQDN)</label>
                    <input type="text" id="zone_name" name="zone_name"
                           placeholder="example.com" required
                           pattern="^[a-z0-9.-]+\.[a-z]{2,}$">
                    <small>Enter fully qualified domain name (e.g., infradev.hml.dock.tech)</small>
                </div>

                <div class="form-group">
                    <label for="environment">Environment</label>
                    <select id="environment" name="environment" required>
                        <option value="dev">Development</option>
                        <option value="hml">Homolog</option>
                        <option value="prd">Production</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comment">Comment (optional)</label>
                    <input type="text" id="comment" name="comment"
                           placeholder="Managed zone for development">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Create Zone</button>
                    <button type="button" class="btn-secondary"
                            onclick="document.getElementById('createZoneModal').style.display='none'">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <style>
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: white;
        margin: 10% auto;
        padding: 30px;
        border-radius: 8px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: #000;
    }

    .status-ready {
        color: #28a745;
        font-weight: bold;
    }

    .status-pending {
        color: #ffc107;
        font-weight: bold;
    }

    .btn-danger-small {
        background-color: #dc3545;
        color: white;
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
    }

    .btn-danger-small:hover {
        background-color: #c82333;
    }

    details summary {
        cursor: pointer;
        color: #007bff;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .form-actions button {
        flex: 1;
    }
    </style>
    {% endblock %}
  resources.html: |
    {% extends "base.html" %}

    {% block title %}My Apps - DNS Lab{% endblock %}

    {% block content %}
    <section class="page">
        <h2>Provisioned Resources</h2>
        <div class="resources-actions">
            <a href="{{ url_for('resources') }}" class="btn-secondary">Refresh</a>
        </div>

        {% if apps %}
        <table class="resources-table">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Custom DNS</th>
                    <th>API Gateway DNS</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for app in apps %}
                <tr>
                    <td><strong>{{ app.project_name }}</strong></td>
                    <td>
                        <a href="https://{{ app.dns_url }}" target="_blank">{{ app.dns_url }}</a>
                    </td>
                    <td>
                        {% if app.api_gateway_dns %}
                            {{ app.api_gateway_dns }}
                        {% else %}
                            <em>Provisioning...</em>
                        {% endif %}
                    </td>
                    <td>
                        <span class="status {% if app.ready %}ready{% else %}pending{% endif %}">
                            {% if app.ready %}Ready{% else %}Provisioning{% endif %}
                        </span>
                    </td>
                    <td>
                        <form method="POST" action="{{ url_for('delete', name=app.name) }}" class="delete-form">
                            <button type="submit" class="btn-delete" onclick="return confirm('Delete {{ app.name }}? This removes all AWS resources.')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty-state">No apps found. Create a click counter app to get started.</div>
        {% endif %}
    </section>
    {% endblock %}
  zone_detail.html: |
    {% extends "base.html" %}

    {% block title %}{{ zone_name }} - DNS Zone{% endblock %}

    {% block content %}
    <div class="container">
        <div class="header">
            <h1>DNS Zone: {{ zone_name }}</h1>
            <p>Zone ID: <code>{{ zone_id or 'Pending...' }}</code></p>
        </div>

        <div class="actions">
            <button onclick="document.getElementById('createRecordModal').style.display='block'"
                    class="btn-primary" {% if not zone_id %}disabled title="Wait for zone to be ready"{% endif %}>
                Create DNS Record
            </button>
            <a href="{{ url_for('dns_dashboard') }}" class="btn-secondary">Back to Zones</a>
        </div>

        {% if records %}
        <div class="resource-list">
            <h2>DNS Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Record Name</th>
                        <th>Type</th>
                        <th>TTL</th>
                        <th>Values</th>
                        <th>Weight</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for record in records %}
                    <tr>
                        <td><code>{{ record.record_name }}</code></td>
                        <td><strong>{{ record.record_type }}</strong></td>
                        <td>{{ record.ttl }}s</td>
                        <td>
                            {% if record.values %}
                            <ul style="margin: 0; padding-left: 20px;">
                                {% for value in record.values %}
                                <li><code>{{ value }}</code></li>
                                {% endfor %}
                            </ul>
                            {% elif record.alias_target %}
                            <span title="Alias to {{ record.alias_target.dnsName }}">
                                ALIAS → <code>{{ record.alias_target.dnsName }}</code>
                            </span>
                            {% else %}
                            -
                            {% endif %}
                        </td>
                        <td>
                            {% if record.weight is not none %}
                            {{ record.weight }}
                            {% if record.set_identifier %}
                            <br><small>({{ record.set_identifier }})</small>
                            {% endif %}
                            {% else %}
                            -
                            {% endif %}
                        </td>
                        <td>
                            {% if record.ready %}
                            <span class="status-ready">Ready</span>
                            {% else %}
                            <span class="status-pending">Pending</span>
                            {% endif %}
                        </td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_record', record_name=record.name) }}"
                                  style="display: inline;"
                                  onsubmit="return confirm('Delete record {{ record.record_name }}?');">
                                <input type="hidden" name="zone_name" value="{{ zone.metadata.name }}">
                                <button type="submit" class="btn-danger-small">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="empty-state">
            <p>No DNS records in this zone. Create your first record above.</p>
        </div>
        {% endif %}
    </div>

    <div id="createRecordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('createRecordModal').style.display='none'">&times;</span>
            <h2>Create DNS Record</h2>
            <form method="POST" action="{{ url_for('create_record', zone_name=zone.metadata.name) }}">
                <div class="form-group">
                    <label for="record_name">Record Name (FQDN)</label>
                    <input type="text" id="record_name" name="record_name"
                           placeholder="app.{{ zone_name }}" required>
                    <small>Full domain name (e.g., app.{{ zone_name }})</small>
                </div>

                <div class="form-group">
                    <label for="record_type">Record Type</label>
                    <select id="record_type" name="record_type" required>
                        <option value="A">A - IPv4 Address</option>
                        <option value="CNAME">CNAME - Canonical Name</option>
                        <option value="TXT">TXT - Text</option>
                        <option value="NS">NS - Name Server</option>
                        <option value="ALIAS">ALIAS - AWS Alias</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ttl">TTL (seconds)</label>
                    <input type="number" id="ttl" name="ttl" value="300" min="60" max="86400">
                </div>

                <div class="form-group">
                    <label for="values">Values (comma-separated)</label>
                    <textarea id="values" name="values" rows="3"
                              placeholder="10.0.1.100, 10.0.1.101" required></textarea>
                    <small>For A records: IP addresses. For CNAME: domain name. Separate multiple values with commas.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Create Record</button>
                    <button type="button" class="btn-secondary"
                            onclick="document.getElementById('createRecordModal').style.display='none'">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <style>
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 30px;
        border-radius: 8px;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        max-height: 90vh;
        overflow-y: auto;
    }

    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: #000;
    }

    .status-ready {
        color: #28a745;
        font-weight: bold;
    }

    .status-pending {
        color: #ffc107;
        font-weight: bold;
    }

    .btn-danger-small {
        background-color: #dc3545;
        color: white;
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
    }

    .btn-danger-small:hover {
        background-color: #c82333;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-primary:hover:not(:disabled) {
        background-color: #0056b3;
    }
    </style>
    {% endblock %}
