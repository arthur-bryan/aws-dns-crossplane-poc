apiVersion: v1
kind: Namespace
metadata:
  name: dns-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-platform
  namespace: dns-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-platform-manager
rules:
  - apiGroups: ["dns.crossplane.poc"]
    resources: ["dnszones", "dnsrecords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dns.platform.example"]
    resources: ["clickcounterapps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-platform-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dns-platform-manager
subjects:
  - kind: ServiceAccount
    name: dns-platform
    namespace: dns-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-platform
  namespace: dns-platform
  labels:
    app: dns-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-platform
  template:
    metadata:
      labels:
        app: dns-platform
    spec:
      serviceAccountName: dns-platform
      containers:
        - name: flask-app
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install -q flask kubernetes python-dotenv gunicorn
              cd /app && gunicorn -w 2 -b 0.0.0.0:3000 app:app
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: SECRET_KEY
              value: "change-in-production"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: app-templates
              mountPath: /app/templates
            - name: app-static
              mountPath: /app/static
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: app-code
          configMap:
            name: dns-platform-code
        - name: app-templates
          configMap:
            name: dns-platform-templates
        - name: app-static
          configMap:
            name: dns-platform-static
---
apiVersion: v1
kind: Service
metadata:
  name: dns-platform
  namespace: dns-platform
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
      name: http
  selector:
    app: dns-platform
