    import re


    def validate_project_name(project_name):
        if not project_name:
            return False, "Project name is required"

        if not isinstance(project_name, str):
            return False, "Project name must be a string"

        trimmed = project_name.strip()

        if len(trimmed) < 3 or len(trimmed) > 63:
            return False, "Project name must be 3-63 characters"

        pattern = re.compile(r"^[a-z0-9]([a-z0-9-]*[a-z0-9])?$")
        if not pattern.match(trimmed):
            return False, "Project name must contain only lowercase letters, numbers, and hyphens; must start and end with alphanumeric"

        return True, None


    def validate_domain(domain):
        if not domain:
            return False, "Domain is required"

        if not isinstance(domain, str):
            return False, "Domain must be a string"

        trimmed = domain.strip()

        if len(trimmed) < 3 or len(trimmed) > 253:
            return False, "Domain must be 3-253 characters"

        pattern = re.compile(r"^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$")
        if not pattern.match(trimmed):
            return False, "Invalid domain format"

        return True, None
