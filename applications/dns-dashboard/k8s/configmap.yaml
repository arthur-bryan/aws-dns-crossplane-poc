    from kubernetes import client, config
    from kubernetes.client.rest import ApiException


    class Provisioner:
        def __init__(self):
            try:
                config.load_incluster_config()
            except config.ConfigException:
                config.load_kube_config()

            self.api = client.CustomObjectsApi()
            self.group = "dns.platform.example"
            self.version = "v1alpha1"
            self.plural = "clickcounterapps"
            self.namespace = "default"

        def provision(self, project_name, domain, region="us-east-2"):
            manifest = {
                "apiVersion": f"{self.group}/{self.version}",
                "kind": "ClickCounterApp",
                "metadata": {
                    "name": project_name,
                    "namespace": self.namespace
                },
                "spec": {
                    "projectName": project_name,
                    "domain": domain,
                    "region": region
                }
            }

            response = self.api.create_namespaced_custom_object(
                group=self.group,
                version=self.version,
                namespace=self.namespace,
                plural=self.plural,
                body=manifest
            )

            return {
                "name": response["metadata"]["name"],
                "namespace": response["metadata"]["namespace"],
                "uid": response["metadata"]["uid"]
            }

        def get_status(self, name):
            response = self.api.get_namespaced_custom_object(
                group=self.group,
                version=self.version,
                namespace=self.namespace,
                plural=self.plural,
                name=name
            )

            status = response.get("status", {})
            spec = response.get("spec", {})

            return {
                "ready": self._is_ready(status),
                "api_endpoint": status.get("apiEndpoint"),
                "dns_url": f"{spec.get('projectName')}.{spec.get('domain')}",
                "stack_id": status.get("stackId")
            }

        def exists(self, name):
            try:
                self.api.get_namespaced_custom_object(
                    group=self.group,
                    version=self.version,
                    namespace=self.namespace,
                    plural=self.plural,
                    name=name
                )
                return True
            except ApiException as e:
                if e.status == 404:
                    return False
                raise

        def list_all(self):
            response = self.api.list_namespaced_custom_object(
                group=self.group,
                version=self.version,
                namespace=self.namespace,
                plural=self.plural
            )

            resources = []
            for item in response.get("items", []):
                spec = item.get("spec", {})
                status = item.get("status", {})

                api_endpoint = status.get("apiEndpoint")
                api_gateway_dns = None
                if api_endpoint:
                    parts = api_endpoint.replace("https://", "").replace("http://", "").split("/")
                    api_gateway_dns = parts[0] if parts else None

                resources.append({
                    "name": item["metadata"]["name"],
                    "project_name": spec.get("projectName"),
                    "domain": spec.get("domain"),
                    "dns_url": f"{spec.get('projectName')}.{spec.get('domain')}",
                    "ready": self._is_ready(status),
                    "api_endpoint": api_endpoint,
                    "api_gateway_dns": api_gateway_dns,
                    "created_at": item["metadata"].get("creationTimestamp")
                })

            return resources

        def delete(self, name):
            self.api.delete_namespaced_custom_object(
                group=self.group,
                version=self.version,
                namespace=self.namespace,
                plural=self.plural,
                name=name
            )

        def _is_ready(self, status):
            conditions = status.get("conditions", [])
            for condition in conditions:
                if condition.get("type") == "Ready" and condition.get("status") == "True":
                    return True
            return False
