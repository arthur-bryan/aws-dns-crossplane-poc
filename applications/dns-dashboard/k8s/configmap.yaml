    import os
    import sys
    from flask import Flask, render_template, request, redirect, url_for, flash
    from dotenv import load_dotenv
    from kubernetes.client.rest import ApiException

    from provisioner import Provisioner
    from dns_provisioner import DNSProvisioner
    from validator import validate_project_name, validate_domain

    load_dotenv(os.path.join(os.path.dirname(__file__), "..", "config.env"))

    app = Flask(__name__)
    app.secret_key = os.environ.get("SECRET_KEY", "dev-secret-key-change-in-production")

    provisioner = Provisioner()
    dns_provisioner = DNSProvisioner()


    @app.route("/")
    def index():
        try:
            zones = dns_provisioner.list_zones()
            return render_template("index.html", zones=zones)
        except Exception as e:
            flash(f"Error loading zones: {str(e)}", "error")
            return render_template("index.html", zones=[])


    @app.route("/dns")
    def dns_dashboard():
        """DNS zones management dashboard"""
        try:
            zones = dns_provisioner.list_zones()
            return render_template("dns_dashboard.html", zones=zones)
        except Exception as e:
            flash(f"Error loading zones: {str(e)}", "error")
            return render_template("dns_dashboard.html", zones=[])


    @app.route("/provision", methods=["POST"])
    def provision():
        project_name = request.form.get("project_name", "").strip().lower()
        domain = request.form.get("domain", "").strip().lower()

        valid, error = validate_project_name(project_name)
        if not valid:
            flash(error, "error")
            return redirect(url_for("index"))

        valid, error = validate_domain(domain)
        if not valid:
            flash(error, "error")
            return redirect(url_for("index"))

        try:
            if provisioner.exists(project_name):
                flash(f"App '{project_name}' already exists", "error")
                return redirect(url_for("index"))

            provisioner.provision(
                project_name=project_name,
                domain=domain,
                region="us-east-2"
            )

            flash(f"App '{project_name}' provisioning started. URL: {project_name}.{domain}", "success")
            return redirect(url_for("resources"))

        except ApiException as e:
            flash(f"Kubernetes API error: {e.reason}", "error")
            return redirect(url_for("index"))
        except Exception as e:
            flash(f"Error: {str(e)}", "error")
            return redirect(url_for("index"))


    @app.route("/resources")
    def resources():
        try:
            apps = provisioner.list_all()
            return render_template("resources.html", apps=apps)
        except ApiException as e:
            flash(f"Failed to list resources: {e.reason}", "error")
            return render_template("resources.html", apps=[])
        except Exception as e:
            flash(f"Error: {str(e)}", "error")
            return render_template("resources.html", apps=[])


    @app.route("/delete/<name>", methods=["POST"])
    def delete(name):
        try:
            provisioner.delete(name)
            flash(f"App '{name}' deletion started", "success")
        except ApiException as e:
            if e.status == 404:
                flash(f"App '{name}' not found", "error")
            else:
                flash(f"Failed to delete: {e.reason}", "error")
        except Exception as e:
            flash(f"Error: {str(e)}", "error")

        return redirect(url_for("resources"))


    @app.route("/dns/zones/create", methods=["POST"])
    def create_zone():
        """Create a new DNS zone"""
        zone_name = request.form.get("zone_name", "").strip()
        comment = request.form.get("comment", "").strip()
        environment = request.form.get("environment", "dev").strip()

        if not zone_name:
            flash("Zone name is required", "error")
            return redirect(url_for("dns_dashboard"))

        try:
            if dns_provisioner.zone_exists(dns_provisioner._sanitize_name(zone_name)):
                flash(f"Zone '{zone_name}' already exists", "error")
                return redirect(url_for("dns_dashboard"))

            dns_provisioner.create_zone(zone_name, environment, comment)
            flash(f"Zone '{zone_name}' created successfully", "success")
        except ApiException as e:
            flash(f"Kubernetes API error: {e.reason}", "error")
        except Exception as e:
            flash(f"Error: {str(e)}", "error")

        return redirect(url_for("dns_dashboard"))


    @app.route("/dns/zones/<zone_name>")
    def zone_detail(zone_name):
        """Show zone details and records"""
        try:
            zone = dns_provisioner.get_zone(zone_name)
            records = dns_provisioner.list_records()

            zone_id = zone.get("status", {}).get("zoneId")
            zone_records = [r for r in records if r.get("zone_id") == zone_id]

            return render_template("zone_detail.html",
                                 zone=zone,
                                 zone_name=zone.get("spec", {}).get("zoneName"),
                                 zone_id=zone_id,
                                 records=zone_records)
        except ApiException as e:
            if e.status == 404:
                flash(f"Zone '{zone_name}' not found", "error")
            else:
                flash(f"Error: {e.reason}", "error")
            return redirect(url_for("dns_dashboard"))
        except Exception as e:
            flash(f"Error: {str(e)}", "error")
            return redirect(url_for("dns_dashboard"))


    @app.route("/dns/zones/<zone_name>/records/create", methods=["POST"])
    def create_record(zone_name):
        """Create a DNS record"""
        try:
            zone = dns_provisioner.get_zone(zone_name)
            zone_id = zone.get("status", {}).get("zoneId")
            environment = zone.get("spec", {}).get("environment", "dev")

            if not zone_id:
                flash("Zone is not ready yet", "error")
                return redirect(url_for("zone_detail", zone_name=zone_name))

            record_name = request.form.get("record_name", "").strip()
            record_type = request.form.get("record_type", "").strip()
            ttl = int(request.form.get("ttl", 300))
            values = request.form.get("values", "").strip()

            if not record_name or not record_type:
                flash("Record name and type are required", "error")
                return redirect(url_for("zone_detail", zone_name=zone_name))

            values_list = [v.strip() for v in values.split(",") if v.strip()]

            dns_provisioner.create_record(
                zone_id=zone_id,
                record_name=record_name,
                record_type=record_type,
                environment=environment,
                ttl=ttl,
                values=values_list
            )

            flash(f"Record '{record_name}' created successfully", "success")
        except ApiException as e:
            flash(f"Kubernetes API error: {e.reason}", "error")
        except Exception as e:
            flash(f"Error: {str(e)}", "error")

        return redirect(url_for("zone_detail", zone_name=zone_name))


    @app.route("/dns/zones/<zone_name>/delete", methods=["POST"])
    def delete_zone(zone_name):
        """Delete a DNS zone"""
        try:
            dns_provisioner.delete_zone(zone_name)
            flash(f"Zone '{zone_name}' deletion started", "success")
        except ApiException as e:
            if e.status == 404:
                flash(f"Zone '{zone_name}' not found", "error")
            else:
                flash(f"Failed to delete: {e.reason}", "error")
        except Exception as e:
            flash(f"Error: {str(e)}", "error")

        return redirect(url_for("dns_dashboard"))


    @app.route("/dns/records/<record_name>/delete", methods=["POST"])
    def delete_record(record_name):
        """Delete a DNS record"""
        zone_name = request.form.get("zone_name")

        try:
            dns_provisioner.delete_record(record_name)
            flash(f"Record '{record_name}' deletion started", "success")
        except ApiException as e:
            if e.status == 404:
                flash(f"Record '{record_name}' not found", "error")
            else:
                flash(f"Failed to delete: {e.reason}", "error")
        except Exception as e:
            flash(f"Error: {str(e)}", "error")

        if zone_name:
            return redirect(url_for("zone_detail", zone_name=zone_name))
        return redirect(url_for("dns_dashboard"))


    @app.route("/health")
    def health():
        return {"status": "ok"}


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", 3000))
        debug = os.environ.get("FLASK_DEBUG", "false").lower() == "true"
        app.run(host="0.0.0.0", port=port, debug=debug)
