    from kubernetes import client, config
    from kubernetes.client.rest import ApiException


    class DNSProvisioner:
        """Manages DNS zones and records via Crossplane XRDs"""

        def __init__(self):
            try:
                config.load_incluster_config()
            except config.ConfigException:
                config.load_kube_config()

            self.api = client.CustomObjectsApi()
            self.zone_group = "dns.crossplane.poc"
            self.version = "v1alpha1"
            self.zone_plural = "dnszones"
            self.record_plural = "dnsrecords"
            self.default_namespace = "dns-system"

        # Zone operations
        def create_zone(self, zone_name, environment="dev", comment="", namespace=None):
            """Create a Route53 hosted zone"""
            namespace = namespace or self.default_namespace

            manifest = {
                "apiVersion": f"{self.zone_group}/{self.version}",
                "kind": "DNSZone",
                "metadata": {
                    "name": self._sanitize_name(zone_name),
                    "namespace": namespace
                },
                "spec": {
                    "zoneName": zone_name,
                    "environment": environment,
                    "comment": comment or f"Managed zone for {zone_name}"
                }
            }

            return self.api.create_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.zone_plural,
                body=manifest
            )

        def get_zone(self, name, namespace=None):
            """Get zone details"""
            namespace = namespace or self.default_namespace

            return self.api.get_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.zone_plural,
                name=name
            )

        def list_zones(self, namespace=None):
            """List all zones"""
            namespace = namespace or self.default_namespace

            response = self.api.list_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.zone_plural
            )

            zones = []
            for item in response.get("items", []):
                spec = item.get("spec", {})
                status = item.get("status", {})

                zones.append({
                    "name": item["metadata"]["name"],
                    "zone_name": spec.get("zoneName"),
                    "comment": spec.get("comment"),
                    "zone_id": status.get("zoneId"),
                    "name_servers": status.get("nameServers", []),
                    "ready": self._is_ready(status),
                    "created_at": item["metadata"].get("creationTimestamp")
                })

            return zones

        def delete_zone(self, name, namespace=None):
            """Delete a zone"""
            namespace = namespace or self.default_namespace

            self.api.delete_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.zone_plural,
                name=name
            )

        def zone_exists(self, name, namespace=None):
            """Check if zone exists"""
            namespace = namespace or self.default_namespace

            try:
                self.get_zone(name, namespace)
                return True
            except ApiException as e:
                if e.status == 404:
                    return False
                raise

        # Record operations
        def create_record(self, zone_id, record_name, record_type, environment="dev",
                          ttl=300, values=None, alias_target=None, weight=None,
                          set_identifier=None, namespace=None):
            """Create a DNS record"""
            namespace = namespace or self.default_namespace

            spec = {
                "zoneId": zone_id,
                "recordName": record_name,
                "recordType": record_type,
                "environment": environment,
                "ttl": ttl
            }

            if values:
                spec["values"] = values

            if alias_target:
                spec["aliasTarget"] = alias_target

            if weight is not None:
                spec["weight"] = weight

            if set_identifier:
                spec["setIdentifier"] = set_identifier

            manifest = {
                "apiVersion": f"{self.zone_group}/{self.version}",
                "kind": "DNSRecord",
                "metadata": {
                    "name": self._sanitize_name(f"{record_name}-{record_type.lower()}"),
                    "namespace": namespace
                },
                "spec": spec
            }

            return self.api.create_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.record_plural,
                body=manifest
            )

        def get_record(self, name, namespace=None):
            """Get record details"""
            namespace = namespace or self.default_namespace

            return self.api.get_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.record_plural,
                name=name
            )

        def list_records(self, zone_name=None, namespace=None):
            """List all records, optionally filtered by zone"""
            namespace = namespace or self.default_namespace

            response = self.api.list_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.record_plural
            )

            records = []
            for item in response.get("items", []):
                spec = item.get("spec", {})
                status = item.get("status", {})

                record = {
                    "name": item["metadata"]["name"],
                    "zone_id": spec.get("zoneId"),
                    "record_name": spec.get("recordName"),
                    "record_type": spec.get("recordType"),
                    "ttl": spec.get("ttl"),
                    "values": spec.get("values", []),
                    "alias_target": spec.get("aliasTarget"),
                    "weight": spec.get("weight"),
                    "set_identifier": spec.get("setIdentifier"),
                    "ready": self._is_ready(status),
                    "created_at": item["metadata"].get("creationTimestamp")
                }

                records.append(record)

            if zone_name:
                records = [r for r in records if zone_name in r.get("record_name", "")]

            return records

        def delete_record(self, name, namespace=None):
            """Delete a record"""
            namespace = namespace or self.default_namespace

            self.api.delete_namespaced_custom_object(
                group=self.zone_group,
                version=self.version,
                namespace=namespace,
                plural=self.record_plural,
                name=name
            )

        # Helper methods
        def _sanitize_name(self, name):
            """Convert domain name to valid Kubernetes resource name"""
            return name.replace(".", "-").replace("_", "-").lower()

        def _is_ready(self, status):
            """Check if resource is ready"""
            conditions = status.get("conditions", [])
            for condition in conditions:
                if condition.get("type") == "Ready" and condition.get("status") == "True":
                    return True
            return False
